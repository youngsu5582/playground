<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="215" width="560" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="600" y="215" width="560" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1180" y="215" width="180" height="80" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="450" y="110" width="300" height="50" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="380" width="640" height="150" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="720" y="380" width="640" height="150" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><path d="M 40.0 190.0 L 1360.0 190.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 600.0 160.0 L 600.0 215.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 1270.0 295.0 L 1270.0 340.0 L 600.0 340.0 L 600.0 297.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">체크포인트와 크래시 복구</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">체크포인트 = 모든 더러운 페이지를 디스크로 flush 하고 특별한 체크포인트 레코드를 WAL 에 기록한다</tspan></text><rect x="1135.4" y="156.9" width="129.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" y="172.9">WAL 이 쌓이는 방향</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="320.0" y="251.3">redo 지점 이전</tspan><tspan x="320.0" y="270.1">데이터 파일 변경은 이미 디스크에 있다고 보장</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="251.3">redo 지점부터 끝까지</tspan><tspan x="880.0" y="270.1">데이터 페이지에 반영 안 된 변경이 있을 수 있다 → REDO</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" y="261.5">크래시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="140.3">체크포인트 레코드 → redo 지점을 알려 준다</tspan></text><rect x="829.0" y="328.9" width="202.1" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="930.0" y="344.9">크래시 뒤: 여기서부터 WAL 재생</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="408.1">체크포인트는 언제 시작하나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="432.1">checkpoint_timeout (기본 5분) 마다</tspan><tspan x="56.0" y="449.6">또는 max_wal_size (기본 1GB) 가 곧 넘을 때 — 빠른 쪽</tspan><tspan x="56.0" y="467.1">그 사이 WAL 이 안 쓰였으면 건너뛴다</tspan><tspan x="56.0" y="484.6">SQL CHECKPOINT 로 강제할 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="407.1">실측 (psql 2026-10-13) — CHECKPOINT 뒤 서버 로그</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="430.8">checkpoint starting: immediate force wait</tspan><tspan x="736.0" y="448.3">checkpoint complete: wrote 124 buffers (0.8%) …</tspan><tspan x="736.0" y="465.8">                    redo lsn=0/19C6DE0</tspan><tspan x="736.0" y="483.3">log_checkpoints 는 16 에서 기본 on</tspan></text></svg>