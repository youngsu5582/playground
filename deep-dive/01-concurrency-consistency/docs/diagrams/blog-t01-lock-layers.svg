<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="564" viewBox="0 0 1400 564"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="300.0" y="100" width="346.6666666666667" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="656.6666666666667" y="100" width="346.6666666666667" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1013.3333333333334" y="100" width="346.6666666666667" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="168" width="250" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="300.0" y="168" width="346.6666666666667" height="84" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="656.6666666666667" y="168" width="346.6666666666667" height="84" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1013.3333333333334" y="168" width="346.6666666666667" height="84" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="262" width="250" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="300.0" y="262" width="346.6666666666667" height="84" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="656.6666666666667" y="262" width="346.6666666666667" height="84" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1013.3333333333334" y="262" width="346.6666666666667" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="356" width="250" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="300.0" y="356" width="346.6666666666667" height="84" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="656.6666666666667" y="356" width="346.6666666666667" height="84" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1013.3333333333334" y="356" width="346.6666666666667" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="450" width="250" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="300.0" y="450" width="346.6666666666667" height="84" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="656.6666666666667" y="450" width="346.6666666666667" height="84" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1013.3333333333334" y="450" width="346.6666666666667" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">락의 네 층 (lmgr README)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">위에서 아래로 갈수록 사용자가 가까이 보는 락이 된다 — 데드락 검출은 일반 락에만 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="473.3" y="133.3">성격</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="133.3">데드락 검출 · 해제</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1186.7" y="133.3">사용자가 보는 곳</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="165.0" y="215.3">스핀락 (spinlock)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="473.3" y="206.6">아주 짧은 시간용</tspan><tspan x="473.3" y="224.1">기다리는 쪽이 바쁘게 돈다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="206.6">검출 없음</tspan><tspan x="830.0" y="224.1">에러 때 자동 해제 없음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1186.7" y="206.6">직접 안 보인다</tspan><tspan x="1186.7" y="224.1">(엔진 내부)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="165.0" y="309.3">LWLock (lightweight)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="473.3" y="300.6">공유 메모리 자료구조 접근을</tspan><tspan x="473.3" y="318.1">맞춘다 · 배타 / 공유 모드</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="300.6">검출 없음</tspan><tspan x="830.0" y="318.1">에러 복구 때 자동 해제</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1186.7" y="300.6">wait_event_type = LWLock</tspan><tspan x="1186.7" y="318.1">(예: ProcArray)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="165.0" y="403.3">일반(무거운) 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="473.3" y="394.6">다중 모드 · 충돌 규칙 표</tspan><tspan x="473.3" y="412.1">사용자 요청 락은 이걸 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="394.6">검출 있음</tspan><tspan x="830.0" y="412.1">트랜잭션 끝에 자동 해제</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1186.7" y="394.6">pg_locks: relation ·</tspan><tspan x="1186.7" y="412.1">transactionid · tuple · advisory</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="165.0" y="497.3">SIReadLock (predicate)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="473.3" y="497.3">README 는 README-SSI 로 넘긴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="488.6">블로킹하지 않아</tspan><tspan x="830.0" y="506.1">데드락에 참여하지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1186.7" y="497.3">pg_locks.mode = SIReadLock</tspan></text></svg>