<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="380" height="160" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="560" y="110" width="780" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="184" width="780" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="258" width="780" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="332" width="780" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="406" width="780" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="560" y="480" width="780" height="62" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="560" y="554" width="780" height="52" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 141.0 L 560.0 141.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 215.0 L 560.0 215.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 289.0 L 560.0 289.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 363.0 L 560.0 363.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 437.0 L 560.0 437.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 420.0 210.0 L 490.0 210.0 L 490.0 511.0 L 560.0 511.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">ps 로 본 인스턴스 — postmaster 와 그 자식들</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(실측: psql 2026-10-13, PostgreSQL 16.14 컨테이너) 연결 1개 = 프로세스 1개</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="159.1">postmaster  (PID 1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="183.3">인스턴스의 맨 처음 프로세스</tspan><tspan x="56.0" y="200.8">보조 프로세스를 시작 · 관리하고</tspan><tspan x="56.0" y="218.3">연결 요청마다 백엔드를 만든다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="137.6">checkpointer  (PID 62)</tspan><tspan x="950.0" y="155.1">체크포인트 실행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="211.6">background writer  (PID 63)</tspan><tspan x="950.0" y="229.1">더러운 데이터 페이지를 파일 시스템에 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="285.6">walwriter  (PID 65)</tspan><tspan x="950.0" y="303.1">공유 메모리의 WAL 레코드를 WAL 파일에 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="359.6">autovacuum launcher  (PID 66)</tspan><tspan x="950.0" y="377.1">VACUUM · ANALYZE 를 돌릴 worker 를 띄운다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="433.6">logical replication launcher  (PID 67)</tspan><tspan x="950.0" y="451.1">논리 복제 (이 글에서는 다루지 않음)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="507.6">postgres: lab lab [local] SELECT  (PID 97)</tspan><tspan x="950.0" y="525.1">client backend — 연결 1개 = 프로세스 1개</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="585.3">startup — 크래시 복구 때만 WAL 재생 (평상시에는 없다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="344.1">보조 프로세스는 pg_stat_activity 에서</tspan><tspan x="40.0" y="361.6">wait_event_type = Activity 로 일을 기다린다</tspan><tspan x="40.0" y="379.1">(CheckpointerMain · BgWriterMain ·</tspan><tspan x="40.0" y="396.6">WalWriterMain · AutoVacuumMain)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="464.1">운영 쿼리에 backend_type = &#x27;client backend&#x27;</tspan><tspan x="40.0" y="481.6">를 붙이는 이유: 붙이지 않으면 위 보조</tspan><tspan x="40.0" y="499.1">프로세스가 섞여 나온다</tspan></text></svg>