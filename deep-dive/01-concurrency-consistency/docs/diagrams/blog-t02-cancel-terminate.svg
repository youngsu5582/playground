<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="546" viewBox="0 0 1400 546"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="310.0" y="100" width="343.3333333333333" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="663.3333333333333" y="100" width="343.3333333333333" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1016.6666666666666" y="100" width="343.3333333333333" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="168" width="260" height="96" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="310.0" y="168" width="343.3333333333333" height="96" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="663.3333333333333" y="168" width="343.3333333333333" height="96" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1016.6666666666666" y="168" width="343.3333333333333" height="96" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="274" width="260" height="96" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="310.0" y="274" width="343.3333333333333" height="96" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="663.3333333333333" y="274" width="343.3333333333333" height="96" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1016.6666666666666" y="274" width="343.3333333333333" height="96" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="380" width="260" height="96" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="310.0" y="380" width="343.3333333333333" height="96" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="663.3333333333333" y="380" width="343.3333333333333" height="96" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1016.6666666666666" y="380" width="343.3333333333333" height="96" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">취소와 종료 — 실측한 세 장면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(실측: psql 2026-10-13) A = idle in transaction 루트, B = A 를 기다리는 UPDATE, C = B 를 기다리는 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="481.7" y="133.3">무슨 일이 일어났나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="835.0" y="133.3">그 세션의 상태</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1188.3" y="133.3">기다리던 쪽은</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="221.3">pg_cancel_backend(A)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="481.7" y="221.3">true 를 돌려줬다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="835.0" y="212.6">A 는 그대로</tspan><tspan x="835.0" y="230.1">idle in transaction</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1188.3" y="212.6">도는 쿼리가 없어서</tspan><tspan x="1188.3" y="230.1">취소할 것이 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="318.6">pg_cancel_backend(B)</tspan><tspan x="170.0" y="336.1">B 는 락 대기 중</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="481.7" y="318.6">B 의 UPDATE 가 ERROR:</tspan><tspan x="481.7" y="336.1">canceling statement due to user request</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="835.0" y="318.6">B 는 idle in transaction</tspan><tspan x="835.0" y="336.1">(aborted) — 연결은 살아 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1188.3" y="318.6">C 는 한 칸 앞으로</tspan><tspan x="1188.3" y="336.1">(여전히 A 를 기다림)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="433.3">pg_terminate_backend(A)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="481.7" y="424.6">FATAL: terminating connection</tspan><tspan x="481.7" y="442.1">due to administrator command</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="835.0" y="424.6">A 가 사라지고</tspan><tspan x="835.0" y="442.1">그 트랜잭션은 롤백</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1188.3" y="424.6">기다리던 C 가</tspan><tspan x="1188.3" y="442.1">바로 락을 얻었다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="514.1">고르는 기준 (해석): 쿼리가 도는 중이면 취소로 충분하다. 트랜잭션만 열어 두고 놀고 있으면 종료밖에 없다.</tspan></text></svg>