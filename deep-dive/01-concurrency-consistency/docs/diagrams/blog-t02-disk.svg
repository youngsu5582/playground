<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="200" width="280" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="440" y="110" width="920" height="120" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="440" y="260" width="920" height="120" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="440" y="410" width="920" height="120" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 320.0 250.0 L 380.0 250.0 L 380.0 170.0 L 440.0 170.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 320.0 250.0 L 380.0 250.0 L 380.0 320.0 L 440.0 320.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 320.0 250.0 L 380.0 250.0 L 380.0 470.0 L 440.0 470.0" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">디스크가 찬다 — 무엇이 큰가 (쿼리 10)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">원인별 읽기는 해석이고, 문서 근거는 표시한 것만</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="229.1">디스크가 찬다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="253.3">쿼리 10 의 네 쿼리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="138.1">테이블 · 인덱스가 크다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="162.1">bloat 인지 정상 성장인지 쿼리 7 · 4 (horizon 을 붙잡는 트랜잭션)</tspan><tspan x="456.0" y="179.6">일반 VACUUM 은 공간을 OS 에 돌려주지 않는다 (01.01 문서 06)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="288.1">WAL 이 크다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="312.1">슬롯의 active = false · wal_status = extended 이면 슬롯이 WAL 을 붙잡고 있다</tspan><tspan x="456.0" y="329.6">max_wal_size 는 소프트 한도 (부하 · 실패하는 archive_command · 큰 wal_keep_size 때 넘을 수 있음)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="438.1">그 밖 (로그 · 임시 파일 등)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="462.1">이 문서에서 확인하지 못했다</tspan></text></svg>