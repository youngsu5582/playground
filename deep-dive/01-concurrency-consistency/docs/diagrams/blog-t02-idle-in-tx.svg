<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="190" width="380" height="160" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="560" y="100" width="780" height="110" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="560" y="250" width="780" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="560" y="400" width="780" height="110" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><path d="M 420.0 270.0 L 490.0 270.0 L 490.0 155.0 L 560.0 155.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 420.0 270.0 L 490.0 270.0 L 490.0 305.0 L 560.0 305.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 420.0 270.0 L 490.0 270.0 L 490.0 455.0 L 560.0 455.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">idle in transaction 이 쥐고 있는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">쿼리는 안 도는데 트랜잭션은 열려 있다 — 앱이 외부 호출 · 사용자 대기 중이거나 커밋을 빼먹은 상태</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="218.1">idle in transaction 세션</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="242.1">xact_age 가 크다</tspan><tspan x="56.0" y="259.6">state = idle in transaction</tspan><tspan x="56.0" y="277.1">(aborted) 는 에러 뒤 롤백을</tspan><tspan x="56.0" y="294.6">안 한 앱 버그의 전형</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="128.1">락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="152.1">남의 UPDATE 를 줄 세운다</tspan><tspan x="576.0" y="169.6">(쿼리 1 · 2 의 루트 후보)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="278.1">연결 슬롯</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="302.1">풀 · max_connections 를 차지한다</tspan><tspan x="576.0" y="319.6">(쿼리 5 의 idle_in_tx)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="428.1">VACUUM horizon</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="452.1">backend_xmin 이 오래되면 죽은 튜플을</tspan><tspan x="576.0" y="469.6">치우는 기준선을 붙잡는다 (쿼리 4 · 7)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="560.0" y="530.1">(실측) 쿼리 하나가 도는 중인 세션(274)도 backend_xmin 을 갖는다 — 읽기 전용이어도 스냅샷이 열려 있는 동안 horizon 을 붙잡는다</tspan></text></svg>