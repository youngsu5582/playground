<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="350" height="190" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="510" y="130" width="350" height="190" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="980" y="130" width="350" height="190" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="360" width="1300" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 510.0 225.0 L 390.0 225.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 980.0 225.0 L 860.0 225.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">blocked_by 는 사슬로 나온다 — 루트를 찾아라</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(실측: psql 2026-10-13) 세션 A 가 UPDATE 후 커밋 안 함, B · C 가 같은 행 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="158.1">A  pid 158  (루트)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="182.1">state = idle in transaction</tspan><tspan x="56.0" y="199.6">update obs set v=1 where id=1;</tspan><tspan x="56.0" y="217.1">자기는 안 막혔고 남을 막는다</tspan><tspan x="56.0" y="234.6">(blocking_count = 1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="158.1">B  pid 165</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="182.1">state = active</tspan><tspan x="526.0" y="199.6">wait_event_type = Lock</tspan><tspan x="526.0" y="217.1">wait_event = transactionid</tspan><tspan x="526.0" y="234.6">blocked_by = {158}</tspan><tspan x="526.0" y="252.1">update obs set v=2 where id=1;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="158.1">C  pid 172</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="182.1">state = active</tspan><tspan x="996.0" y="199.6">wait_event_type = Lock</tspan><tspan x="996.0" y="217.1">wait_event = tuple</tspan><tspan x="996.0" y="234.6">blocked_by = {165}</tspan><tspan x="996.0" y="252.1">update obs set v=3 where id=1;</tspan></text><rect x="412.7" y="175.8" width="74.7" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="450.0" y="191.8">A 의 ID 를</tspan><tspan x="450.0" y="208.1">기다린다</tspan></text><rect x="874.7" y="175.8" width="90.5" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="920.0" y="191.8">B 에게 막혀</tspan><tspan x="920.0" y="208.1">tuple 락 대기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="388.1">읽는 법</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="412.1">C 는 A 가 아니라 B 에게 막혀 있다 — 같은 행 UPDATE 대기일 때 blocked_by 는 C → B → A 의 사슬이고 맨 끝이 루트다</tspan><tspan x="56.0" y="429.6">(같은 키 유니크 INSERT 대기는 전부 삽입자 하나를 가리킨다 — 실측: psql 2026-10-13, 01.03 문서 08)</tspan><tspan x="56.0" y="447.1">막힌 쪽(B · C)을 죽이면 줄만 바뀐다 — 루트(A)를 찾는다 (쿼리 2)</tspan></text></svg>