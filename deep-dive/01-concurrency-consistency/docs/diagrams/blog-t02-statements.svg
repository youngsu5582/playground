<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40.0" y="120" width="386.6666666666667" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="506.6666666666667" y="120" width="386.6666666666667" height="140" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="973.3333333333334" y="120" width="386.6666666666667" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="290" width="1320" height="100" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 426.7 190.0 L 506.7 190.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 893.3 190.0 L 973.3 190.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">pg_stat_statements 는 확장이다 — 세 단계가 모두 필요하다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(실측: psql 2026-10-13) preload 없이 CREATE EXTENSION 만 하면 조회 때 에러가 난다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">1  postgresql.conf</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">shared_preload_libraries =</tspan><tspan x="56.0" y="189.6">&#x27;pg_stat_statements&#x27;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="522.7" y="148.1">2  서버 재시작</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="522.7" y="172.1">추가 공유 메모리가</tspan><tspan x="522.7" y="189.6">필요하므로</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="989.3" y="148.1">3  CREATE EXTENSION</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="989.3" y="172.1">쓸 DB 에서</tspan><tspan x="989.3" y="189.6">CREATE EXTENSION</tspan><tspan x="989.3" y="207.1">pg_stat_statements;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="317.1">preload 없이 조회하면 (01.01 컨테이너 실측)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="340.8">ERROR: pg_stat_statements must be loaded via shared_preload_libraries</tspan><tspan x="56.0" y="358.3">확장은 pg_available_extensions 에 1.10 으로 있었다 — 설치 가능하지만 preload 가 별개다</tspan></text></svg>