<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="400" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="500" y="130" width="400" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="960" y="130" width="400" height="110" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="310" width="400" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="500" y="310" width="400" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="960" y="310" width="400" height="110" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="470" width="1320" height="180" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 440.0 185.0 L 500.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 185.0 L 960.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 440.0 365.0 L 500.0 365.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 365.0 L 960.0 365.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">조합하는 법 — 문제 하나에 도구 하나만 쓰는 경우는 드물다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">레슨 docs 가 이미 보여 주는 조합</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="117.1">멱등 키 + 재고 차감</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="157.1">키 선점</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="180.8">01.03 — 같은 요청을 거른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="157.1">재고 차감</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="180.8">01.04 — 원자 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="157.1">외부 결제 호출</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="180.8">DB 롤백으로 못 되돌린다</tspan><tspan x="976.0" y="198.3">키를 상대에게도 넘기거나 outbox</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="297.1">이벤트 소비 + 상태 반영</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="337.1">inbox 판정</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="360.8">messageId PK + ON CONFLICT DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="337.1">version 조건부 upsert</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="360.8">inbox 판정과 한 트랜잭션에</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="337.1">부수효과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="360.8">반영이 일어났을 때만</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="498.1">한 행이 병목이면 (01.04 · 05)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="522.1">1  락 보유 시간을 줄이는 것이 먼저</tspan><tspan x="56.0" y="539.6">2  그래도 안 되면 버킷 분할 · 큐 · 예약 같은 줄 자체를 나누는 설계 (모두 해석 · 일반 설계, 해당 문서가 대가를 적음)</tspan><tspan x="56.0" y="557.1">3  마지막 방어선으로 원자 조건부 UPDATE 를 남긴다</tspan><tspan x="56.0" y="574.6">서버를 늘려도 한 행은 서버 수와 무관하게 직렬이다</tspan></text></svg>