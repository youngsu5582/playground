<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="400" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="320" width="400" height="150" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="560" y="120" width="460" height="350" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1080" y="120" width="280" height="350" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="500" width="1320" height="50" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><path d="M 440.0 195.0 L 560.0 195.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 440.0 395.0 L 560.0 395.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">JVM 락은 그 JVM 안만 조정한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">같은 멱등 키 요청이 서로 다른 인스턴스로 들어오면 각자 &quot;처음 보는 요청&quot; 이라고 판단한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">인스턴스 1 (JVM)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">synchronized · ConcurrentHashMap</tspan><tspan x="56.0" y="189.6">&quot;이 키는 처음 본다&quot; → 처리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="348.1">인스턴스 2 (JVM)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="372.1">자기 락 · 자기 맵</tspan><tspan x="56.0" y="389.6">&quot;이 키는 처음 본다&quot; → 처리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="148.1">DB — 심판은 데이터와 같은 곳에</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="172.1">유니크 제약 · 행 락 · 조건부 UPDATE</tspan><tspan x="576.0" y="189.6">&#160;</tspan><tspan x="576.0" y="207.1">두 인스턴스가 같은 키를 INSERT 하면</tspan><tspan x="576.0" y="224.6">하나만 성공한다</tspan><tspan x="576.0" y="242.1">&#160;</tspan><tspan x="576.0" y="259.6">01.03 구현 테스트의 방법 검사가</tspan><tspan x="576.0" y="277.1">&quot;인스턴스가 둘이어도 DB 가</tspan><tspan x="576.0" y="294.6">중복을 막는가&quot; 로 이 해법을 거른다</tspan></text><rect x="468.3" y="183.9" width="63.5" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="500.0" y="199.9">INSERT</tspan></text><rect x="468.3" y="383.9" width="63.5" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="500.0" y="399.9">INSERT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1096.0" y="147.1">서버가 한 대여도 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1096.0" y="170.8">확장하면 바로 깨진다</tspan><tspan x="1096.0" y="188.3">키별 락 맵 정리가 필요하다</tspan><tspan x="1096.0" y="205.8">심판이 데이터와</tspan><tspan x="1096.0" y="223.3">다른 곳에 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="526.1">분산 락(Redis 등)은 이 트랙의 범위 밖 — 동작을 주장하지 않는다</tspan></text></svg>