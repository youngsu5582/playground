<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40.0" y="120" width="219.2" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="315.2" y="120" width="219.2" height="150" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="590.4" y="120" width="219.2" height="150" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="865.5999999999999" y="120" width="219.2" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1140.8" y="120" width="219.2" height="150" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="330" width="1320" height="110" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 259.2 195.0 L 315.2 195.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 534.4 195.0 L 590.4 195.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 809.6 195.0 L 865.6 195.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1084.8 195.0 L 1140.8 195.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">재시도는 트랜잭션 전체를, 바깥에서</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">40001 은 UPDATE 에서도 COMMIT 에서도 난다 — commit() 도 같은 try 안에 둔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">시도 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">BEGIN</tspan><tspan x="56.0" y="189.6">읽기 · 계산 · 쓰기</tspan><tspan x="56.0" y="207.1">COMMIT → 40001</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="331.2" y="148.1">실패 판정</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="331.2" y="172.1">SQLSTATE 로</tspan><tspan x="331.2" y="189.6">(메시지 문구 X)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="606.4" y="148.1">대기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="606.4" y="172.1">무작위 대기(지터)</tspan><tspan x="606.4" y="189.6">횟수 상한</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="881.6" y="148.1">시도 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="881.6" y="172.1">처음부터 다시</tspan><tspan x="881.6" y="189.6">새 트랜잭션</tspan><tspan x="881.6" y="207.1">새로 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1156.8" y="148.1">결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1156.8" y="172.1">성공</tspan><tspan x="1156.8" y="189.6">또는 명확한 실패</tspan><tspan x="1156.8" y="207.1">(정상 결과 품절과 구분)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="357.1">이어서 쓰지 않고 처음부터 하는 이유</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="380.8">앞서 읽은 값이 이미 틀렸고, 실패한 트랜잭션은 중단 상태(25P02)라 이어갈 수 없다</tspan><tspan x="56.0" y="398.3">재시도는 @Transactional 경계 바깥, 트랜잭션 메서드와 다른 빈에 둔다 (해석 — 문서 05)</tspan><tspan x="56.0" y="415.8">재시도는 work 를 다시 실행하므로 외부 호출 · 메시지 발행이 시도마다 중복된다 → 커밋 뒤로 · outbox · 상대에게 멱등 키</tspan></text></svg>