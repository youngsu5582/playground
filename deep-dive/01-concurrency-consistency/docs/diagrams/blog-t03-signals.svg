<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="640" height="220" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="110" width="640" height="220" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="360" width="1320" height="70" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">실패했다는 신호는 두 종류다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">호출 코드가 어느 쪽 신호를 읽는지가 곧 설계의 일부다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">영향 행 수가 신호인 도구</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">에러가 아니라 0 이 돌아온다</tspan><tspan x="56.0" y="180.8">&#160;</tspan><tspan x="56.0" y="198.3">원자 조건부 UPDATE   0 = 조건 불충족</tspan><tspan x="56.0" y="215.8">낙관 락                 0 = 충돌 (version 불일치)</tspan><tspan x="56.0" y="233.3">ON CONFLICT DO NOTHING   0 = 이미 선점됨</tspan><tspan x="56.0" y="250.8">조건부 upsert           0 = 중복 또는 STALE</tspan><tspan x="56.0" y="268.3">&#160;</tspan><tspan x="56.0" y="285.8">같은 0 이라도 대상 행이 없을 때도 0 이다</tspan><tspan x="56.0" y="303.3">호출 코드가 0 을 해석하는 자리가 설계다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="139.1">SQLSTATE 가 신호인 도구</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="163.3">메시지 문구가 아니라 코드로 판정한다</tspan><tspan x="736.0" y="180.8">&#160;</tspan><tspan x="736.0" y="198.3">40001  직렬화 실패</tspan><tspan x="736.0" y="215.8">40P01  데드락</tspan><tspan x="736.0" y="233.3">55P03  락 타임아웃 · NOWAIT</tspan><tspan x="736.0" y="250.8">23505  유니크 위반</tspan><tspan x="736.0" y="268.3">&#160;</tspan><tspan x="736.0" y="285.8">(01.01 · 01 에러 코드 절)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="387.1">예방이 가능하면 재시도보다 우선이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="410.8">데드락은 락 순서를 하나로 정해 감지될 일 자체를 없애고, 재시도는 2차 방어선이다 (01.02 · 05)</tspan></text></svg>