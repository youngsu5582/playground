e1e" text-anchor="middle" xml:space="preserve"><tspan x="185.0" y="176.9">TransientDataAccessException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="176.9">ConcurrencyFailureException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="126.9">PessimisticLockingFailureException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="356.9">OptimisticLockingFailureException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1245.0" y="76.9">CannotAcquireLockException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1245.0" y="134.1">CannotSerializeTransactionException</tspan><tspan x="1245.0" y="149.1">(6.0.3 deprecated)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1245.0" y="204.1">DeadlockLoserDataAccessException</tspan><tspan x="1245.0" y="219.1">(6.0.3 deprecated)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1245.0" y="356.6">ObjectOptimisticLockingFailureException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="185.0" y="496.9">NonTransientDataAccessException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="496.9">DataIntegrityViolationException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="496.6">DuplicateKeyException  (JdbcTemplate 23505)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="586.6">UncategorizedDataAccessException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="566.6">UncategorizedSQLException  (JDBC 55P03)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="626.9">JpaSystemException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="1090.0" y="414.1">40001 · 40P01(JPA) 는 위쪽,</tspan><tspan x="1090.0" y="431.6">23505 는 DataIntegrityViolation 쪽 —</tspan><tspan x="1090.0" y="449.1">55P03 은 JDBC 에서 Uncategorized 라</tspan><tspan x="1090.0" y="466.6">ConcurrencyFailureException 에 안 걸린다</tspan></text></svg>