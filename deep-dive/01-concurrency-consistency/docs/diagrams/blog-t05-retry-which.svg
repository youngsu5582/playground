<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="598" viewBox="0 0 1400 598"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="380.0" y="100" width="485.0" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="875.0" y="100" width="485.0" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="168" width="330" height="64" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380.0" y="168" width="485.0" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="875.0" y="168" width="485.0" height="64" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="242" width="330" height="64" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380.0" y="242" width="485.0" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="875.0" y="242" width="485.0" height="64" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="316" width="330" height="64" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380.0" y="316" width="485.0" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="875.0" y="316" width="485.0" height="64" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="390" width="330" height="64" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380.0" y="390" width="485.0" height="64" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="875.0" y="390" width="485.0" height="64" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="464" width="330" height="64" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380.0" y="464" width="485.0" height="64" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="875.0" y="464" width="485.0" height="64" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">어떤 예외를 재시도하나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">상위 갈래로 묶으면 ConcurrencyFailureException(= Pessimistic + Optimistic)이 재시도 후보, DataIntegrityViolationException 은 후보가 아니다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="133.3">재시도</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="133.3">이유</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="196.6">40001 직렬화 실패</tspan><tspan x="205.0" y="214.1">(CannotAcquireLockException)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="205.3">예 — 트랜잭션 전체</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="196.6">PostgreSQL 문서 13.2.2: 중단하고 처음부터 재시도</tspan><tspan x="1117.5" y="214.1">(01.01 문서 05)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="279.3">40P01 데드락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="279.3">예 — 전체 (상한 · 지터)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="270.6">다른 트랜잭션이 이겼고 락이 풀렸다 (01.02 문서 05)</tspan><tspan x="1117.5" y="288.1">순서 통일로 예방이 먼저</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="344.6">낙관 락 충돌</tspan><tspan x="205.0" y="362.1">(ObjectOptimisticLockingFailure)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="353.3">예 — 다시 읽고 처음부터</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="344.6">같은 낡은 엔티티로 재시도하면 같은 충돌</tspan><tspan x="1117.5" y="362.1">새 트랜잭션에서 재조회</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="427.3">55P03 락 대기 실패</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="427.3">상황에 따라</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="418.6">NOWAIT 는 &quot;바쁘면 포기 · 나중에&quot; 설계라 재시도 · 거절은 정책</tspan><tspan x="1117.5" y="436.1">lock_timeout 이면 대기열 길이를 본다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="501.3">23505 유니크 위반</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="622.5" y="501.3">보통 아니오</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1117.5" y="492.6">같은 값이면 같은 실패</tspan><tspan x="1117.5" y="510.1">멱등 키 충돌이면 &quot;이미 처리됨&quot; 으로 응답 (01.03)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="566.1">단 55P03 은 JDBC 에서 UncategorizedSQLException 이라 이 갈래에 안 들어온다 (1절)</tspan></text></svg>