<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="522" viewBox="0 0 1400 522"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="470.0" y="100" width="290.0" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="770.0" y="100" width="290.0" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1070.0" y="100" width="290.0" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="168" width="420" height="88" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="470.0" y="168" width="290.0" height="88" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="770.0" y="168" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1070.0" y="168" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="266" width="420" height="88" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="470.0" y="266" width="290.0" height="88" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="770.0" y="266" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1070.0" y="266" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="364" width="420" height="88" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="470.0" y="364" width="290.0" height="88" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="770.0" y="364" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1070.0" y="364" width="290.0" height="88" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">예외를 잡고 계속하면 — 세 경로의 결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(실측: spring-probe) 바깥 @Transactional 메서드가 예외를 잡고 정상 반환 — 같은 트랜잭션에서 앞서 keep 행을 INSERT 해 둔 뒤 실패시킴</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="133.3">잡은 뒤 Spring 의 상태</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="133.3">바깥 커밋 결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="133.3">keep 행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="250.0" y="208.6">안쪽이 다른 빈의 @Transactional</tspan><tspan x="250.0" y="226.1">메서드(프록시 경계)에서 예외</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="217.3">rollbackOnly = true</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="217.3">UnexpectedRollbackException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="217.3">롤백됨</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="250.0" y="306.6">EntityManager.flush() 직접 호출에서</tspan><tspan x="250.0" y="324.1">예외 후 catch</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="306.6">rollbackOnly = true</tspan><tspan x="615.0" y="324.1">(실패한 엔티티는 컨텍스트에 그대로)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="315.3">UnexpectedRollbackException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="315.3">롤백됨</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="250.0" y="404.6">JdbcTemplate 호출에서 예외 후 catch</tspan><tspan x="250.0" y="422.1">(프록시 경계 없음)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="404.6">rollbackOnly = false</tspan><tspan x="615.0" y="422.1">Spring 은 모른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="413.3">예외 없이 반환</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1215.0" y="413.3">롤백됨</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="490.1">중단된 뒤 다음 쿼리는 전부 25P02 로 실패한다 — JDBC: UncategorizedSQLException · JPA: JpaSystemException</tspan></text></svg>