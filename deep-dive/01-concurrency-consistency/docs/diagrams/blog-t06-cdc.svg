<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40.0" y="120" width="277.5" height="160" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="387.5" y="120" width="277.5" height="160" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="735.0" y="120" width="277.5" height="160" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="1082.5" y="120" width="277.5" height="160" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="340" width="650" height="160" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="710" y="340" width="650" height="160" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 317.5 200.0 L 387.5 200.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 665.0 200.0 L 735.0 200.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 1012.5 200.0 L 1082.5 200.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">CDC — outbox 테이블이 아니라 WAL 의 변경을 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">PostgreSQL 논리 디코딩 (문서 49.2 · 49.6)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">WAL</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">커밋된 변경만</tspan><tspan x="56.0" y="189.6">디코딩 대상</tspan><tspan x="56.0" y="207.1">롤백된 트랜잭션은 제외</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="403.5" y="148.1">복제 슬롯</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="403.5" y="172.1">원 서버에서 일어난 순서대로</tspan><tspan x="403.5" y="189.6">재생할 수 있는 변경의 흐름</tspan><tspan x="403.5" y="207.1">연결과 무관하게 유지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="751.0" y="148.1">릴레이</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="751.0" y="172.1">예: Debezium</tspan><tspan x="751.0" y="189.6">Outbox Event Router</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1098.5" y="148.1">Kafka</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1098.5" y="172.1">aggregateid 가</tspan><tspan x="1098.5" y="189.6">메시지 키</tspan></text><rect x="318.7" y="188.9" width="67.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="352.5" y="204.9">커밋 순서</tspan></text><rect x="674.5" y="188.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="204.9">읽는다</tspan></text><rect x="1028.5" y="188.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="1047.5" y="204.9">발행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="368.1">그래도 중복은 있다 (문서 49.2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="392.1">슬롯은 평소 각 변경을 한 번만 내보내지만</tspan><tspan x="56.0" y="409.6">크래시 뒤 슬롯 위치가 이전 LSN 으로 돌아가면 최근 변경이 다시 온다</tspan><tspan x="56.0" y="427.1">슬롯의 현재 위치는 체크포인트 때만 영속된다</tspan><tspan x="56.0" y="444.6">→ CDC 도 at-least-once — 중복 처리는 클라이언트 책임</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="726.0" y="368.1">운영 비용 (문서 49.2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="726.0" y="392.1">슬롯이 필요로 하는 WAL 과 카탈로그 행은 VACUUM · WAL 정리가</tspan><tspan x="726.0" y="409.6">지우지 못해 저장소를 먹는다</tspan><tspan x="726.0" y="427.1">극단적으로 트랜잭션 ID 랩어라운드를 막으려고 DB 가 멈출 수 있다</tspan><tspan x="726.0" y="444.6">— 쓰지 않는 슬롯은 지워야 한다 · 릴레이가 죽어 있는 동안 WAL 이 쌓인다</tspan></text></svg>