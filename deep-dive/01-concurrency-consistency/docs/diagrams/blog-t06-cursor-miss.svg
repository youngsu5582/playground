<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665"><defs><marker id="ahadb5bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#adb5bd"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30.0" y="96" width="220" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="490.0" y="96" width="220" height="44" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="950.0" y="96" width="220" height="44" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="17.359999999999985" y="185.25" width="245.28000000000003" height="39.5" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="472.03999999999996" y="263.25" width="255.92000000000002" height="39.5" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="73.08" y="419.25" width="133.84" height="39.5" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="980.2" y="488.5" width="159.6" height="57.0" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="576" width="1120" height="69" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 140.0 140.0 L 140.0 183.2" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 140.0 226.8 L 140.0 417.2" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 140.0 460.8 L 140.0 556.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 600.0 140.0 L 600.0 261.2" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 600.0 304.8 L 600.0 556.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 1060.0 140.0 L 1060.0 486.5" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 1060.0 547.5 L 1060.0 556.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 1060.0 361.0 L 600.0 361.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">id 커서로 읽는 폴러는 늦게 커밋된 행을 놓친다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">bigserial 번호는 INSERT 시점에 배정되고 커밋은 그 뒤에 일어난다 — 그림의 숫자는 예시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="140.0" y="123.7">트랜잭션 A</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="123.7">트랜잭션 B</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1060.0" y="123.7">폴러 (id &gt; 마지막 본 id)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="140.0" y="210.3">INSERT outbox → id 10 (커밋 전)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="288.3">INSERT outbox → id 11, COMMIT</tspan></text><rect x="741.8" y="331.9" width="176.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="347.9">id 11 을 읽는다 → 커서 = 11</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="140.0" y="444.3">COMMIT (id 10)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1060.0" y="513.6">id &gt; 11 만 읽으므로</tspan><tspan x="1060.0" y="531.1">id 10 은 영영 못 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="605.1">대안: published_at IS NULL 플래그로 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="629.3">늦게 커밋된 행도 다음 폴링에서 잡힌다. 폴링 간격 = 발행 지연의 하한이다 (해석). 대신 인프라가 DB 하나라 단순하다</tspan></text></svg>