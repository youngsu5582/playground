<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="600" height="220" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="760" y="120" width="600" height="220" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="380" width="1320" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 640.0 230.0 L 760.0 230.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)" marker-start="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">Kafka 트랜잭션은 Kafka 안만 묶는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">DB 커밋과 발행 사이의 틈은 Kafka 트랜잭션으로 닫히지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.1">Kafka 트랜잭션의 범위</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="173.3">여러 파티션 쓰기 · 오프셋의</tspan><tspan x="56.0" y="190.8">원자성</tspan><tspan x="56.0" y="208.3">&#160;</tspan><tspan x="56.0" y="225.8">외부 시스템은 협조가 필요하다</tspan><tspan x="56.0" y="243.3">(exactly-once 의 범위 — 01.05 문서 01)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="149.1">DB — 별개 자원</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="173.3">주문을 DB 에 쓰는 것은 그 트랜잭션 밖이다</tspan><tspan x="776.0" y="190.8">DB 커밋과 Kafka 커밋이 한 번에 성공 · 실패하게</tspan><tspan x="776.0" y="208.3">하는 문장이 Kafka 문서에 없다</tspan><tspan x="776.0" y="225.8">(이 문서에서 확인한 범위)</tspan></text><rect x="674.5" y="210.8" width="51.0" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="226.8">묶이지</tspan><tspan x="700.0" y="243.1">않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="408.1">그래서 outbox 는 두 시스템을 묶지 않는다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="432.1">원자성은 DB 한 곳에서만 요구하고, 나머지를 &quot;재시도 가능한 일&quot; 로 바꾼다</tspan><tspan x="56.0" y="449.6">소비 쪽 트랜잭션 + AfterRollbackProcessor 가 외부 DB 까지 exactly-once 가 아니라는 점은 01.05 문서 06</tspan></text></svg>