<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="380" height="260" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="600" y="130" width="760" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="600" y="280" width="760" height="110" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="430" width="1320" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 420.0 200.0 L 600.0 185.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 420.0 330.0 L 600.0 335.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">순서 — 같은 키는 같은 파티션, 파티션 안에서만 순서가 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">outbox 에서 순서가 필요한 이벤트는 같은 aggregate_id 를 메시지 키로 보낸다 (Debezium 도 aggregateid 를 키로 쓴다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="158.1">outbox 행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="182.1">aggregate_id = 주문 A  이벤트 a1</tspan><tspan x="56.0" y="199.6">aggregate_id = 주문 B  이벤트 b1</tspan><tspan x="56.0" y="217.1">aggregate_id = 주문 A  이벤트 a2</tspan><tspan x="56.0" y="234.6">aggregate_id = 주문 B  이벤트 b2</tspan><tspan x="56.0" y="252.1">&#160;</tspan><tspan x="56.0" y="269.6">(그림의 이름은 예시)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="158.1">파티션 x — 키: 주문 A</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="182.1">a1 → a2   파티션 안에서는 순서가 지켜진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="308.1">파티션 y — 키: 주문 B</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="332.1">b1 → b2</tspan></text><rect x="471.2" y="156.9" width="77.5" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="510.0" y="172.9">키 = 주문 A</tspan></text><rect x="471.2" y="348.9" width="77.5" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="510.0" y="364.9">키 = 주문 B</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="457.1">outbox 가 정하는 것은 &quot;발행 순서&quot; 이고 사건의 순서가 아니다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="480.8">릴레이 순서가 흔들릴 수 있으므로 소비자는 version 으로 역전을 거른다 (01.05 문서 04) — outbox 행에 업무 version 을 넣어 두면 된다 (해석)</tspan></text></svg>