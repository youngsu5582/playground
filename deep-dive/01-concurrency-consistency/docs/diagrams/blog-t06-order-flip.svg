<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595"><defs><marker id="ahadb5bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#adb5bd"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30.0" y="96" width="220" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="490.0" y="96" width="220" height="44" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="950.0" y="96" width="220" height="44" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="86.31" y="186.25" width="107.38" height="39.5" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="546.31" y="266.25" width="107.38" height="39.5" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="506" width="1120" height="69" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 140.0 140.0 L 140.0 184.2" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 140.0 227.8 L 140.0 486.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 600.0 140.0 L 600.0 264.2" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 600.0 307.8 L 600.0 486.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 1060.0 140.0 L 1060.0 486.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 600.0 366.0 L 1060.0 366.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 140.0 446.0 L 1060.0 446.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">릴레이가 여럿이면 순서가 뒤집힌다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">실측은 &quot;다른 릴레이가 다른 행을 동시에 잡는다&quot; 까지다 — 같은 aggregate_id 의 두 이벤트 e1 · e2 로 그린 예시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="140.0" y="123.7">릴레이 A</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="123.7">릴레이 B</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1060.0" y="123.7">브로커</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="140.0" y="211.3">e1 을 집는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="291.3">e2 를 집는다</tspan></text><rect x="731.1" y="336.9" width="197.8" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="352.9">B 가 먼저 발행 · 표시 · 커밋 (e2)</tspan></text><rect x="546.9" y="416.9" width="106.2" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="432.9">A 가 나중에 (e1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="535.1">브로커에는 e2, e1 순서로 쌓인다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="559.3">대응 (해석): 릴레이를 하나로 두거나, 릴레이마다 aggregate_id 해시 범위를 맡겨 같은 키는 한 릴레이만 읽게 한다</tspan></text></svg>