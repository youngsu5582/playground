<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="300" height="130" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="300" width="300" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="400" y="110" width="400" height="130" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="400" y="300" width="400" height="250" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="860" y="110" width="500" height="250" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="860" y="420" width="500" height="250" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="590" width="760" height="140" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><path d="M 190.0 240.0 L 190.0 300.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 340.0 365.0 L 370.0 365.0 L 370.0 175.0 L 400.0 175.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><path d="M 800.0 175.0 L 860.0 175.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 800.0 500.0 L 860.0 500.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 800.0 330.0 L 830.0 330.0 L 830.0 300.0 L 860.0 300.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">PostgreSQL 16 엔진 지도 — 프로세스 · 공유 메모리 · 디스크</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">연결 하나 = 백엔드 프로세스 하나. 프로세스들은 공유 메모리로 만나고, 내구성은 WAL 이 진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">클라이언트</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="162.1">앱 (HikariCP 풀)</tspan><tspan x="56.0" y="179.6">선택: 앞단 PgBouncer</tspan><tspan x="56.0" y="197.1">연결 하나가 백엔드 하나로 이어진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">postmaster (최초 프로세스)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="352.1">연결 요청이 오면 백엔드를 만든다</tspan><tspan x="56.0" y="369.6">보조 프로세스도 이것이 관리한다</tspan><tspan x="56.0" y="387.1">컨테이너 실측: PID 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="416.0" y="138.1">client backend (연결 1개 = 1개)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="416.0" y="162.1">SQL 실행 · 스냅샷 · 락 요청 · WAL 기록</tspan><tspan x="416.0" y="179.6">실측 ps: postgres: lab lab [local] SELECT</tspan><tspan x="416.0" y="197.1">여기서 보는 것: 01.01 ~ 01.05 전부</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="416.0" y="328.1">보조 프로세스 (실측 ps · backend_type)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="416.0" y="352.1">checkpointer     체크포인트 실행</tspan><tspan x="416.0" y="369.6">background writer  더러운 페이지를 디스크로</tspan><tspan x="416.0" y="387.1">walwriter           WAL 버퍼를 디스크로</tspan><tspan x="416.0" y="404.6">autovacuum launcher  worker 를 띄움</tspan><tspan x="416.0" y="422.1">(autovacuum worker 는 launcher 가 띄움)</tspan><tspan x="416.0" y="439.6">startup  크래시 복구 때 WAL 재생</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="138.1">공유 메모리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="162.1">shared_buffers    데이터 페이지 캐시 (보통 128MB)</tspan><tspan x="876.0" y="179.6">WAL 버퍼          아직 디스크에 안 간 WAL</tspan><tspan x="876.0" y="197.1">락 테이블          무거운 락 (01.02 · 01.03)</tspan><tspan x="876.0" y="214.6">predicate 락 테이블  SIREAD 락 (01.01 문서 05)</tspan><tspan x="876.0" y="232.1">&#160;</tspan><tspan x="876.0" y="249.6">프로세스들이 같은 메모리를 보며 협력한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="448.1">디스크 (데이터 디렉터리)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="472.1">base/     테이블 · 인덱스 데이터 파일</tspan><tspan x="876.0" y="489.6">pg_wal/   WAL 파일 (커밋의 내구성은 여기)</tspan><tspan x="876.0" y="507.1">pg_xact/  트랜잭션 커밋 상태 (01.01 문서 02)</tspan><tspan x="876.0" y="524.6">&#160;</tspan><tspan x="876.0" y="542.1">커밋 = pg_wal 에 WAL 이 닿음</tspan><tspan x="876.0" y="559.6">데이터 페이지는 나중에 써도 된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="617.1">커밋이 일어나는 순서 (문서 01 · 30장)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="640.8">1  변경을 WAL 버퍼에 기록   2  커밋 시 WAL 을 pg_wal 로 flush (synchronous_commit = on)</tspan><tspan x="56.0" y="658.3">3  클라이언트에 성공 응답    4  데이터 페이지는 bgwriter · checkpointer 가 나중에</tspan><tspan x="56.0" y="675.8">크래시 → 마지막 체크포인트의 redo 지점부터 WAL 재생</tspan></text><rect x="171.0" y="258.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="190.0" y="274.9">연결</tspan></text><rect x="351.0" y="258.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="370.0" y="274.9">생성</tspan></text></svg>