<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="126" width="620" height="150" rx="10" fill="#f1f3f5" stroke="#e8590c" stroke-width="2"/><rect x="40" y="306" width="620" height="150" rx="10" fill="#f1f3f5" stroke="#e8590c" stroke-width="2"/><rect x="40" y="486" width="620" height="150" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="740" y="126" width="620" height="150" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="740" y="336" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1070" y="336" width="290" height="140" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="740" y="536" width="620" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><path d="M 895.0 276.0 L 885.0 336.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 1030.0 406.0 L 1070.0 406.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 1215.0 476.0 L 1236.0 536.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">DB 커밋과 메시지 발행 사이 — dual write 와 outbox</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">왼쪽: 두 번 쓰면 어느 순서든 한쪽이 샌다. 오른쪽: DB 한 곳에만 쓰고 발행은 따로 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="112.1">dual write — 한 요청이 DB 와 브로커에 따로 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="154.1">경우 1  커밋 후 발행 전에 앱이 죽음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="178.1">1  DB 커밋 성공 (주문 저장됨)</tspan><tspan x="56.0" y="195.6">2  앱 크래시 / 브로커 장애</tspan><tspan x="56.0" y="213.1">3  메시지는 나가지 않는다</tspan><tspan x="56.0" y="230.6">결과: DB 에는 있고 이벤트는 영영 없다 (유실)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="334.1">경우 2  발행 후 커밋이 실패</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="358.1">1  메시지 발행 성공 (소비자가 받음)</tspan><tspan x="56.0" y="375.6">2  DB 커밋 실패 / 롤백</tspan><tspan x="56.0" y="393.1">3  주문은 없는데 이벤트는 나갔다</tspan><tspan x="56.0" y="410.6">결과: 존재하지 않는 사건이 퍼진다 (유령 이벤트)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="514.1">왜 못 막나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="538.1">DB 트랜잭션과 브로커 발행은 서로 다른 시스템이라</tspan><tspan x="56.0" y="555.6">하나의 원자적 커밋으로 묶이지 않는다</tspan><tspan x="56.0" y="573.1">Kafka 트랜잭션은 Kafka 안(오프셋 · 토픽 쓰기)만 묶는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="740.0" y="112.1">outbox — 발행할 것을 같은 트랜잭션에 DB 행으로 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="154.1">DB 한 트랜잭션 (원자적)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="178.1">INSERT orders ...</tspan><tspan x="756.0" y="195.6">INSERT outbox (id, aggregate_id, type, payload)</tspan><tspan x="756.0" y="213.1">COMMIT  — 둘 다 남거나 둘 다 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="364.1">릴레이 (별도 프로세스)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="388.1">폴링: SELECT ... FOR UPDATE</tspan><tspan x="756.0" y="405.6">SKIP LOCKED</tspan><tspan x="756.0" y="423.1">CDC: WAL 논리 디코딩</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1086.0" y="364.1">Kafka</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1086.0" y="388.1">key = aggregate_id</tspan><tspan x="1086.0" y="405.6">같은 키는 같은 파티션</tspan><tspan x="1086.0" y="423.1">릴레이 중복 → 중복 전달</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="563.1">소비자 — at-least-once 라 멱등 처리 (01.05 inbox · version)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="586.8">릴레이가 발행 후 표시 전에 죽으면 같은 메시지가 두 번 나간다</tspan></text><rect x="864.5" y="294.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="890.0" y="310.9">읽는다</tspan></text><rect x="1031.0" y="394.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="1050.0" y="410.9">발행</tspan></text></svg>