0" y="262" width="160" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1140" y="262" width="160" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="348" width="230" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="280" y="348" width="340" height="70" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="630" y="348" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="800" y="348" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="970" y="348" width="160" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1140" y="348" width="160" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="434" width="230" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="280" y="434" width="340" height="70" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="630" y="434" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="800" y="434" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="970" y="434" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1140" y="434" width="160" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 1330.0 180.0 L 1330.0 500.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">격리수준 = 무엇을 허용하나의 사다리 (SQL 표준)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">위에서 아래로 내려갈수록 허용하는 이상 현상이 줄어든다. 아래 한 칸이 위 한 칸의 약속을 모두 포함한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="710.0" y="131.3">더티 리드</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="122.6">반복 불가</tspan><tspan x="880.0" y="140.1">읽기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1050.0" y="131.3">팬텀</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" y="131.3">직렬화 이상</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="155.0" y="131.3">격리수준</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="450.0" y="131.3">이 수준이 하는 약속</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="155.0" y="217.1">READ UNCOMMITTED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="450.0" y="216.3">약속 없음 — 커밋 안 된 것도 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="710.0" y="217.1">허용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="217.1">허용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1050.0" y="217.1">허용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" y="217.1">허용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="155.0" y="303.1">READ COMMITTED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-s