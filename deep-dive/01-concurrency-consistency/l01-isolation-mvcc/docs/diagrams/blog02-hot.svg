<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="140" width="280" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="260" width="280" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="420" y="140" width="250" height="70" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="420" y="260" width="250" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="740" y="140" width="280" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1090" y="140" width="270" height="70" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="1090" y="260" width="270" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="410" width="660" height="110" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="740" y="410" width="620" height="110" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="550" width="1320" height="100" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 320.0 175.0 L 420.0 175.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 320.0 295.0 L 420.0 295.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 1020.0 175.0 L 1090.0 175.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 1225.0 210.0 L 1225.0 260.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">일반 UPDATE 와 HOT (Heap-Only Tuple)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">인덱스가 어디를 가리키고, UPDATE 가 인덱스 항목을 새로 만드나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="118.1">일반 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="166.1">인덱스 항목 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="286.1">인덱스 항목 2  (새로 생긴다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="436.0" y="166.1">옛 튜플</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="436.0" y="286.1">새 튜플</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="364.1">인덱스마다 새 항목이 생긴다 — 새 튜플을 가리키는 항목</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="740.0" y="118.1">HOT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="166.1">인덱스 항목 (그대로)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1106.0" y="165.1">사슬의 뿌리 (옛 튜플)</tspan><tspan x="1106.0" y="181.3">HEAP_HOT_UPDATED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1106.0" y="285.1">새 튜플</tspan><tspan x="1106.0" y="301.3">HEAP_ONLY_TUPLE</tspan></text><rect x="1171.7" y="215.8" width="106.6" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="1225.0" y="231.8">같은 페이지에서</tspan><tspan x="1225.0" y="248.1">앞으로 따라간다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="740.0" y="364.1">새 인덱스 항목이 없다 — 인덱스는 사슬의 뿌리를 가리킨다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="437.1">HOT 이 되는 조건 (둘 다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="460.8">1  갱신하는 컬럼이 어떤 인덱스에도 없다 (BRIN 같은 요약 인덱스 제외)</tspan><tspan x="56.0" y="478.3">2  새 버전이 같은 힙 페이지에 들어갈 자리가 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="437.1">사슬 정리(pruning)는 VACUUM 만 하지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="460.8">SELECT · UPDATE · DELETE 같은 일반 페이지 접근 중에도 일어난다</tspan><tspan x="756.0" y="478.3">페이지가 거의 찼을 때(여유 10% 미만) · cleanup 락을 막힘 없이 얻을 때</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="577.1">실측: 전부가 HOT 은 아니었다 (psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="600.8">인덱스 둘(id pk · k)이 있는 100행 테이블에서 인덱스 없는 컬럼 v 를 두 번 UPDATE -&gt; n_tup_upd = 200, n_tup_hot_upd = 100</tspan><tspan x="56.0" y="618.3">이어 인덱스된 k 를 10행 UPDATE -&gt; n_tup_upd = 210, n_tup_hot_upd 는 그대로 100</tspan></text></svg>