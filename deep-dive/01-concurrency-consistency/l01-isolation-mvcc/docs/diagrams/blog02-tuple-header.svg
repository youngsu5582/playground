<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="640" height="260" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/><rect x="60" y="160" width="66" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="136" y="160" width="66" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="212" y="160" width="66" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="290" y="160" width="120" height="44" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="420" y="150" width="80" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="506" y="150" width="80" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="592" y="150" width="80" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="400" width="640" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="730" y="110" width="200" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="940" y="110" width="420" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="730" y="180" width="200" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="940" y="180" width="420" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="730" y="250" width="200" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="940" y="250" width="420" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="730" y="320" width="200" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="940" y="320" width="420" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="730" y="410" width="630" height="130" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">튜플 헤더 — 판정에 쓰이는 필드와 페이지 안의 배치</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">힙(테이블 파일)은 보통 8 kB 페이지로 나뉘고, 한 버전이 곧 페이지 안의 튜플 하나다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="137.1">힙 페이지 (보통 8 kB)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="93.0" y="186.9">항목 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="169.0" y="186.9">항목 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="245.0" y="186.9">항목 3</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="227.1">항목 식별자(line pointer) 배열</tspan><tspan x="60.0" y="243.3">앞에서 자란다 -&gt;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="350.0" y="186.9">빈 공간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="460.0" y="175.1">튜플 3</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="546.0" y="175.1">튜플 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="632.0" y="175.1">튜플 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="420.0" y="359.1">&lt;- 튜플은 뒤에서 자란다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="427.1">항목 식별자가 튜플의 위치를 가리킨다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="450.8">ctid = (페이지 번호, 페이지 안 항목 번호)</tspan><tspan x="56.0" y="468.3">식별자는 해제되기 전에는 옮겨지지 않는다 (문서 73.6)</tspan><tspan x="56.0" y="485.8">고정 헤더는 대부분의 머신에서 23바이트</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="143.7">t_xmin  (xmin)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="143.3">이 버전을 만든 트랜잭션 ID</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="213.7">t_xmax  (xmax)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="213.3">이 버전을 지운 트랜잭션 ID, 안 지워졌으면 0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="283.7">t_ctid  (ctid)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="283.3">이 버전 또는 더 새 버전의 위치</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="830.0" y="353.7">t_infomask 등</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="353.3">여러 플래그 비트 (hint bit 이 여기 있다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="746.0" y="437.1">커밋했는지는 튜플이 아니라 pg_xact 에 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="746.0" y="460.8">pg_xact = 트랜잭션 커밋 상태 데이터를 담는 하위 디렉터리 (문서 73.1)</tspan><tspan x="746.0" y="478.3">튜플의 xmin 이 가리키는 트랜잭션이 커밋했는지는</tspan><tspan x="746.0" y="495.8">이 기록으로 확인한다 (판정 흐름은 다음 글)</tspan></text></svg>