<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="300" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="500" y="120" width="320" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="980" y="120" width="300" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="320" width="400" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="320" width="400" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="880" y="320" width="400" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="450" width="1220" height="110" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 340.0 185.0 L 500.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 820.0 185.0 L 980.0 185.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">UPDATE 한 문장이 하는 일 세 가지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">재고 40 인 행을 트랜잭션 205 가 35 로 바꾼다 (트랜잭션 ID · 위치는 설명용 숫자)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.1">UPDATE 전: 튜플 하나</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="174.3">위치 (0,1)</tspan><tspan x="56.0" y="193.1">xmin = 200   xmax = 0</tspan><tspan x="56.0" y="211.8">stock = 40</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="149.1">옛 튜플 — 지워지지 않는다</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="173.3">위치 (0,1)</tspan><tspan x="516.0" y="190.8">xmin = 200   xmax = 205</tspan><tspan x="516.0" y="208.3">t_ctid = (0,2)   stock = 40</tspan></text><rect x="375.1" y="165.8" width="89.9" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="420.0" y="181.8">트랜잭션 205</tspan><tspan x="420.0" y="198.1">가 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="149.1">새 튜플</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="173.3">위치 (0,2)</tspan><tspan x="996.0" y="190.8">xmin = 205   xmax = 0</tspan><tspan x="996.0" y="208.3">t_ctid = (0,2)   stock = 35</tspan></text><rect x="844.9" y="165.8" width="110.3" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="900.0" y="181.8">t_ctid 가</tspan><tspan x="900.0" y="198.1">새 것을 가리킨다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="348.1">1  새 튜플을 만든다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="372.1">새 xmin (205), 새 위치 (0,2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="476.0" y="348.1">2  옛 튜플의 xmax 에 적는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="476.0" y="372.1">지운 트랜잭션 = 205</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="896.0" y="348.1">3  옛 튜플의 t_ctid 를 잇는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="896.0" y="372.1">옛 것 -&gt; 새 것 : 버전의 사슬</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="477.1">결과: 같은 논리 행의 버전이 둘이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="500.8">옛 튜플은 xmax 만 채워진 채 그 자리에 남는다. 205 가 커밋하기 전에 읽는 쪽은 옛 튜플을, 커밋한 뒤에 읽는 쪽은 새 튜플을 고른다.</tspan><tspan x="56.0" y="518.3">누가 어느 쪽을 보는지의 판정은 다음 글(03)이고, 아무도 못 보게 된 옛 튜플을 치우는 것은 VACUUM(06)이다.</tspan></text></svg>