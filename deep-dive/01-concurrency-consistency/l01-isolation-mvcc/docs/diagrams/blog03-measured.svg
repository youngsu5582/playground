troke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">실측 — RC 는 문장마다 새 스냅샷, RR 은 고정</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">T1(753) 이 열려 있는 동안 읽은 스냅샷 (psql 2026-10-13). 읽는 법: xmin = 753 은 T1 이 열려 있어서다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="138.3">시점</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="138.3">스냅샷</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="138.3">읽은 balance</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="198.9">바깥이 balance = 50 UPDATE (754) 직후, RR 은 BEGIN 만 한 상태</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="199.3">753:755:753</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="199.3">—</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="260.9">RR 의 첫 SELECT (BEGIN 보다 한참 뒤)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="261.3">753:755:753</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="261.3">50 — BEGIN 뒤의 커밋이 보였다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="322.9">바깥이 balance = 20 UPDATE (755) 한 뒤 RR 의 두 번째 SELECT</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="323.3">753:755:753 (그대로)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="323.3">50</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="384.9">RC 의 첫 SELECT</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="385.3">753:755:753</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="385.3">50</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="446.9">RC 의 두 번째 SELECT</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="447.3">753:756:753 (xmax 가 올랐다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1120.0" y="447.3">20</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="504.1">RC 는 문장마다 스냅샷을 새로 잡아 xmax 가 따라 올라갔고 (755 -&gt; 756), RR 은 고정이다. xmax = 755 는 &quot;끝난 ID 의 최댓값(754) + 1&quot;</tspan></text></svg>