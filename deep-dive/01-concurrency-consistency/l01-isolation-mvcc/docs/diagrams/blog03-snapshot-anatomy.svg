width="2"/><rect x="940" y="310" width="430" height="120" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="460" width="1320" height="100" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">스냅샷 한 줄 읽기 — 200:210:200,204,207</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">pg_current_snapshot() 의 형식은 xmin:xmax:xip_list. 숫자는 설명용이고, 상자 하나가 트랜잭션 ID 하나다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="80.0" y="159.8">198</tspan><tspan x="80.0" y="176.1">끝남</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="162.0" y="159.8">199</tspan><tspan x="162.0" y="176.1">끝남</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="244.0" y="159.8">200</tspan><tspan x="244.0" y="176.1">진행 중</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anc