<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="340" height="100" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="560" y="120" width="380" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="980" y="120" width="380" height="100" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="260" width="1320" height="90" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="415" width="360" height="46" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="420" y="415" width="300" height="46" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="475" width="360" height="46" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="420" y="475" width="300" height="46" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="780" y="400" width="580" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="545" width="1320" height="60" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 380.0 170.0 L 560.0 170.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">행 락은 메모리가 아니라 튜플 자체에 적힌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">한 세션이 SELECT ... FOR UPDATE 로 행을 잠그면, UPDATE 를 안 했는데도 xmax 에 잠근 트랜잭션이 적힌다 (실측: psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">잠그기 전</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="173.1">xmin = 760   xmax = 0</tspan></text><rect x="416.7" y="150.8" width="106.5" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="166.8">트랜잭션 761 이</tspan><tspan x="470.0" y="183.1">FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="148.1">잠근 뒤 (다른 세션이 읽은 행)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="173.1">xmin = 760   xmax = 761</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="147.1">HEAP_XMAX_LOCK_ONLY</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="170.8">xmax 가 유효하다면 잠금자일 뿐이라는 표시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="287.1">그래서 xmax 는 &quot;삭제자&quot; 와 &quot;잠금자&quot; 를 모두 나타낸다 (02 의 xmax 가 0 이 아닌데 보이는 행과 연결)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="310.8">문서 13.3.2: PostgreSQL 은 변경된 행에 대한 정보를 메모리에 기억하지 않는다 -&gt; 한 번에 잠글 수 있는 행의 수에 제한이 없다</tspan><tspan x="56.0" y="328.3">그러나 행을 잠그면 디스크 쓰기가 생길 수 있다 — SELECT FOR UPDATE 는 선택한 행을 락 표시로 수정한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="397.1">행 락 모드 (문서 13.3.2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="220.0" y="443.3">UPDATE (보통)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="443.3">FOR NO KEY UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="220.0" y="503.3">키 컬럼 변경 · DELETE</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="503.3">FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="796.0" y="427.1">SELECT 의 락 절은 네 가지</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="796.0" y="449.8">FOR UPDATE · FOR NO KEY UPDATE · FOR SHARE · FOR KEY SHARE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="571.1">테이블 수준 (문서 13.3.1): UPDATE/DELETE/INSERT = ROW EXCLUSIVE, SELECT = ACCESS SHARE — 서로 충돌하지 않는다</tspan></text></svg>