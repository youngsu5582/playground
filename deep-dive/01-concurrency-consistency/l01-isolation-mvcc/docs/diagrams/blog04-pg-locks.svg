<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="600" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="760" y="120" width="600" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="370" width="660" height="180" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="740" y="370" width="620" height="180" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 760.0 220.0 L 640.0 220.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">기다리는 모양 — 누가 누구를 기다리나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">세션 A(트랜잭션 737)가 UPDATE 후 커밋 전, 세션 B(738)가 같은 행을 UPDATE 하면 B 가 멈춘다 (실측: psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">세션 A  (트랜잭션 737)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">pg_stat_activity: state = idle in transaction</tspan><tspan x="56.0" y="189.6">                  wait_event = ClientRead</tspan><tspan x="56.0" y="207.1">pg_locks: transactionid  ExclusiveLock  737</tspan><tspan x="56.0" y="224.6">          (자기 ID 에 대한 락)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="148.1">세션 B  (트랜잭션 738)  — 멈춘다</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="172.1">pg_stat_activity: state = active</tspan><tspan x="776.0" y="189.6">                  wait_event_type = Lock</tspan><tspan x="776.0" y="207.1">                  wait_event = transactionid</tspan><tspan x="776.0" y="224.6">pg_locks: transactionid  ShareLock  granted = f  737</tspan><tspan x="776.0" y="242.1">          tuple  ExclusiveLock (B 자신이 가진, 그 행)</tspan></text><rect x="646.7" y="200.8" width="106.5" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="216.8">737 이 끝나기를</tspan><tspan x="700.0" y="233.1">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="397.1">행 락 자체는 pg_locks 에 한 줄로 안 나온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="420.8">B 는 &quot;행의 현재 xmax 트랜잭션(737)이 끝나기를&quot;</tspan><tspan x="56.0" y="438.3">그 트랜잭션 ID 락으로 기다린다</tspan><tspan x="56.0" y="455.8">그래서 누가 누구를 기다리나의 답은</tspan><tspan x="56.0" y="473.3">transactionid 번호가 누구의 것이냐다 (observe/SCRIPT.md 장면 3)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="397.1">tuple 락은 왜 있나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="420.8">정확히 어떤 구조적 이유인지는 이 레슨에서 확인하지 않았다</tspan><tspan x="756.0" y="438.3">(해석 — 같은 행을 기다리는 줄을 세우는 용도로 보인다)</tspan></text></svg>