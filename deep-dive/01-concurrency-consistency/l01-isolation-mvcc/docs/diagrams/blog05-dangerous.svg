<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="260" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="570" y="130" width="260" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1100" y="130" width="260" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="260" width="640" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="720" y="260" width="640" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="420" width="420" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="490" y="420" width="420" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="940" y="420" width="420" height="140" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 300.0 170.0 L 570.0 170.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 830.0 170.0 L 1100.0 170.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">위험한 구조 (dangerous structure)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">스냅샷 격리의 모든 이상은 가운데(pivot) 트랜잭션에 두 개의 인접한 rw-화살표가 있는 고리를 포함한다 (README-SSI)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="177.6">Tin</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="177.6">Tpivot</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1230.0" y="177.6">Tout</tspan></text><rect x="355.2" y="150.8" width="159.7" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="166.8">rw: Tin 이 읽으려던 것을</tspan><tspan x="435.0" y="183.1">Tpivot 이 썼다</tspan></text><rect x="874.6" y="150.8" width="180.7" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="965.0" y="166.8">rw: Tpivot 이 읽으려던 것을</tspan><tspan x="965.0" y="183.1">Tout 이 썼다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="287.1">취소하는 때 — Tout 이 가장 먼저 커밋할 때만</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="310.8">Tin -rw-&gt; Tpivot -rw-&gt; Tout 이고 Tout 이 Tpivot · Tin 보다 먼저 커밋</tspan><tspan x="56.0" y="328.3">(&quot;We only roll back a transaction if Tout commits before Tpivot and Tin&quot;)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="287.1">rw-의존성(rw-conflict)이란</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="310.8">한 트랜잭션이 읽으려는 데이터를 동시 트랜잭션이 썼거나 쓸 예정이라</tspan><tspan x="736.0" y="328.3">볼 수 없을 때 생긴다. 읽은 쪽 -&gt; 쓴 쪽 방향의 화살표</tspan><tspan x="736.0" y="345.8">&quot;읽은 쪽은 쓴 쪽보다 먼저 일어난 것처럼 보여야 한다&quot;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="447.1">한 방향만 있다면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="470.8">T1 -&gt; T2 는 직렬 순서 &quot;T1 먼저&quot; 로</tspan><tspan x="56.0" y="488.3">설명된다 — 문제가 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="506.0" y="447.1">희생자 선택</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="506.0" y="470.8">즉시 재시도해도 정확히 같은 트랜잭션들과</tspan><tspan x="506.0" y="488.3">다시 충돌하지 않도록 고르려 한다</tspan><tspan x="506.0" y="505.8">-&gt; 그래서 재시도가 의미를 갖는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="956.0" y="447.1">오탐(false positive)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="956.0" y="470.8">모양만 맞아도 취소될 수 있다</tspan><tspan x="956.0" y="488.3">실제로는 직렬화 이상이 아닌데도</tspan><tspan x="956.0" y="505.8">(&quot;low in practice&quot; 라고도 쓴다)</tspan></text></svg>