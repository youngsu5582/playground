<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="380" height="90" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="510" y="130" width="380" height="90" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="980" y="130" width="380" height="90" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="260" width="1320" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 420.0 175.0 L 510.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 890.0 175.0 L 980.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">SERIALIZABLE READ ONLY DEFERRABLE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">긴 리포트 · 백업에 적합하다 — 대가는 시작 지연이다</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="230.0" y="171.6">BEGIN ISOLATION LEVEL SERIALIZABLE</tspan><tspan x="230.0" y="189.1">READ ONLY DEFERRABLE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="171.3">안전한 스냅샷을 얻을 때까지</tspan><tspan x="700.0" y="190.1">시작 시점에 블록될 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1170.0" y="171.6">이후: 일반 SERIALIZABLE 의 오버헤드 없이</tspan><tspan x="1170.0" y="189.1">실패에 기여하지도 취소되지도 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="287.1">&quot;Serializable 은 블록되는데 Repeatable Read 는 안 되는 유일한 경우&quot; (문서 13.2.3)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="310.8">READ ONLY 선언만으로도 SSI 가 더 효율적이다 (문서 13.2.3 성능 팁, README-SSI)</tspan><tspan x="56.0" y="328.3">SERIALIZABLE 에서 읽은 데이터는 커밋에 성공하기 전까지는 유효하다고 여기면 안 된다 — 읽기 전용이어도 (단 DEFERRABLE 읽기 전용은 읽는 즉시 유효)</tspan></text></svg>