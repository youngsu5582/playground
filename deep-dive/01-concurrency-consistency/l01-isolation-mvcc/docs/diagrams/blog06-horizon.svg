1">가장 오래된 열린 스냅샷이 아직 볼 수 있는 튜플은 치울 수 없다 (트랜잭션 ID 는 설명용 숫자)</tspan></text><rect x="613.1" y="178.9" width="173.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="194.9">트랜잭션 ID 가 커지는 방향</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="760.0" y="115.1">horizon = 가장 오래된 열린 스냅샷의 xmin (backend_xmin)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="321.8">죽은 튜플</tspan><tspan x="170.0" y="338.1">xmax = 810</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="330.0" y="321.8">죽은 튜플</tspan><tspan x="330.0" y="338.1">xmax = 820</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="490.0" y="321.8">죽은 튜플</tspan><tspan x="490.0" y="338.1">xmax = 830</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="970.0" y="321.8">죽은 튜플</tspan><tspan x="970.0" y="338.1">xmax = 910</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1130.0" y="321.8">죽은 튜플</tspan><tspan x="1130.0" y="338.1">xmax = 920</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1290.0" y="321.8">죽은 튜플</tspan><tspan x="1290.0" y="338.1">xmax = 930</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="394.1">horizon 보다 먼저 죽었다</tspan><tspan x="260.0" y="411.6">-&gt; 아무 스냅샷도 못 본다 -&gt; 치울 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="1060.0" y="394.1">horizon 이후에 죽었다</tspan><tspan x="1060.0" y="411.6">-&gt; 열린 스냅샷이 아직 볼 수 있다</tspan><tspan x="1060.0" y="429.1">-&gt; dead but not yet removable</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="497.1">pg_stat_activity.backend_xmin = &quot;현재 백엔드의 xmin horizon&quot; (문서 28.2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="520.8">열린 트랜잭션은 &quot;그 트랜잭션에게만 보일 수 있는 최근에 죽은 튜플&quot; 을 VACUUM 이 치우는 것을 막는다 — 오래 idle 이면 테이블 bloat 의 원인이 된다 (문서 20.11)</tspan></text></svg>