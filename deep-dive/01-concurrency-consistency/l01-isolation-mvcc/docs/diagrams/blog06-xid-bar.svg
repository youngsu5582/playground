<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="150" width="1320" height="36" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="330" width="640" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="720" y="330" width="640" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="490" width="1320" height="120" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 120.0 150.0 L 120.0 130.0" fill="none" stroke="#1971c2" stroke-width="3"/><path d="M 420.0 150.0 L 420.0 130.0" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M 720.0 150.0 L 720.0 130.0" fill="none" stroke="#e03131" stroke-width="3"/><path d="M 1020.0 150.0 L 1020.0 130.0" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M 1250.0 150.0 L 1250.0 130.0" fill="none" stroke="#e03131" stroke-width="3"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">XID wraparound 와 freeze — 나이(age)가 어디까지 갔나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">눈금은 축척이 아니다. 기본값은 PostgreSQL 16 (문서는 autovacuum_freeze_max_age 만 &quot;기본 2억&quot; 이라 쓴다 — 나머지는 실측: psql 2026-10-13 SHOW)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="113.1">50,000,000</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="213.1">vacuum_freeze_min_age</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="242.1">VACUUM 이 이보다 오래된 행을</tspan><tspan x="120.0" y="257.1">frozen 으로 표시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="420.0" y="113.1">150,000,000</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="420.0" y="213.1">vacuum_freeze_table_age</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="420.0" y="242.1">문서: 유효 최댓값은</tspan><tspan x="420.0" y="257.1">0.95 * autovacuum_freeze_max_age</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="113.1">200,000,000</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="213.1">autovacuum_freeze_max_age</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="720.0" y="242.1">넘으면 autovacuum 이 꺼져 있어도</tspan><tspan x="720.0" y="257.1">강제 vacuum (to prevent wraparound)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="113.1">wraparound 4천만 전</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="213.1">WARNING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="242.1">database &quot;...&quot; must be vacuumed</tspan><tspan x="1020.0" y="257.1">within ... transactions</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" y="113.1">wraparound 300만 미만</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" y="213.1">새 XID 발급 거부</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" y="242.1">database is not accepting commands</tspan><tspan x="1250.0" y="257.1">to avoid wraparound data loss</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="143.1">age = 0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="357.1">트랜잭션 ID 는 32비트라 순환한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="380.8">모든 테이블을 20억 트랜잭션마다 한 번 이상 VACUUM 해야 한다</tspan><tspan x="56.0" y="398.3">FrozenTransactionId 는 보통의 비교 규칙을 따르지 않고</tspan><tspan x="56.0" y="415.8">모든 일반 XID 보다 오래된 것으로 취급된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="357.1">freeze 는 플래그 비트로 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="380.8">9.4 이전에는 xmin 을 실제로 바꿨지만 지금은 플래그 비트만 세운다 (xmin 보존)</tspan><tspan x="736.0" y="398.3">소스: HEAP_XMIN_FROZEN = HEAP_XMIN_COMMITTED | HEAP_XMIN_INVALID</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="517.1">점검 쿼리 (문서 25.1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="540.8">SELECT datname, age(datfrozenxid) FROM pg_database;      테이블별은 age(relfrozenxid)</tspan><tspan x="56.0" y="558.3">pg_xact 크기는 autovacuum_freeze_max_age 에 비례한다 — 기본 2억이면 약 50MB</tspan></text></svg>