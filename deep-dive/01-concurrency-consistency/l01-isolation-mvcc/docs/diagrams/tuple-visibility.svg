<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="380" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="510" y="110" width="380" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="980" y="110" width="380" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="40" y="260" width="380" height="44" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="510" y="260" width="380" height="44" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="980" y="260" width="380" height="44" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="340" width="640" height="210" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="340" width="640" height="210" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="580" width="1320" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 420.0 175.0 L 510.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 890.0 175.0 L 980.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">행 버전(튜플)과 스냅샷 판정 — PostgreSQL 16</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">같은 논리 행의 세 버전. 스냅샷 108:110:108 이 보는 것은 v2 하나뿐이다 (숫자는 설명용)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">v1   balance = 100</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">xmin = 100   xmax = 105</tspan><tspan x="56.0" y="180.8">만든 100 : 스냅샷보다 앞 (커밋)</tspan><tspan x="56.0" y="198.3">지운 105 : 스냅샷보다 앞 (커밋)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="139.1">v2   balance = 50</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="163.3">xmin = 105   xmax = 110</tspan><tspan x="526.0" y="180.8">만든 105 : 스냅샷보다 앞 (커밋)</tspan><tspan x="526.0" y="198.3">지운 110 : xmax 이상 = 아직 안 일어남</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="139.1">v3   balance = 20</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="163.3">xmin = 110   xmax = 0</tspan><tspan x="996.0" y="180.8">만든 110 : xmax 이상 = 아직 안 일어남</tspan><tspan x="996.0" y="198.3">지운 이 없음</tspan></text><rect x="416.2" y="163.9" width="97.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="465.0" y="179.9">UPDATE (105)</tspan></text><rect x="886.2" y="163.9" width="97.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="935.0" y="179.9">UPDATE (110)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="230.0" y="287.3">안 보인다 — 이미 지워진 버전</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="287.3">보인다 — 만든 쪽 보임, 지운 쪽 안 보임</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1170.0" y="287.3">안 보인다 — 아직 만들어지지 않은 버전</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="367.1">스냅샷  108:110:108   (pg_current_snapshot() 의 형식 xmin:xmax:xip)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="390.8">xmin = 108   이보다 작은 ID 는 전부 끝났다 (커밋 또는 롤백)</tspan><tspan x="56.0" y="408.3">xmax = 110   이 이상의 ID 는 스냅샷 이후에 시작 — 안 보인다</tspan><tspan x="56.0" y="425.8">xip  = 108   스냅샷 순간 진행 중이던 트랜잭션</tspan><tspan x="56.0" y="443.3">&#160;</tspan><tspan x="56.0" y="460.8">ID 가 xmin 과 xmax 사이이고 xip 에 있으면 안 끝난 것,</tspan><tspan x="56.0" y="478.3">xip 에 없으면 끝난 것 — 커밋 상태를 pg_xact 에서 확인</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="367.1">판정 규칙 (단순화)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="390.8">보이는 버전 =</tspan><tspan x="736.0" y="408.3">  xmin 의 트랜잭션이 내 스냅샷 기준으로 커밋됐고</tspan><tspan x="736.0" y="425.8">  xmax 가 0 이거나, 그 트랜잭션이 내 스냅샷 기준으로</tspan><tspan x="736.0" y="443.3">  커밋되지 않은 것 (진행 중이거나 롤백)</tspan><tspan x="736.0" y="460.8">&#160;</tspan><tspan x="736.0" y="478.3">스냅샷을 언제 잡느냐가 격리수준마다 다르다 (문서 03)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="606.1">판정에 쓰이는 것은 버전 헤더와 스냅샷뿐</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="629.6">읽기는 행 버전의 xmin/xmax 와 스냅샷만 비교해 판정한다. 아무도 보지 못하게 된 옛 버전(v1)은 VACUUM 이 치운다</tspan></text></svg>