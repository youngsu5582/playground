<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="520" viewBox="0 0 1360 520"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="380" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="560" y="100" width="760" height="160" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="560" y="290" width="760" height="170" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 420.0 170.0 L 560.0 170.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 420.0 230.0 L 490.0 230.0 L 490.0 370.0 L 560.0 370.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">SELECT ... FOR UPDATE 한 줄이 잡는 락은 두 층이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">읽기 쿼리처럼 보이지만, 테이블 수준과 행 수준에 각각 락 표시를 남긴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.1">세션 A</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="174.3">BEGIN;</tspan><tspan x="56.0" y="193.1">SELECT * FROM orders</tspan><tspan x="56.0" y="211.8"> WHERE id = 7 FOR UPDATE;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="128.1">층 1 — 테이블 수준: orders 에 ROW SHARE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="152.1">공유 메모리의 락 테이블에 올라간다</tspan><tspan x="576.0" y="169.6">pg_locks 에 relation 락으로 보인다</tspan><tspan x="576.0" y="187.1">같은 테이블의 평범한 SELECT · UPDATE 와는 충돌하지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="318.1">층 2 — 행 수준: id = 7 튜플에 FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="342.1">락 정보가 메모리가 아니라 디스크의 튜플 헤더(xmax)에 적힌다</tspan><tspan x="576.0" y="359.6">pg_locks 에는 보통 안 나온다</tspan><tspan x="576.0" y="377.1">같은 행을 쓰려는 쪽 · 잠그려는 쪽만 막는다</tspan></text><rect x="439.5" y="138.9" width="100.9" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="490.0" y="154.9">한 줄이 두 층을</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="495.1">이 글은 두 층을 차례로 본다. 테이블 락 8모드, 행 락 4모드, 그리고 행 락이 어디에 저장되는가</tspan></text></svg>