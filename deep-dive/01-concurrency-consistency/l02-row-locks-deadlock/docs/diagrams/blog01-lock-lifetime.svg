<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="96" width="440" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="96" width="440" height="38" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="150" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="60" y="234" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="318" width="440" height="68" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/><rect x="60" y="402" width="440" height="68" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="660" y="486" width="440" height="68" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="60" y="576" width="1040" height="112" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 30.0 150.0 L 30.0 560.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 500.0 268.0 L 566.0 268.0 L 566.0 352.0 L 660.0 352.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 500.0 436.0 L 594.0 436.0 L 594.0 520.0 L 660.0 520.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">락은 문장이 아니라 트랜잭션이 끝날 때 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">예외: 세이브포인트 뒤에 얻은 락은 그 세이브포인트로 ROLLBACK 하면 즉시 풀린다 (문서 13.3.1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="280.0" y="120.7">세션 A  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="120.7">세션 B  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="30.0" y="132.1">시간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="177.1">1  BEGIN; SAVEPOINT s;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="200.8">트랜잭션 시작 — 세이브포인트 표시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="261.1">2  UPDATE coupons SET used = true WHERE id = 5</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="284.8">문장은 끝났지만 행 락은 그대로 쥐고 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="345.1">3  UPDATE coupons SET used = true WHERE id = 5</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="368.8">같은 행 — 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="429.1">4  ROLLBACK TO s</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="452.8">세이브포인트 뒤에 얻은 락이 즉시 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="513.1">5  (대기가 풀린다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="536.8">행 락이 풀렸으니 이어서 진행</tspan></text><rect x="527.0" y="292.0" width="78.0" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="566.0" y="307.1">A 의 행 락이</tspan><tspan x="566.0" y="322.1">B 를 세운다</tspan></text><rect x="562.3" y="460.0" width="63.4" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="594.0" y="475.1">락이 풀려</tspan><tspan x="594.0" y="490.1">B 가 깬다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="604.1">락의 수명 = 트랜잭션의 수명</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="628.1">문장이 끝나도 락은 풀리지 않는다. 락은 트랜잭션이 끝나거나(커밋 · 롤백) 세이브포인트로 ROLLBACK 할 때 풀린다.</tspan><tspan x="76.0" y="645.6">그래서 오래 열려 있는 트랜잭션이 위험하다. 락을 기다리는 쪽은 데드락이 아닌 한 무한정 기다린다 (문서 13.3.4).</tspan></text></svg>