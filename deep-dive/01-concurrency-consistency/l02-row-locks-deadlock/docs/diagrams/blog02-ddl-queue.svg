<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="360" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="520" y="130" width="360" height="200" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1000" y="130" width="360" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="370" width="1320" height="90" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="480" width="1320" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><path d="M 520.0 230.0 L 400.0 230.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 1000.0 230.0 L 880.0 230.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">읽기만 하던 쿼리가 ALTER 뒤에 선다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">세 세션, 같은 테이블 jobs (실측: psql 2026-10-13). 화살표는 &quot;기다린다&quot;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="158.1">세션 1 — 먼저 왔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="182.1">BEGIN; SELECT count(*) FROM jobs;</tspan><tspan x="56.0" y="199.6">후 열어 둠 (idle in transaction)</tspan><tspan x="56.0" y="217.1">ACCESS SHARE 를 쥐고 있다</tspan><tspan x="56.0" y="234.6">blocked_by = {}</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="158.1">세션 2 — ALTER TABLE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="182.1">ALTER TABLE jobs ADD COLUMN …</tspan><tspan x="536.0" y="199.6">ACCESS EXCLUSIVE 를 요청</tspan><tspan x="536.0" y="217.1">wait_event = relation  (granted = f)</tspan><tspan x="536.0" y="234.6">blocked_by = {세션 1}</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="158.1">세션 3 — 평범한 SELECT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="182.1">SELECT count(*) FROM jobs</tspan><tspan x="1016.0" y="199.6">ACCESS SHARE 를 요청</tspan><tspan x="1016.0" y="217.1">wait_event = relation  (granted = f)</tspan><tspan x="1016.0" y="234.6">blocked_by = {세션 2}</tspan></text><rect x="428.0" y="218.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="460.0" y="234.9">기다린다</tspan></text><rect x="908.0" y="218.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="940.0" y="234.9">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="397.1">왜 읽기가 막히나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="420.8">세션 1 의 ACCESS SHARE 와 세션 3 의 ACCESS SHARE 는 충돌하지 않는데도, ALTER 가 큐에 서 있다는 이유만으로 세션 3 이 막힌다 (soft block)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="507.1">교훈</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="530.8">긴 트랜잭션이 열려 있는 테이블에 DDL 을 던지면 DDL 자신이 아니라 그 뒤에 오는 모든 쿼리가 멈춘다</tspan><tspan x="56.0" y="548.3">DDL 에 lock_timeout 을 짧게 걸어 큐에 오래 서 있지 않게 한다 (해석 — 운영 판단, 문서가 권한 것은 아님)</tspan></text></svg>