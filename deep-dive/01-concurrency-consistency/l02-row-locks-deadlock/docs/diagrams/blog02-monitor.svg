<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="560" height="220" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="800" y="120" width="560" height="220" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="370" width="1320" height="130" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><path d="M 600.0 230.0 L 800.0 230.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">원인 세션을 찾는 두 걸음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">먼저 막힌 쪽을 나열하고, 사슬의 루트(남을 막지만 자신은 안 막힌 쪽)를 찾는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">1. 막힌 쪽 목록</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="172.1">pg_stat_activity 에서</tspan><tspan x="56.0" y="189.6">cardinality(pg_blocking_pids(pid)) &gt; 0 인 행</tspan><tspan x="56.0" y="207.1">&#160;</tspan><tspan x="56.0" y="224.6">보이는 것: pid · state · wait_event_type · wait_event ·</tspan><tspan x="56.0" y="242.1">blocked_by · 얼마나 기다렸나 · 쿼리 앞부분</tspan><tspan x="56.0" y="259.6">&#160;</tspan><tspan x="56.0" y="277.1">이쪽은 &quot;피해자&quot; 다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="148.1">2. 루트 원인</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="172.1">다른 세션의 blocked_by 에 등장하지만</tspan><tspan x="816.0" y="189.6">자신의 pg_blocking_pids 는 비어 있는 세션</tspan><tspan x="816.0" y="207.1">&#160;</tspan><tspan x="816.0" y="224.6">보이는 것: pid · state · xact_age · 마지막 쿼리</tspan><tspan x="816.0" y="242.1">&#160;</tspan><tspan x="816.0" y="259.6">대개 state = idle in transaction</tspan></text><rect x="644.9" y="218.9" width="110.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="234.9">사슬을 따라 간다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="398.1">루트가 idle in transaction 이면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="422.1">마지막 쿼리(last_query)가 그 트랜잭션이 마지막으로 한 일이다 — 락을 쥔 문장이 거기 있다</tspan><tspan x="56.0" y="439.6">wait_event = ClientRead 는 &quot;클라이언트가 다음 명령을 보내기를 기다린다&quot; 는 뜻이지 락 대기가 아니다</tspan></text></svg>