<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="330" height="70" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="380" y="130" width="330" height="70" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="720" y="130" width="330" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1060" y="130" width="300" height="70" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="300" width="640" height="190" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="720" y="300" width="640" height="190" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 380.0 250.0 L 1360.0 250.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)" marker-start="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">작업 큐의 정석 — 락은 커밋까지 간다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">집기(SELECT) · 표시(UPDATE) · 커밋이 한 트랜잭션이어야 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="205.0" y="171.1">BEGIN</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="545.0" y="161.6">SELECT … LIMIT 1</tspan><tspan x="545.0" y="179.1">FOR UPDATE SKIP LOCKED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="885.0" y="161.6">UPDATE jobs</tspan><tspan x="885.0" y="179.1">SET status = &#x27;running&#x27;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1210.0" y="171.1">COMMIT</tspan></text><rect x="793.2" y="238.2" width="153.7" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="870.0" y="255.3">행 락을 쥐고 있는 구간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">그 안에서 외부 호출 같은 긴 일을 하면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="352.1">락이 그만큼 길어진다</tspan><tspan x="56.0" y="369.6">&#160;</tspan><tspan x="56.0" y="387.1">집고 → 커밋 → 처리 → 결과 기록으로 나누는 설계는</tspan><tspan x="56.0" y="404.6">02.03 outbox 로 이어진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="328.1">LIMIT 과 락 (SELECT 문서)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="352.1">LIMIT 은 요구한 수만큼 행이 반환된 시점에 잠그기를 멈춘다</tspan><tspan x="736.0" y="369.6">(단 OFFSET 으로 건너뛴 행은 잠긴다)</tspan><tspan x="736.0" y="387.1">→ LIMIT 1 … FOR UPDATE 는 한 행만 잠근다</tspan></text></svg>