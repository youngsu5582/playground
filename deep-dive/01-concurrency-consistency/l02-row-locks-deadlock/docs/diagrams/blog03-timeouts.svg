<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="140" y="220" width="440" height="70" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="580" y="220" width="640" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="390" width="640" height="140" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="720" y="390" width="640" height="140" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 140.0 330.0 L 1230.0 330.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 140.0 190.0 L 580.0 190.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)" marker-start="url(#ahe03131)"/><path d="M 140.0 150.0 L 1220.0 150.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)" marker-start="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">lock_timeout 과 statement_timeout 은 재는 구간이 다르다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">한 문장이 서버에 도착해서 끝날 때까지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="360.0" y="260.7">락을 기다리는 구간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="900.0" y="260.7">실행 구간</tspan></text><rect x="1171.0" y="318.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="1190.0" y="334.9">시간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="140.0" y="358.1">명령이 서버에 도착</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="end" xml:space="preserve"><tspan x="1220.0" y="358.1">끝</tspan></text><rect x="188.5" y="178.2" width="343.0" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="360.0" y="195.3">lock_timeout — 락 획득 시도마다, 대기 중에만 잰다</tspan></text><rect x="513.0" y="138.2" width="334.0" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="680.0" y="155.3">statement_timeout — 도착부터 끝까지 전부 잰다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="417.1">lock_timeout (기본 0 = 꺼짐, 단위 없으면 ms)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="440.8">DB 객체의 락을 얻으려 기다리는 시간이 넘으면 문장을 중단한다</tspan><tspan x="56.0" y="458.3">명시적 락과 암묵적 락 모두에 적용된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="417.1">함께 쓸 때 (문서 20.11)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="440.8">statement_timeout 이 0 이 아닐 때 lock_timeout 을 같거나 큰 값으로 두면</tspan><tspan x="736.0" y="458.3">의미가 없다 — 문장 타임아웃이 먼저 걸린다</tspan><tspan x="736.0" y="475.8">둘 다 postgresql.conf 에 두는 것은 비권장 (모든 세션에 적용)</tspan></text></svg>