<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="140" width="300" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="400" y="140" width="300" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="760" y="140" width="280" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="320" width="300" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="400" y="320" width="300" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="760" y="320" width="280" height="80" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1080" y="320" width="280" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="450" width="1320" height="110" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 340.0 180.0 L 400.0 180.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 700.0 180.0 L 760.0 180.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 340.0 360.0 L 400.0 360.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 700.0 360.0 L 760.0 360.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">워커가 도중에 죽으면 — 트랜잭션을 어떻게 나눴느냐에 달렸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(해석 · 설계 판단 — 되돌리는 방법은 이 레슨의 범위 밖이고 문서로 확인한 것도 없다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="121.1">집기 · 처리 · 완료 기록이 한 트랜잭션</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="190.0" y="176.3">집고 → 처리하다</tspan><tspan x="190.0" y="195.1">워커가 죽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="550.0" y="176.3">트랜잭션 롤백</tspan><tspan x="550.0" y="195.1">락이 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="900.0" y="176.3">작업은 pending 으로</tspan><tspan x="900.0" y="195.1">돌아가 다시 집힌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="301.1">집기 → 커밋 → 처리로 나눔</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="190.0" y="356.3">선점(UPDATE) 커밋 후</tspan><tspan x="190.0" y="375.1">처리하다 워커가 죽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="550.0" y="356.3">커밋은 이미 끝났다</tspan><tspan x="550.0" y="375.1">롤백되지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="900.0" y="356.3">작업이 running 으로</tspan><tspan x="900.0" y="375.1">남는다 — 안 집힌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1096.0" y="346.1">재집기 설계가 따로 필요</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="477.1">그래서 외부 호출을 낀 처리는 트랜잭션에 넣지 않는 게 정석이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="500.8">그러면 상태 표시와 재집기(lease 만료 같은 설계)가 필수가 된다. 이 레슨은 재집기를 구현하지 않는다</tspan></text></svg>