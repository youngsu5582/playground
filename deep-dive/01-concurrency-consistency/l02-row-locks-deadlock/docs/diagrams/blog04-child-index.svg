<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="150" width="360" height="130" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="540" y="120" width="380" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="540" y="300" width="380" height="150" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="980" y="120" width="380" height="330" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 400.0 189.0 L 540.0 195.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 400.0 241.0 L 540.0 375.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">부모 DELETE 는 자식에서 일치하는 행을 찾아야 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">문서는 참조하는(자식) 열에 인덱스를 두는 것이 대개 좋다고 쓴다. 외래키 선언이 자식 인덱스를 자동으로 만들지는 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="177.1">부모 DELETE · 참조 열 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="200.8">자식에 이 부모를 가리키는 행이</tspan><tspan x="56.0" y="218.3">남아 있는지 확인해야 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="147.1">자식 열에 인덱스가 없으면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="170.8">자식 테이블 전체 스캔</tspan><tspan x="556.0" y="188.3">(자식이 수억 행이면 오래 걸린다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="327.1">자식 열에 인덱스가 있으면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="350.8">인덱스 스캔으로</tspan><tspan x="556.0" y="368.3">일치하는 행만 찾는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="147.1">락 관점의 부작용 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="170.8">스캔이 오래 걸리는 동안</tspan><tspan x="996.0" y="188.3">부모 행에 건 락과 트랜잭션도</tspan><tspan x="996.0" y="205.8">길어질 수 있다</tspan><tspan x="996.0" y="223.3">&#160;</tspan><tspan x="996.0" y="240.8">이 레슨에서 시간은</tspan><tspan x="996.0" y="258.3">측정하지 않았다</tspan></text></svg>