<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="340" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="520" y="110" width="380" height="230" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1020" y="130" width="340" height="190" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="380" width="1320" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><path d="M 380.0 225.0 L 520.0 225.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 225.0 L 1020.0 225.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">자식 INSERT 한 줄이 부모 행에 남기는 흔적</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">자식이 부모를 &quot;읽기만&quot; 하는 것처럼 보이지만, 부모 행에 락 표시가 남는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="159.1">세션 A</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="183.3">BEGIN;</tspan><tspan x="56.0" y="200.8">INSERT INTO order_items</tspan><tspan x="56.0" y="218.3">  (order_id) VALUES (5);</tspan><tspan x="56.0" y="235.8">&#160;</tspan><tspan x="56.0" y="253.3">(커밋은 아직)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="138.1">외래키 검사 (RI 트리거)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="162.1">부모가 존재하는지 확인하는 쿼리:</tspan><tspan x="536.0" y="179.6">&#160;</tspan><tspan x="536.0" y="197.1">SELECT 1 FROM ONLY orders x</tspan><tspan x="536.0" y="214.6"> WHERE id = 5</tspan><tspan x="536.0" y="232.1">   FOR KEY SHARE OF x</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1036.0" y="158.1">부모 orders 의 id = 5 행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1036.0" y="182.1">UPDATE 도 안 했는데</tspan><tspan x="1036.0" y="199.6">튜플에 락 표시가 남는다</tspan><tspan x="1036.0" y="217.1">= FOR KEY SHARE (가장 약한 행 락)</tspan></text><rect x="403.4" y="213.9" width="93.1" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="450.0" y="229.9">자식 INSERT</tspan></text><rect x="917.9" y="213.9" width="84.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="229.9">부모 행 잠금</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="408.1">그래서 이 글의 질문</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="432.1">부모 행이 이미 FOR KEY SHARE 로 잠겨 있을 때, 부모에 오는 UPDATE · DELETE 는 어떻게 되나?</tspan><tspan x="56.0" y="449.6">답은 락 모드의 충돌표(01 글)에서 나온다 — 부모의 키를 건드리느냐가 갈림길이다</tspan></text></svg>