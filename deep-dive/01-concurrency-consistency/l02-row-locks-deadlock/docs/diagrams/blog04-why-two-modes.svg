<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="440" height="250" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="560" y="130" width="380" height="250" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="980" y="130" width="380" height="250" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="410" width="1320" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 480.0 255.0 L 560.0 255.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">왜 &quot;가장 약한&quot; 락이면 되나 — 키만 지키면 된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">위 문장은 모드 정의에서 이은 해석이다. 두 모드를 둔 도입 이유를 문서가 따로 적은 것은 찾지 못했다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="159.1">자식이 필요한 보장</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="184.3">자식 행을 넣는 동안</tspan><tspan x="56.0" y="203.1">부모가 존재해야 하고</tspan><tspan x="56.0" y="221.8">지워지지 않아야 한다</tspan><tspan x="56.0" y="240.6">&#160;</tspan><tspan x="56.0" y="259.3">= 부모의 키가 안 바뀌고</tspan><tspan x="56.0" y="278.1">  안 지워지면 안전하다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="159.1">FOR KEY SHARE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="576.0" y="184.3">&quot;이 행의 키가 안 바뀌고</tspan><tspan x="576.0" y="203.1">안 지워지게&quot; 만 지킨다</tspan><tspan x="576.0" y="221.8">&#160;</tspan><tspan x="576.0" y="240.6">FOR UPDATE 하고만 충돌한다</tspan><tspan x="576.0" y="259.3">&#160;</tspan><tspan x="576.0" y="278.1">외래키 검사가 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="159.1">FOR NO KEY UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="184.3">키가 아닌 열을 바꾸는</tspan><tspan x="996.0" y="203.1">UPDATE 가 잡는다</tspan><tspan x="996.0" y="221.8">&#160;</tspan><tspan x="996.0" y="240.6">FOR KEY SHARE 와</tspan><tspan x="996.0" y="259.3">충돌하지 않는다</tspan></text><rect x="488.0" y="243.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="259.9">충분하다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="437.1">부모를 FOR UPDATE(가장 강함)로 잠그면 부모의 어떤 UPDATE 도 막히지만, 그럴 필요는 없다</tspan></text></svg>