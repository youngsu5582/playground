<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="300" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="400" y="120" width="300" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="760" y="120" width="300" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="400" y="270" width="300" height="80" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="400" y="400" width="300" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="520" width="340" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="430" y="520" width="340" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="820" y="520" width="380" height="80" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="780" y="270" width="580" height="210" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 340.0 160.0 L 400.0 160.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 700.0 160.0 L 760.0 160.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 550.0 200.0 L 550.0 270.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 550.0 350.0 L 550.0 400.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 450.0 480.0 L 210.0 520.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 550.0 480.0 L 600.0 520.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 650.0 480.0 L 1000.0 520.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">데드락 감지는 기다리자마자가 아니라 deadlock_timeout 뒤에 돈다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">락을 기다리게 된 프로세스는 지연을 두고 타이머를 건다 (lmgr README, 문서 20.12)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="190.0" y="156.3">락 요청이 충돌한다</tspan><tspan x="190.0" y="175.1">→ 대기를 시작한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="550.0" y="156.3">deadlock_timeout 타이머</tspan><tspan x="550.0" y="175.1">(기본 1초)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="910.0" y="156.6">그 사이에 락을 받으면</tspan><tspan x="910.0" y="174.1">그냥 끝 — 검사 비용 없음</tspan></text><rect x="704.5" y="148.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="730.0" y="164.9">받았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="550.0" y="306.3">타이머가 울렸는데도</tspan><tspan x="550.0" y="325.1">락을 못 받았다</tspan></text><rect x="576.2" y="223.9" width="67.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="610.0" y="239.9">못 받았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="550.0" y="436.3">데드락 감지/해소 코드를</tspan><tspan x="550.0" y="455.1">돌린다 (대기 그래프 검사)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="210.0" y="556.6">사이클 없음 →</tspan><tspan x="210.0" y="574.1">데드락이 아니다. 계속 대기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="556.6">soft 사이클만 →</tspan><tspan x="600.0" y="574.1">큐를 재배열, 아무도 abort 안 함</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="556.6">hard 사이클 → 시작점의 락 요청 취소</tspan><tspan x="1010.0" y="574.1">그 트랜잭션에 에러 (40P01)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="796.0" y="297.1">왜 기다리자마자 검사하지 않나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="796.0" y="320.8">데드락 검사는 비교적 비싸서 서버가 락을 기다릴 때마다</tspan><tspan x="796.0" y="338.3">돌리지 않는다 (문서 20.12)</tspan><tspan x="796.0" y="355.8">&#160;</tspan><tspan x="796.0" y="373.3">기본 1초는 &quot;실제로 쓸 수 있는 가장 작은 값쯤&quot; 이라고</tspan><tspan x="796.0" y="390.8">문서가 적는다 — 그래서 데드락도 최소 이 시간만큼은 기다린다</tspan></text></svg>