<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="636" viewBox="0 0 1160 636"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="96" width="440" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="96" width="440" height="38" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="150" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="234" width="440" height="68" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="318" width="440" height="68" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/><rect x="660" y="402" width="440" height="68" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/><rect x="60" y="492" width="1040" height="112" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 30.0 150.0 L 30.0 476.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 500.0 352.0 L 538.0 352.0 L 538.0 268.0 L 660.0 268.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 660.0 436.0 L 622.0 436.0 L 622.0 184.0 L 500.0 184.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">도입: 서로 상대의 행을 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">계좌 11111 · 22222 를 두 트랜잭션이 반대 순서로 UPDATE 한다 (문서 13.3.4 의 예)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="280.0" y="120.7">세션 A  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="120.7">세션 B  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="30.0" y="132.1">시간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="177.1">1  UPDATE accounts SET … WHERE acctnum = 11111</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="200.8">A 가 11111 행의 락을 쥔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="261.1">2  UPDATE accounts SET … WHERE acctnum = 22222</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="284.8">B 가 22222 행의 락을 쥔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="345.1">3  UPDATE accounts SET … WHERE acctnum = 22222</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="368.8">B 가 쥔 행 — 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="429.1">4  UPDATE accounts SET … WHERE acctnum = 11111</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="452.8">A 가 쥔 행 — 기다린다. 원이 닫힌다</tspan></text><rect x="494.3" y="292.0" width="87.4" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="538.0" y="307.1">A 는 B 의</tspan><tspan x="538.0" y="322.1">행을 기다린다</tspan></text><rect x="578.3" y="196.2" width="87.4" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="622.0" y="211.3">B 는 A 의</tspan><tspan x="622.0" y="226.3">행을 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="520.1">서로의 락을 기다리는 원 = 데드락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="544.1">A 는 B 를, B 는 A 를 기다린다. 둘 중 누구도 먼저 끝날 수 없으니 이 기다림은 영원히 풀리지 않는다.</tspan><tspan x="76.0" y="561.6">락 대기는 보통 무한정이지만, 이렇게 원이 생기면 엔진이 개입한다 — 데드락만이 엔진이 개입하는 유일한 대기다.</tspan></text></svg>