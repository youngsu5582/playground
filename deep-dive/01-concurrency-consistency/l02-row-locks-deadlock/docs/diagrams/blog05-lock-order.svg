<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="100" width="670" height="400" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="160" width="290" height="120" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="380" y="160" width="290" height="120" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="320" width="610" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="720" y="100" width="650" height="400" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="750" y="160" width="290" height="120" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1060" y="160" width="290" height="120" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="750" y="320" width="600" height="150" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="30" y="520" width="1340" height="70" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">예방 — 락 순서를 하나로: 방향이 아니라 행으로 정렬한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">이체 1 → 2 와 2 → 1 이 동시에 온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="50.0" y="129.1">인자 순서대로 (from → to) 잠그면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="187.1">이체 1 → 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="210.8">1 번 행을 잠그고</tspan><tspan x="76.0" y="228.3">2 번 행을 잠근다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="396.0" y="187.1">이체 2 → 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="396.0" y="210.8">2 번 행을 잠그고</tspan><tspan x="396.0" y="228.3">1 번 행을 잠근다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="348.1">서로 상대가 쥔 행을 기다리는 원</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="372.1">각자 첫 행을 쥔 채 둘째 행을 기다린다</tspan><tspan x="76.0" y="389.6">→ 데드락. 끊긴 쪽은 40P01 을 받는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="740.0" y="129.1">행 id 의 오름차순으로 잠그면 (구현 2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="187.1">이체 1 → 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="210.8">first = min = 1 번을 잠그고</tspan><tspan x="766.0" y="228.3">second = max = 2 번을 잠근다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1076.0" y="187.1">이체 2 → 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1076.0" y="210.8">first = min = 1 번을 잠그고</tspan><tspan x="1076.0" y="228.3">second = max = 2 번을 잠근다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="348.1">원이 생길 수 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="372.1">둘 다 1 → 2 순서이므로, 뒤에 온 쪽은 첫 행에서</tspan><tspan x="766.0" y="389.6">그냥 줄을 선다. UPDATE 의 방향(from → to)은 그대로 둔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="547.1">잠그는 대상을 방향이 아니라 행으로 정렬한다 — 문서의 1차 방어: 여러 객체에 대해 일관된 순서로 락을 잡는 것 (13.3.4)</tspan></text></svg>