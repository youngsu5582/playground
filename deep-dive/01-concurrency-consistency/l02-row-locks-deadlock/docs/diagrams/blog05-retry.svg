<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="100" width="1340" height="270" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="160" width="300" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="160" width="300" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="860" y="160" width="300" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="460" y="275" width="300" height="80" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="400" width="640" height="200" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="720" y="400" width="640" height="200" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 360.0 200.0 L 460.0 200.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 760.0 200.0 L 860.0 200.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 610.0 240.0 L 610.0 275.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 460.0 315.0 L 210.0 315.0 L 210.0 240.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">순서를 못 정할 때 — 끊긴 트랜잭션을 통째로 재시도한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">문서 13.3.4: 사전에 검증하기 어렵다면 데드락으로 abort 된 트랜잭션을 재시도하는 것으로 즉석에서 처리할 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="50.0" y="128.1">재시도 루프 — 트랜잭션 바깥 (@Transactional 바깥)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="210.0" y="196.3">트랜잭션 전체를</tspan><tspan x="210.0" y="215.1">처음부터 실행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="610.0" y="196.3">SQLSTATE 가</tspan><tspan x="610.0" y="215.1">40P01 인가?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="196.3">아니오 →</tspan><tspan x="1010.0" y="215.1">커밋 · 끝</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="610.0" y="311.6">예 → 횟수 상한 + 지터로</tspan><tspan x="610.0" y="329.1">잠깐 쉰다</tspan></text><rect x="784.5" y="173.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="810.0" y="189.9">아니오</tspan></text><rect x="627.5" y="246.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="640.0" y="262.9">예</tspan></text><rect x="288.2" y="303.9" width="93.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="335.0" y="319.9">처음부터 다시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="427.1">규칙 (01.01 문서 05 와 같다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="450.8">재시도는 트랜잭션 바깥에서, 처음부터 전체를</tspan><tspan x="56.0" y="468.3">(끊긴 트랜잭션은 이미 롤백됐다)</tspan><tspan x="56.0" y="485.8">SQLSTATE 40P01 로 판정한다 — 메시지 문구가 아니라 코드</tspan><tspan x="56.0" y="503.3">횟수 상한 + 지터 (해석 · 일반적인 설계)</tspan><tspan x="56.0" y="520.8">부수효과(메일 · 외부 API)는 커밋 이후로</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="427.1">그 밖의 방어</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="450.8">트랜잭션을 짧게 — 락을 쥐는 시간이 줄면</tspan><tspan x="736.0" y="468.3">원이 만들어질 창도 줄어든다 (해석)</tspan><tspan x="736.0" y="485.8">필요한 것을 한 번에 잠그기</tspan><tspan x="736.0" y="503.3">외부 호출을 락 안에 넣지 않기</tspan></text></svg>