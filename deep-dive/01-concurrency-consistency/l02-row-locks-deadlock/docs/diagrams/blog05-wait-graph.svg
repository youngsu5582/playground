<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="100" width="670" height="440" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><circle cx="200" cy="270" r="60" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><circle cx="520" cy="270" r="60" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="410" width="610" height="110" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="720" y="100" width="650" height="440" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><circle cx="880" cy="270" r="60" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><circle cx="1200" cy="270" r="60" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="740" y="410" width="610" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 255.0 235.0 L 350.0 205.0 L 465.0 235.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 465.0 305.0 L 360.0 345.0 L 255.0 305.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 935.0 235.0 L 1030.0 205.0 L 1145.0 235.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 1145.0 305.0 L 1040.0 345.0 L 935.0 305.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">대기 그래프에서 사이클이 있을 때, 그때만 데드락이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">lmgr README — 사이클이 soft 간선(큐 순서만 바꾸면 풀리는 대기)으로만 이뤄졌는가에 따라 다르다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="50.0" y="130.1">hard deadlock</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="200.0" y="266.3">트랜잭션</tspan><tspan x="200.0" y="285.1">A</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="266.3">트랜잭션</tspan><tspan x="520.0" y="285.1">B</tspan></text><rect x="299.1" y="178.9" width="121.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="360.0" y="194.9">A 가 B 를 기다린다</tspan></text><rect x="299.1" y="348.9" width="121.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="360.0" y="364.9">B 가 A 를 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="437.1">큐를 재배열해도 안 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="460.8">시작점의 락 요청을 취소하고</tspan><tspan x="76.0" y="478.3">그 트랜잭션에 에러를 보고하는 것으로 해소한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="740.0" y="130.1">soft 간선으로만 된 사이클</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="266.3">프로세스</tspan><tspan x="880.0" y="285.1">C</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" y="266.3">프로세스</tspan><tspan x="1200.0" y="285.1">D</tspan></text><rect x="997.9" y="178.9" width="84.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="1040.0" y="194.9">큐 순서 대기</tspan></text><rect x="997.9" y="348.9" width="84.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="1040.0" y="364.9">큐 순서 대기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="437.1">대기 큐의 순서를 바꾸면 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="460.8">아무도 abort 하지 않고 풀 수 있다</tspan><tspan x="756.0" y="478.3">(대기 우선순위 때문에 생긴 대기)</tspan></text></svg>