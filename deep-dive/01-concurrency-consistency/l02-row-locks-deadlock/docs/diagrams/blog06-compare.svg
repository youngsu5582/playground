"400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1070.0" y="524.9">innodb_deadlock_detect (전역, 동적)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="130.0" y="606.9">데드락 확인</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="500.0" y="606.9">서버 로그 (deadlock detected + DETAIL)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1070.0" y="606.9">SHOW ENGINE INNODB STATUS (최근 하나) · innodb_print_all_deadlocks</tspan></text></svg>