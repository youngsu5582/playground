.0" y="466.5">20</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="492.0" y="520.1">레코드 20 + 그 앞의 간격</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="571.1">갭 락은 범위 조건 잠금으로 팬텀을 막는 데 쓰인다. READ COMMITTED 에서는 검색 · 인덱스 스캔의 갭 락이 꺼지고 외래키 검사 · 중복 키 검사에만 쓰인다</tspan></text></svg>