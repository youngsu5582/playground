<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="440" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="490" y="100" width="870" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="156" width="440" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="490" y="156" width="870" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="246" width="440" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="490" y="246" width="870" height="80" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="336" width="440" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="490" y="336" width="870" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="426" width="440" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="490" y="426" width="870" height="80" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="530" width="1320" height="50" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">PESSIMISTIC_WRITE 는 호출 방식에 따라 다른 락 절이 된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">Hibernate 6.4.10 · 6.6.58 을 PostgreSQL 16 에 붙여 show_sql 로 읽은 결과 (실측: 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="127.3">요청</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="925.0" y="127.3">PostgreSQL 16 에서 나간 락 절</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="192.6">PESSIMISTIC_WRITE</tspan><tspan x="260.0" y="210.1">em.find · JPQL setLockMode</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="925.0" y="192.6">… where s1_0.id=? for no key update</tspan><tspan x="925.0" y="210.1">(for update 가 아니다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="282.6">PESSIMISTIC_WRITE</tspan><tspan x="260.0" y="300.1">em.lock (이미 읽은 엔티티)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="925.0" y="282.6">select id from Stock where id=? and version=?</tspan><tspan x="925.0" y="300.1">for update  — 여기만 for update</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="372.6">PESSIMISTIC_READ</tspan><tspan x="260.0" y="390.1">em.find · JPQL</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="925.0" y="381.3">for share</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="260.0" y="462.6">PESSIMISTIC_READ</tspan><tspan x="260.0" y="480.1">em.lock</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="925.0" y="462.6">select id from Stock where id=? and version=?</tspan><tspan x="925.0" y="480.1">for share</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="557.1">같은 PESSIMISTIC_WRITE 가 find · JPQL 이면 FOR NO KEY UPDATE, em.lock 이면 FOR UPDATE — 호출 방식에 따라 락 모드가 달라진다</tspan></text></svg>