<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="260" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="310" y="100" width="520" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="840" y="100" width="520" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="156" width="260" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="310" y="156" width="520" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="840" y="156" width="520" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="266" width="260" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="310" y="266" width="520" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="840" y="266" width="520" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="376" width="260" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="310" y="376" width="520" height="100" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="840" y="376" width="520" height="100" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="500" width="1320" height="50" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">jakarta.persistence.lock.timeout 힌트는 SQL 에 어떻게 반영되나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">PESSIMISTIC_WRITE + find · JPQL 기준 (실측: Hibernate 6.4.10 · 6.6.58 · 7.4.13, 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="127.3">힌트 값</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="127.3">6.4 · 6.6</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1100.0" y="127.3">7.4.13 (참고)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="211.3">힌트 0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="210.9">for no key update nowait</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1100.0" y="210.6">for no key update of s1_0 nowait</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="321.3">힌트 -2</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="320.9">for no key update skip locked</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1100.0" y="320.6">for no key update of s1_0 skip locked</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="431.3">힌트 3000 (양수)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="422.8">for no key update</tspan><tspan x="570.0" y="439.1">절 그대로, 추가 SQL 도 없다 — 무한 대기</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1100.0" y="415.6">select current_setting(&#x27;lock_timeout&#x27;, true)</tspan><tspan x="1100.0" y="430.6">→ set local lock_timeout = 3000 → 잠금 SELECT</tspan><tspan x="1100.0" y="445.6">→ set local lock_timeout = 0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="526.1">6.x 에서 &quot;JPA 힌트로 3 초 대기&quot; 는 PostgreSQL 에서 안 먹고 무한 대기다 — SET LOCAL lock_timeout 을 직접 걸거나 7.x 로 올려야 한다</tspan></text></svg>