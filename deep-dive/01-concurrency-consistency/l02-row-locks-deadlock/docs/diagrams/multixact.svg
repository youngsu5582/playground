<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="400" height="190" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="500" y="110" width="420" height="190" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="980" y="110" width="380" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="340" width="1320" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 440.0 205.0 L 500.0 205.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 920.0 205.0 L 980.0 205.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">행 락은 튜플 헤더에 적힌다 — 둘 이상이 잡으면 MultiXact</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">FOR KEY SHARE(A)와 FOR SHARE(B)가 같은 행을 잡았을 때 (실측: psql 2026-10-13, pageinspect)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="137.1">한 트랜잭션이 잡을 때</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="159.8">t_xmax = 잠근 트랜잭션 ID</tspan><tspan x="56.0" y="176.1">플래그 HEAP_XMAX_LOCK_ONLY</tspan><tspan x="56.0" y="192.3">= &quot;xmax 는 삭제자가 아니라 잠금자&quot;</tspan><tspan x="56.0" y="208.6">(01.01 docs 04 실측: xmax = 761)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="137.1">둘 이상이 잡을 때</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="159.8">t_xmax = 2  (MultiXact ID)</tspan><tspan x="516.0" y="176.1">플래그 LOCK_ONLY + IS_MULTI</tspan><tspan x="516.0" y="192.3">행 헤더에는 MultiXact ID 하나만 있다</tspan><tspan x="516.0" y="208.6">(예: 두 트랜잭션이 같은 행에 락을 건 경우)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="137.1">pg_multixact 에 따로 저장</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="159.8">pg_get_multixact_members(2)</tspan><tspan x="996.0" y="176.1">  756   keysh   (A: FOR KEY SHARE)</tspan><tspan x="996.0" y="192.3">  757   sh      (B: FOR SHARE)</tspan><tspan x="996.0" y="208.6">각 멤버가 어떤 모드로 잡았는지 함께 기록</tspan></text><rect x="429.7" y="193.9" width="80.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="209.9">둘째 잠금자</tspan></text><rect x="916.2" y="193.9" width="67.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="209.9">멤버 목록</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="367.1">그래서 생기는 일</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="389.8">행 락 정보는 공유 메모리의 락 테이블이 아니라 디스크의 튜플에 있다 → 잠글 수 있는 행 수에 제한이 없다 (문서 13.3.2)</tspan><tspan x="56.0" y="406.1">대신 SELECT FOR UPDATE 도 페이지를 더럽힌다(디스크 쓰기). 그래서 pg_locks 에는 행 락이 한 줄씩 나오지 않는다 (문서 pg_locks)</tspan><tspan x="56.0" y="422.3">MultiXact 도 wraparound 를 피하려면 VACUUM 이 정리해야 한다 (문서 25.1.5.1)</tspan></text></svg>