<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="100" width="1340" height="270" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="150" width="360" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="520" y="150" width="400" height="190" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1010" y="150" width="340" height="190" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="30" y="390" width="1340" height="280" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="440" width="360" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="520" y="440" width="400" height="200" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="1010" y="440" width="340" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 520.0 245.0 L 420.0 245.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 1010.0 245.0 L 920.0 245.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 520.0 540.0 L 420.0 540.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 1010.0 540.0 L 920.0 540.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">줄 서기의 실제 모양 — pg_stat_activity 에 찍힌 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">행 락 줄(위)과 테이블 락 줄(아래). 숫자는 이 랩의 실측 (psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="50.0" y="128.1">행 락 — 같은 행 UPDATE 세 개</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="177.1">세션 A  (pid 162)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="199.8">FOR UPDATE 로 행을 잡고 열어 둠</tspan><tspan x="76.0" y="216.1">state = idle in transaction</tspan><tspan x="76.0" y="232.3">wait_event = ClientRead</tspan><tspan x="76.0" y="248.6">blocked_by = {}</tspan><tspan x="76.0" y="264.8">자기 트랜잭션 ID 758 에 ExclusiveLock</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="177.1">세션 B  (pid 168)  — 줄의 맨 앞</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="199.8">UPDATE 가 멈춤</tspan><tspan x="536.0" y="216.1">wait_event = Lock / transactionid</tspan><tspan x="536.0" y="232.3">blocked_by = {162}</tspan><tspan x="536.0" y="248.6">A 의 ID 758 에 ShareLock 을 기다림 (granted=f)</tspan><tspan x="536.0" y="264.8">행의 tuple 락은 B 가 잡음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1026.0" y="177.1">세션 C  (pid 175)  — B 뒤</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1026.0" y="199.8">같은 행 UPDATE 가 멈춤</tspan><tspan x="1026.0" y="216.1">wait_event = Lock / tuple</tspan><tspan x="1026.0" y="232.3">blocked_by = {168}  (A 가 아니라 B)</tspan><tspan x="1026.0" y="248.6">tuple 락 ExclusiveLock 을 기다림 (granted=f)</tspan></text><rect x="438.0" y="233.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="249.9">기다린다</tspan></text><rect x="933.0" y="233.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="965.0" y="249.9">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="50.0" y="418.1">테이블 락 — 읽기만 하던 쿼리가 ALTER 뒤에 선다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="467.1">세션 1  (pid 297)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="489.8">BEGIN; SELECT count(*) FROM jobs;</tspan><tspan x="76.0" y="506.1">후 열어 둠 (idle in transaction)</tspan><tspan x="76.0" y="522.3">AccessShareLock  granted = t</tspan><tspan x="76.0" y="538.6">blocked_by = {}</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="467.1">세션 2  (pid 304)  — ALTER TABLE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="489.8">ALTER TABLE jobs ADD COLUMN …</tspan><tspan x="536.0" y="506.1">wait_event = Lock / relation</tspan><tspan x="536.0" y="522.3">AccessExclusiveLock  granted = f</tspan><tspan x="536.0" y="538.6">blocked_by = {297}</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1026.0" y="467.1">세션 3  (pid 311)  — 평범한 SELECT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1026.0" y="489.8">SELECT count(*) FROM jobs</tspan><tspan x="1026.0" y="506.1">wait_event = Lock / relation</tspan><tspan x="1026.0" y="522.3">AccessShareLock  granted = f</tspan><tspan x="1026.0" y="538.6">blocked_by = {304}  (ALTER 에 막힘)</tspan></text><rect x="438.0" y="528.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="544.9">기다린다</tspan></text><rect x="933.0" y="528.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="965.0" y="544.9">기다린다</tspan></text></svg>