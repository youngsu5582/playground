# compose 프로젝트 이름 — 없으면 폴더명(observe)이 되어 레슨끼리 컨테이너를 덮어쓴다
name: deepdive-01-02
# 손으로 관찰하는 용도. 테스트(Testcontainers)와는 별개의 컨테이너다.
# deadlock_timeout 을 5s 로 늘렸다 — 세 번째 터미널에서 "기다리는 중"을 볼 시간을 벌려고. (테스트는 200ms)
services:
  pg:
    image: postgres:16-alpine
    container_name: deepdive-01.02-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command: ["postgres", "-c", "deadlock_timeout=5s", "-c", "log_lock_waits=on"]
    ports: ["55433:5432"]
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
