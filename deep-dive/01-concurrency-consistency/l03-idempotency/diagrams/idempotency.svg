<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="660" height="740" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="170" width="300" height="100" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><rect x="380" y="170" width="300" height="100" rx="10" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="330" width="620" height="120" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="60" y="520" width="220" height="62" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><rect x="296" y="520" width="384" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="60" y="596" width="220" height="62" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><rect x="296" y="596" width="384" height="62" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="60" y="672" width="220" height="62" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><rect x="296" y="672" width="384" height="62" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="60" y="748" width="220" height="62" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><rect x="296" y="748" width="384" height="62" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="730" y="110" width="670" height="740" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="965" y="170" width="200" height="44" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="915" y="244" width="300" height="112" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="750" y="420" width="290" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1090" y="420" width="290" height="130" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="940" y="600" width="250" height="44" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="750" y="682" width="630" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 210.0 270.0 L 215.0 330.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 530.0 270.0 L 525.0 330.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><path d="M 1065.0 214.0 L 1065.0 244.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 975.0 356.0 L 895.0 420.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 1155.0 356.0 L 1235.0 420.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 895.0 550.0 L 895.0 622.0 L 940.0 622.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1235.0 550.0 L 1235.0 622.0 L 1190.0 622.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">멱등성 — 같은 요청이 두 번 와도 한 번만</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">확인과 선점을 한 문장으로 합치면, 기다림 · 재생 · 재시도가 DB 에서 공짜로 온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="141.1">확인하고 넣기는 깨진다 (Q01 · Q02)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="199.1">A   SELECT … WHERE key</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="223.3">-&gt; 0행   (없네, 내가 넣자)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="396.0" y="199.1">B   SELECT … WHERE key</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="396.0" y="223.3">-&gt; 0행   (없네, 내가 넣자)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="357.1">둘 다 INSERT 한다 -&gt; 같은 키 2행, 결제도 2번</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="379.8">SELECT 와 INSERT 사이의 틈에서 서로를 못 본다 (제약이 없을 때)</tspan><tspan x="76.0" y="396.1">유니크 제약이 있으면 둘째는 에러 23505 — 중복은 막히지만 에러로 샌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="500.1">한 문장으로 선점한다 — INSERT … ON CONFLICT DO NOTHING (Q03 ~ Q07)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="556.3">처음 보는 키</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="488.0" y="556.3">1행 = 선점 성공 -&gt; 내가 처리한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="632.3">이미 커밋된 키</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="488.0" y="632.3">0행 = 선점 실패 -&gt; 저장된 응답을 돌려준다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="708.3">남이 처리 중 (미커밋)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="488.0" y="708.3">기다린다 ... 끝나면 0행 -&gt; 응답 재생 (Q03 Q07)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="170.0" y="784.3">남이 처리하다 롤백</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="488.0" y="784.3">기다리다 1행 -&gt; 내가 처리한다 (Q05)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="839.1">DO NOTHING 이어도 &#x27;기다림&#x27; 은 있다. 영향 행 수 0 / 1 이 곧 선점 여부</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="750.0" y="141.1">PaymentService#pay — 한 호출 = 한 트랜잭션</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1065.0" y="197.7">BEGIN</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1065.0" y="273.1">claim   (빈칸 1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1065.0" y="297.3">INSERT … ON CONFLICT</tspan><tspan x="1065.0" y="314.8">DO NOTHING -&gt; 영향 행 수</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="895.0" y="449.1">process   (제공)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="895.0" y="473.3">외부 결제 호출</tspan><tspan x="895.0" y="490.8">payments INSERT</tspan><tspan x="895.0" y="508.3">키를 DONE 으로</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1235.0" y="449.1">replay   (빈칸 2)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1235.0" y="473.3">저장된 request_hash 와 비교</tspan><tspan x="1235.0" y="490.8">다르면 Conflict 예외</tspan><tspan x="1235.0" y="508.3">같으면 저장된 응답</tspan></text><rect x="918.8" y="376.9" width="32.4" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="935.0" y="392.9">1행</tspan></text><rect x="1178.8" y="376.9" width="32.4" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="1195.0" y="392.9">0행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1065.0" y="627.7">COMMIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="709.1">예외가 나면 ROLLBACK — 키 행도 같이 사라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="766.0" y="731.8">외부 결제가 실패하면 같은 키로 다시 시도할 수 있다</tspan><tspan x="766.0" y="748.1">에러 23505 를 맞은 트랜잭션은 이후 문장이 전부 25P02 (Q09)</tspan><tspan x="766.0" y="764.3">-&gt; ON CONFLICT 로 에러 자체를 피하거나, SAVEPOINT 로 감싼다 (Q10)</tspan><tspan x="766.0" y="780.6">키를 먼저 커밋하는 설계는 죽은 처리를 풀 lease 가 필요하다</tspan></text></svg>