<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="400" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="500" y="110" width="400" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="960" y="110" width="400" height="100" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="290" width="400" height="100" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="500" y="290" width="400" height="100" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="960" y="290" width="400" height="100" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="440" width="660" height="190" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="720" y="440" width="640" height="190" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 440.0 160.0 L 500.0 160.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 160.0 L 960.0 160.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 440.0 340.0 L 500.0 340.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 340.0 L 960.0 340.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1160.0 210.0 L 1160.0 250.0 L 240.0 250.0 L 240.0 290.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">멱등 키 관례 — 클라이언트가 키를 만들고, 서버가 그 키로 중복을 알아본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">POST 를 멱등하게 만드는 업계 관례 (Stripe API · IETF 초안이 같은 방식)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">1  클라이언트가 키를 만든다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="162.1">요청마다 고유한 키</tspan><tspan x="56.0" y="179.6">UUID v4 같은 무작위 문자열을 권한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="138.1">2  헤더로 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="162.1">Idempotency-Key: &lt;키&gt;</tspan><tspan x="516.0" y="179.6">요청 본문과 함께</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="138.1">3  서버가 처음 보는 키다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="162.1">처리하고, 첫 요청의 상태 코드와</tspan><tspan x="976.0" y="179.6">본문을 저장해 둔다</tspan></text><rect x="453.0" y="150.1" width="34.0" height="19.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="164.2">전송</tspan></text><rect x="913.0" y="150.1" width="34.0" height="19.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="930.0" y="164.2">도착</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="318.1">4  응답을 못 받았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="342.1">같은 키로 다시 보낸다</tspan><tspan x="56.0" y="359.6">(재시도에서도 그대로 쓴다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="318.1">5  서버가 같은 키를 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="516.0" y="342.1">중복이다 — 새로 처리하지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="318.1">6  저장된 응답을 돌려준다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="342.1">재생(replay)</tspan></text><rect x="453.0" y="330.1" width="34.0" height="19.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="470.0" y="344.2">전송</tspan></text><rect x="913.0" y="330.1" width="34.0" height="19.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="930.0" y="344.2">조회</tspan></text><rect x="659.7" y="230.8" width="80.6" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="700.0" y="246.8">시간이 지나</tspan><tspan x="700.0" y="263.1">재시도</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="468.1">Stripe API v1 (docs.stripe.com)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="491.1">키는 255자 이하</tspan><tspan x="56.0" y="507.3">엔드포인트 실행이 시작된 뒤 첫 요청의 상태 코드와 본문을 저장 (500 도 포함)</tspan><tspan x="56.0" y="523.6">24시간 이상 지난 키는 지울 수 있다 — 지운 뒤 같은 키는 새 요청</tspan><tspan x="56.0" y="539.8">파라미터가 원래 요청과 다르면 에러</tspan><tspan x="56.0" y="556.1">검증 실패 · 동시 실행 충돌은 결과를 저장하지 않아 재시도할 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="468.1">IETF 초안 -07 (표준이 아니다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="491.1">조회한 2026-10-13 현재 만료(Expired &amp; archived)로 표시</tspan><tspan x="736.0" y="507.3">헤더 값은 Structured Header String</tspan><tspan x="736.0" y="523.6">키는 고유해야 하고 다른 페이로드에 재사용 금지 (MUST)</tspan><tspan x="736.0" y="539.8">같은 키 + 다른 페이로드 -&gt; 422 · 처리 중 -&gt; 409 (SHOULD)</tspan><tspan x="736.0" y="556.1">키가 없으면 400 (SHOULD) · 만료 정책은 서버가 정해 문서화</tspan></text></svg>