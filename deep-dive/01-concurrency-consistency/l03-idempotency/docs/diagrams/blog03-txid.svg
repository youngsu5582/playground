<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="560" height="130" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="800" y="110" width="560" height="130" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="330" width="560" height="100" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><rect x="800" y="330" width="560" height="100" rx="10" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="470" width="1320" height="140" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 320.0 240.0 L 320.0 330.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 1080.0 240.0 L 1080.0 330.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><path d="M 1000.0 240.0 L 1000.0 290.0 L 480.0 290.0 L 480.0 330.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">기다림의 정체 — 행이 아니라 트랜잭션이 끝나기를 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">실측: psql 2026-10-13, PostgreSQL 16.14. 예측을 끝낸 뒤 펼치는 그림이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">세션 A</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="161.1">idem 에 &#x27;k2&#x27; INSERT, 커밋 전</tspan><tspan x="56.0" y="177.3">pg_stat_activity: Timeout / PgSleep (커밋 전에 멈춰 있다)</tspan><tspan x="56.0" y="193.6">자기 트랜잭션 ID 에 ExclusiveLock (granted = t)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="138.1">세션 B</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="161.1">같은 키 INSERT</tspan><tspan x="816.0" y="177.3">pg_stat_activity: wait_event_type = Lock</tspan><tspan x="816.0" y="193.6">wait_event = transactionid</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="357.1">A 의 트랜잭션 ID</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="380.8">ExclusiveLock — A 가 쥔다 (t)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="357.1">B 의 트랜잭션 ID</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="380.8">ExclusiveLock — B 가 쥔다 (t)</tspan></text><rect x="257.7" y="274.5" width="124.6" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="320.0" y="289.6">A 가 자기 ID 에 건다</tspan></text><rect x="1017.7" y="274.5" width="124.6" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="1080.0" y="289.6">B 가 자기 ID 에 건다</tspan></text><rect x="651.7" y="272.0" width="176.6" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="740.0" y="287.1">ShareLock 요청 (granted = f)</tspan><tspan x="740.0" y="302.1">A 가 끝나기를 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="498.1">모든 트랜잭션은 자기 트랜잭션 ID 에 ExclusiveLock 을 쥔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="521.1">상대가 끝나기를 기다리는 쪽은 그 ID 에 ShareLock 을 요청하고, 상대가 끝나면 풀린다.</tspan><tspan x="56.0" y="537.3">locktype = transactionid — 행이 아니라 트랜잭션이 끝나기를 기다린다는 뜻이다.</tspan><tspan x="56.0" y="553.6">(락 모델은 소스 README src/backend/storage/lmgr/README 와 01.01 문서 04 의 행 락 대기와 같은 모양)</tspan></text></svg>