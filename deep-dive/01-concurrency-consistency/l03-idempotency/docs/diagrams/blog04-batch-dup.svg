<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="540" viewBox="0 0 1360 540"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="1280" height="90" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="250" width="620" height="170" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="700" y="250" width="620" height="170" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="450" width="1280" height="60" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 350.0 190.0 L 350.0 250.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 1010.0 190.0 L 1010.0 250.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">한 문장에서 같은 키를 두 번 넣으면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">DO UPDATE 는 &quot;결정적&quot; 이어서 한 명령이 같은 기존 행을 두 번 이상 건드릴 수 없다 (cardinality violation)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="128.1">VALUES (&#x27;z&#x27;,&#x27;1&#x27;), (&#x27;z&#x27;,&#x27;2&#x27;)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="152.1">같은 키 &#x27;z&#x27; 가 한 문장 안에 두 번 들어 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="278.1">… ON CONFLICT (key) DO UPDATE …</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="301.1">에러</tspan><tspan x="56.0" y="317.3">ON CONFLICT DO UPDATE command cannot affect row a second time</tspan><tspan x="56.0" y="333.6">HINT: Ensure that no rows proposed for insertion within</tspan><tspan x="56.0" y="349.8">the same command have duplicate constrained values.</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="278.1">… ON CONFLICT (key) DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="303.1">에러 없이 INSERT 0 1</tspan><tspan x="716.0" y="321.8">둘째 행은 건너뛴다</tspan></text><rect x="310.6" y="209.5" width="78.7" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="350.0" y="224.6">DO UPDATE</tspan></text><rect x="966.7" y="209.5" width="86.6" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="224.6">DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="478.1">배치 upsert 를 짤 때 입력 키 중복을 먼저 제거해야 하는 이유</tspan></text></svg>