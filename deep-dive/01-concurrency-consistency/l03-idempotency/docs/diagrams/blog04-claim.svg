<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="460" viewBox="0 0 1360 460"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="1280" height="54" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="220" width="620" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="700" y="220" width="620" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><path d="M 350.0 154.0 L 350.0 220.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 1010.0 154.0 L 1010.0 220.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">영향 행 수로 선점을 판정한다 — claim</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">DO NOTHING + 영향 행 수. RETURNING 으로도 같은 판정이 된다 (행이 돌아오면 선점)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="680.0" y="133.1">INSERT … ON CONFLICT (key) DO NOTHING  →  영향 행 수는?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="250.1">1행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="275.6">내가 키를 넣었다 = 선점 성공</tspan><tspan x="56.0" y="294.3">다음: 처리한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="250.1">0행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="275.6">이미 있다 = 선점 실패</tspan><tspan x="716.0" y="294.3">다음: 저장된 상태를 읽어 재생 · 거절 (문서 06)</tspan></text><rect x="330.3" y="176.5" width="39.4" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="350.0" y="191.6">새 키</tspan></text><rect x="970.6" y="176.5" width="78.7" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="191.6">이미 있던 키</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="414.1">이 레슨의 claim = INSERT … ON CONFLICT DO NOTHING 의 영향 행 수가 1 인지로 판정</tspan></text></svg>