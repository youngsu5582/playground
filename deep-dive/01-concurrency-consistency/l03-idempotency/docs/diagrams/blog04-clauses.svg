<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 1360 560"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="1280" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="250" width="620" height="170" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="700" y="250" width="620" height="170" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="450" width="1280" height="90" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 350.0 200.0 L 350.0 250.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1010.0 200.0 L 1010.0 250.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">ON CONFLICT — 부딪혔을 때 하는 일을 한 문장에 적는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">INSERT 를 하다 유니크 위반이 나는 대신, 미리 정해 둔 대체 동작을 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="127.1">INSERT INTO idempotency_keys (key, request_hash, status)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="150.8">VALUES (&#x27;pay-1&#x27;, &#x27;h1&#x27;, &#x27;IN_PROGRESS&#x27;)</tspan><tspan x="56.0" y="168.3">ON CONFLICT (key) DO NOTHING   |   DO UPDATE SET …</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="280.1">DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="305.6">충돌했을 때: 삽입하지 않고 넘어간다</tspan><tspan x="56.0" y="324.3">&#160;</tspan><tspan x="56.0" y="343.1">용도: &quot;내가 선점했나&quot; 판정</tspan><tspan x="56.0" y="361.8">conflict_target 을 생략할 수 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="280.1">DO UPDATE SET …</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="305.6">충돌했을 때: 충돌한 기존 행을 갱신한다</tspan><tspan x="716.0" y="324.3">&#160;</tspan><tspan x="716.0" y="343.1">용도: 카운터 올리기 · 상태 재선점 · upsert</tspan><tspan x="716.0" y="361.8">conflict_target 을 반드시 적어야 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="477.1">중재자(arbiter)로 쓸 수 있는 것은 NOT DEFERRABLE 제약과 유니크 인덱스뿐이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="500.8">conflict_target 에 적은 컬럼에 유니크 제약이 없으면 에러가 난다 (실측: psql 2026-10-13)</tspan></text></svg>