<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 1360 560"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah6741d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="420" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="330" width="420" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="450" width="420" height="100" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="600" y="300" width="300" height="140" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="1000" y="190" width="330" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1000" y="420" width="330" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 460.0 185.0 L 520.0 185.0 L 520.0 340.0 L 600.0 328.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 460.0 385.0 L 600.0 370.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 460.0 500.0 L 560.0 500.0 L 560.0 410.0 L 600.0 419.0" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah6741d9)"/><path d="M 900.0 342.0 L 1000.0 245.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 900.0 412.0 L 1000.0 472.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">요청 지문 — 같은 키, 다른 내용을 가른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">키가 같아도 내용이 다르면 클라이언트의 버그나 키 재사용이다. 저장된 요청 해시와 비교한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="158.1">첫 요청</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="182.1">키 K · 고객 c1 · 금액 30,000</tspan><tspan x="56.0" y="199.6">→ 지문 H1 을 키 행에 저장 (고객 + 금액의 SHA-256)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="358.1">나중 요청 — 같은 내용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="382.1">키 K · 고객 c1 · 금액 30,000</tspan><tspan x="56.0" y="399.6">→ 지문 H1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="478.1">나중 요청 — 다른 내용</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="502.1">키 K · 고객 c1 · 금액 8,000</tspan><tspan x="56.0" y="519.6">→ 지문 H2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="328.1">저장된 지문과 비교</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="352.1">선점에 실패했을 때만 비교한다</tspan><tspan x="616.0" y="369.6">(이 레슨의 replay)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="217.1">같다 → 저장된 응답을 재생</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="240.8">같은 키 = 같은 결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="447.1">다르다 → 거절</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="470.8">이 레슨: IdempotencyKeyConflictException</tspan><tspan x="1016.0" y="488.3">Stripe: 에러 · IETF 초안: 422 (SHOULD)</tspan></text><rect x="479.7" y="240.8" width="80.6" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="256.8">H1 이</tspan><tspan x="520.0" y="273.1">저장돼 있다</tspan></text><rect x="516.0" y="366.4" width="28.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="530.0" y="382.4">H1</tspan></text><rect x="546.0" y="458.9" width="28.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6741d9" text-anchor="middle" xml:space="preserve"><tspan x="560.0" y="474.9">H2</tspan></text><rect x="920.9" y="282.4" width="58.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="298.4">H1 = H1</tspan></text><rect x="917.9" y="430.9" width="64.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="950.0" y="446.9">H1 ≠ H2</tspan></text></svg>