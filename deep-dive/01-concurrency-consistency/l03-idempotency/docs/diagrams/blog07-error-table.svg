/text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">Spring Boot 3.5.16 · Spring 6.2.19 · Hibernate 6.6.53 · pgjdbc 42.7.11 · PostgreSQL 16.14, 2026-10-13, 스크래치 프로브</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="140.7">SQLSTATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="140.7">JdbcTemplate 경로</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1015.0" y="140.7">JPA (Hibernate) · Spring Data 경로</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="221.1">23505</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="220.3">DuplicateKeyException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1015.0" y="211.6">DataIntegrityViolationException</tspan><tspan x="1015.0" y="229.1">(cause: Hibernate ConstraintViolationException ← PSQLException 23505)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="313.1">40001</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="312.3">CannotAcquireLockException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1015.0" y="312.3">CannotAcquireLockException (← Hibernate LockAcquisitionException)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="405.1">40P01</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="404.3">PessimisticLockingFailureException</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1015.0" y="404.3">CannotAcquireLockException</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="120.0" y="497.1">55P03</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="496.3">UncategorizedSQLException (번역되지 않는다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1015.0" y="487.6">PessimisticLockingFailureException</tspan><tspan x="1015.0" y="505.1">(← Hibernate PessimisticLockException)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="574.1">23505 는 JPA 경로에서 DuplicateKeyException 이 아니다. 네 코드 중 JdbcTemplate 경로에서 번역되지 않는 것은 55P03 뿐이다</tspan></text></svg>