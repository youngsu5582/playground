<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="300" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="440" y="110" width="460" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="1000" y="110" width="340" height="60" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1000" y="190" width="340" height="60" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="320" width="600" height="150" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="700" y="320" width="640" height="150" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="40" y="510" width="1300" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 340.0 165.0 L 440.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 900.0 149.0 L 1000.0 140.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 900.0 201.0 L 1000.0 220.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><path d="M 640.0 395.0 L 700.0 395.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">JPA save() 와 멱등 키 — 확인한 것과 모르는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">Spring Data JPA 문서에서 확인한 범위까지만. 수동 할당 식별자면 merge 경로로 간다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.1">save(entity)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="173.3">CrudRepository</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="138.1">새 엔티티인가?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="162.1">Version 속성이 있으면 null 일 때 새것</tspan><tspan x="456.0" y="179.6">없으면 식별자 속성이 null 일 때 새것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="138.1">persist(…)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="161.1">새것이면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="218.1">merge(…)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1016.0" y="241.1">새것이 아니면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="348.1">멱등 키를 @Id 로 쓰면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="372.1">수동 할당 식별자 · version 없음</tspan><tspan x="56.0" y="389.6">→ 식별자가 항상 non-null → 새것으로 판정되지 않는다</tspan><tspan x="56.0" y="407.1">→ 기본값으로 merge 를 부르게 된다</tspan><tspan x="56.0" y="424.6">(문서: Persistable 로 isNew() 를 직접 정하는 방법도 소개)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="348.1">확인하지 못한 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="372.1">merge 가 내부에서 SELECT 를 먼저 내는지</tspan><tspan x="716.0" y="389.6">그래서 SELECT → INSERT 틈이 생기는지</tspan><tspan x="716.0" y="407.1">(Spring Data 문서에 그 서술이 없다)</tspan></text><rect x="634.5" y="383.9" width="71.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="670.0" y="399.9">그다음은?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="537.1">그래서 JPA save 를 멱등 선점에 쓰는 것은 추천하지 않는다 (해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="560.8">선점은 JdbcTemplate/네이티브 쿼리의 INSERT … ON CONFLICT DO NOTHING + 영향 행 수로 하고, JPA 엔티티는 선점 뒤의 읽기 · 저장에 쓴다</tspan></text></svg>