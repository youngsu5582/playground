<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="520" viewBox="0 0 1360 520"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="280" y="110" width="480" height="44" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="800" y="110" width="520" height="44" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="40" y="180" width="220" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="280" y="180" width="480" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="800" y="180" width="520" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="340" width="220" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="280" y="340" width="480" height="130" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="800" y="340" width="520" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 260.0 245.0 L 280.0 245.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 760.0 245.0 L 800.0 245.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 260.0 405.0 L 280.0 405.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 760.0 405.0 L 800.0 405.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">예외가 @Transactional 밖으로 나오는가, 안에서 삼켜지는가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">Spring 은 런타임(언체크) 예외를 롤백 대상으로 표시하고, 체크 예외는 기본 설정에서 롤백하지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="137.7">Spring 트랜잭션 인프라가 아는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1060.0" y="137.7">DB 쪽 트랜잭션의 상태</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="207.1">예외가</tspan><tspan x="56.0" y="225.8">메서드 밖으로</tspan><tspan x="56.0" y="244.6">나온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="296.0" y="207.1">RuntimeException 계열이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="296.0" y="230.8">DuplicateKeyException 도 이 계열이다</tspan><tspan x="296.0" y="248.3">→ 롤백 대상으로 표시한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="207.1">롤백된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="230.8">(문서 05) 앞서 한 쓰기도 함께</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="367.1">예외를 안에서</tspan><tspan x="56.0" y="385.8">잡아 삼킨다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="296.0" y="367.1">어디서 잡았나에 따라 다르다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="296.0" y="389.8">JdbcTemplate 예외를 직접 잡음 → Spring 은 모른다</tspan><tspan x="296.0" y="406.1">다른 빈의 @Transactional · JPA flush 실패 →</tspan><tspan x="296.0" y="422.3">rollback-only 표시 (실측: 트랙 05)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="367.1">커밋이 조용히 롤백되거나 예외가 난다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="816.0" y="389.8">모를 때: DB 쪽만 중단 상태 → 다음 문장 거절(문서 05)</tspan><tspan x="816.0" y="406.1">· 커밋은 예외 없이 롤백된다</tspan><tspan x="816.0" y="422.3">표시됐을 때: 바깥 커밋에서 UnexpectedRollbackException</tspan></text></svg>