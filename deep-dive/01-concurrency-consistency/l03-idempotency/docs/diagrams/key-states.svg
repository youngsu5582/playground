<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="330" width="190" height="60" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="480" y="330" width="220" height="60" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="860" y="200" width="200" height="60" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="860" y="460" width="200" height="60" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1160" y="330" width="200" height="60" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="40" y="560" width="620" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="700" y="560" width="660" height="200" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 230.0 360.0 L 480.0 360.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 700.0 348.0 L 860.0 230.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 700.0 372.0 L 860.0 490.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 1060.0 230.0 L 1220.0 330.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1060.0 490.0 L 1220.0 390.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">멱등 키의 상태 — 키를 먼저 커밋하는 2-트랜잭션 설계</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">(해석) 한 트랜잭션 설계에서는 &#x27;처리 중&#x27; 이 커밋되지 않으므로 상태 열이 사실상 DONE 하나뿐이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="135.0" y="366.1">키 없음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="590.0" y="366.1">IN_PROGRESS</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="235.7">DONE (응답 저장)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="496.1">FAILED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1260.0" y="366.1">만료 · 삭제</tspan></text><rect x="253.8" y="340.8" width="202.5" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="355.0" y="356.8">tx1: INSERT … ON CONFLICT</tspan><tspan x="355.0" y="373.1">DO NOTHING = 1행, 커밋</tspan></text><rect x="731.6" y="269.8" width="96.9" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="780.0" y="285.8">tx2: 처리 성공</tspan><tspan x="780.0" y="302.1">응답 저장</tspan></text><rect x="722.5" y="411.8" width="115.0" height="38.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="780.0" y="427.8">tx2: 처리 실패</tspan><tspan x="780.0" y="444.1">(저장할지는 계약)</tspan></text><rect x="1091.4" y="268.9" width="97.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="1140.0" y="284.9">보존 기간 경과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="587.1">서버가 죽으면 IN_PROGRESS 가 영영 남는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="609.8">그래서 만료 시각(lease)이 필요하다. 지나면 다른 요청이 인수한다</tspan><tspan x="56.0" y="626.1">인수는 한 문장으로 원자적이어야 한다:</tspan><tspan x="56.0" y="642.3">UPDATE … WHERE status = &#x27;IN_PROGRESS&#x27; AND 만료 &lt; now() 의 영향 행 수로 판정</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="587.1">IN_PROGRESS 인 키로 또 요청이 오면 (선택)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="609.8">기다린다: 커넥션을 쥔 채 완료를 폴링 — 구현이 무겁다</tspan><tspan x="716.0" y="626.1">409 로 돌려보낸다: 클라이언트가 나중에 재시도 (IETF 초안의 권고)</tspan><tspan x="716.0" y="642.3">요청 해시가 다르면: 처리 중 여부와 무관하게 거절 (초안: 422)</tspan></text></svg>