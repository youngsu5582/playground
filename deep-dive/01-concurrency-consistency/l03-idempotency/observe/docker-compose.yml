# 손으로 관찰하는 용도. 테스트(Testcontainers)와는 별개의 컨테이너다.
# 프로젝트 이름을 레슨마다 다르게 — 폴더 이름(observe)이 같아서 다른 레슨의 컨테이너를 덮어쓰지 않게.
name: deepdive-01-03
services:
  pg:
    image: postgres:16-alpine
    container_name: deepdive-01.03-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command: ["postgres", "-c", "deadlock_timeout=200ms", "-c", "log_lock_waits=on"]
    ports: ["55434:5432"]
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
