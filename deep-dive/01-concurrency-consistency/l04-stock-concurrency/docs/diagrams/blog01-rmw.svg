<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="440" viewBox="0 0 1460 440"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="380" height="160" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="540" y="110" width="380" height="160" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1040" y="110" width="380" height="160" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="310" width="1380" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 420.0 195.0 L 540.0 195.0" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ahe03131)"/><path d="M 920.0 195.0 L 1040.0 195.0" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">읽고 계산해서 쓰기 (read-modify-write)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">세 단계는 서로 다른 문장이다. 문장과 문장 사이가 틈이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="140.1">① 읽기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="164.6">SELECT qty FROM stock</tspan><tspan x="56.0" y="182.1">WHERE sku = ?</tspan><tspan x="56.0" y="199.6">&#160;</tspan><tspan x="56.0" y="217.1">행 락을 잡지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="140.1">② 확인</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="556.0" y="164.6">if (row.qty() &lt; n)</tspan><tspan x="556.0" y="182.1">    return false</tspan><tspan x="556.0" y="199.6">&#160;</tspan><tspan x="556.0" y="217.1">앱 메모리 안의 판단</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1056.0" y="140.1">③ 쓰기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1056.0" y="164.6">UPDATE stock SET qty = ?</tspan><tspan x="1056.0" y="182.1">앱이 계산한 절대 값 (읽은 값 - n)</tspan><tspan x="1056.0" y="199.6">&#160;</tspan><tspan x="1056.0" y="217.1">읽은 값이 낡았어도 그대로 덮어쓴다</tspan></text><rect x="466.5" y="182.6" width="27.0" height="24.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="480.0" y="200.7">틈</tspan></text><rect x="966.5" y="182.6" width="27.0" height="24.8" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="980.0" y="200.7">틈</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="338.1">틈 = 문장 사이</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="362.1">A 가 ① 을 하고 B 도 ① 을 하면 둘은 같은 값을 본다. 둘 다 &quot;재고 있네&quot; 를 확인한 뒤 ③ 으로 &quot;읽은 값 - n&quot; 을 덮어쓴다.</tspan><tspan x="56.0" y="379.6">트랜잭션 안에서도 ① 과 ③ 은 다른 문장이다. 틈은 문장 사이에 있다.</tspan></text></svg>