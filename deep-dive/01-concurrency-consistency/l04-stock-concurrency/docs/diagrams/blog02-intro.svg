<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="636" viewBox="0 0 1160 636"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="96" width="440" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="96" width="440" height="38" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="150" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="234" width="440" height="68" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="318" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="402" width="440" height="68" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="60" y="492" width="1040" height="112" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 30.0 150.0 L 30.0 476.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 500.0 184.0 L 566.0 184.0 L 566.0 268.0 L 660.0 268.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 500.0 352.0 L 594.0 352.0 L 594.0 436.0 L 660.0 436.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">도입: 같은 행에 두 UPDATE 가 동시에 온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">재고 6, A 는 2 개 · B 는 3 개를 산다. 확인(qty &gt;= n)과 차감이 한 문장 안에 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="280.0" y="120.7">세션 A  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="120.7">세션 B  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="30.0" y="132.1">시간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="177.1">1  UPDATE qty = qty - 2 WHERE qty &gt;= 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="200.8">행 락을 잡고 qty 를 4 로 바꾼다 (아직 COMMIT 전)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="261.1">2  UPDATE qty = qty - 3 WHERE qty &gt;= 3</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="284.8">같은 행이라 A 가 끝나기를 기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="345.1">3  COMMIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="368.8">행 락이 풀린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="429.1">4  (기다림이 끝나고 WHERE 를 다시 평가)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="452.8">최신 qty 4 → 4 &gt;= 3 → qty = 1, 영향 행 1</tspan></text><rect x="528.7" y="191.2" width="74.6" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="566.0" y="206.3">행 락이</tspan><tspan x="566.0" y="221.3">B 를 세운다</tspan></text><rect x="536.6" y="392.8" width="114.7" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="594.0" y="407.9">커밋된 최신 값으로</tspan><tspan x="594.0" y="422.9">B 가 재평가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="520.1">먼저 온 쪽이 줄을 세우고, 기다린 쪽은 최신 값으로 다시 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="544.1">B 는 처음 본 값(6)이 아니라 A 가 커밋한 최신 값(4)에서 계산했다. 읽기와 쓰기 사이에 낡은 값이 낄 자리가 없다.</tspan><tspan x="76.0" y="561.6">A 의 2 개가 B 의 계산에 반영되어, 둘이 합쳐 5 개가 팔리고 재고 1 이 남는다.</tspan></text></svg>