<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="440" viewBox="0 0 1460 440"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="440" height="180" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="510" y="110" width="440" height="180" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="980" y="110" width="440" height="180" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="330" width="1380" height="70" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">대기를 끊는 세 가지 방법</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">락을 기다리는 B 가 무한정 서 있지 않게 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">FOR UPDATE NOWAIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="164.3">잠긴 행이면 기다리지 않고 에러</tspan><tspan x="56.0" y="183.1">ERROR: could not obtain lock</tspan><tspan x="56.0" y="201.8">on row in relation &quot;stock&quot;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="139.1">FOR UPDATE SKIP LOCKED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="164.3">잠긴 행은 건너뛴다</tspan><tspan x="526.0" y="183.1">다른 행을 집는다</tspan><tspan x="526.0" y="201.8">(큐 소비자에 쓰는 도구)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="139.1">SET lock_timeout = &#x27;500ms&#x27;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="164.3">그만큼 기다려도 못 얻으면</tspan><tspan x="996.0" y="183.1">ERROR: canceling statement</tspan><tspan x="996.0" y="201.8">due to lock timeout</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="357.1">SKIP LOCKED 는 재고 한 행의 정합성에는 쓰지 않는다 — 건너뛰면 재고를 놓친다</tspan></text></svg>