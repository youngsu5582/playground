<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="560" viewBox="0 0 1460 560"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="520" height="68" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="620" y="110" width="800" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="194" width="520" height="68" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="620" y="194" width="800" height="68" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="278" width="520" height="68" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="620" y="278" width="800" height="68" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="362" width="520" height="68" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="620" y="362" width="800" height="68" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="446" width="520" height="68" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="620" y="446" width="800" height="68" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 560.0 144.0 L 620.0 144.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 560.0 228.0 L 620.0 228.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 560.0 312.0 L 620.0 312.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 560.0 396.0 L 620.0 396.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 560.0 480.0 L 620.0 480.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">JPA 의 PESSIMISTIC_WRITE 가 PostgreSQL 에서 나가는 SQL</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">실측: Hibernate 6.4.10 · 6.6.58 · PostgreSQL 방언 (2026-10-13). 호출 방식에 따라 갈린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="140.3">em.find(..., PESSIMISTIC_WRITE)</tspan><tspan x="300.0" y="159.1">JPQL setLockMode</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="149.7">select ... where s1_0.id=? for no key update</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="233.7">타임아웃 힌트 0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="233.7">for no key update nowait</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="317.7">타임아웃 힌트 -2</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="317.7">for no key update ... skip locked</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="401.7">타임아웃 힌트 양수 (3000)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="401.7">SQL 에 반영되지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="476.3">em.lock(entity, PESSIMISTIC_WRITE)</tspan><tspan x="300.0" y="495.1">(이미 읽은 엔티티)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" y="485.7">select id from Stock where id=? and version=? for update</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="555.1">FOR UPDATE 가 아니라 FOR NO KEY UPDATE — em.lock 만 for update</tspan></text></svg>