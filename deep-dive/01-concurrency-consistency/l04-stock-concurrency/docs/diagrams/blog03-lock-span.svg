<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="470" viewBox="0 0 1460 470"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="140" y="140" width="210" height="56" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="360" y="140" width="290" height="56" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="660" y="140" width="330" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1000" y="140" width="190" height="56" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="1200" y="140" width="190" height="56" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="1000" y="300" width="390" height="56" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="410" width="1380" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 360.0 225.0 L 1390.0 225.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#ahe03131)" marker-start="url(#ahe03131)"/><path d="M 1000.0 385.0 L 1390.0 385.0" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#ah2f9e44)" marker-start="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">락을 쥐는 구간 = 읽기부터 COMMIT 까지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">같은 재고 차감을 두 가지로 쓰면 행 락이 유지되는 시간이 달라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="127.1">비관 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="245.0" y="173.3">BEGIN</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="505.0" y="173.3">SELECT ... FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="825.0" y="173.3">앱 계산 · 판단</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1095.0" y="173.3">UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1295.0" y="173.3">COMMIT</tspan></text><rect x="837.1" y="213.2" width="75.8" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="230.3">행 락 보유</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="287.1">원자 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1195.0" y="333.3">UPDATE ... qty - n ... qty &gt;= n  → COMMIT</tspan></text><rect x="1157.1" y="373.2" width="75.8" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="1195.0" y="390.3">행 락 보유</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="436.1">앱 로직 · 외부 호출이 구간에 끼면 그만큼 뒤의 줄이 길어진다 (이 구간에는 외부 API 를 넣지 않는다)</tspan></text></svg>