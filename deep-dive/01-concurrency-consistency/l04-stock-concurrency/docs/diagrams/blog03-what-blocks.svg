<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="440" viewBox="0 0 1460 440"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="520" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="600" y="110" width="820" height="62" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="188" width="520" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="600" y="188" width="820" height="62" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="266" width="520" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="600" y="266" width="820" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="344" width="520" height="62" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="600" y="344" width="820" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">A 가 FOR UPDATE 로 행을 잠갔을 때, B 의 문장은</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">행 락은 같은 행의 쓰는 쪽과 잠그는 쪽만 막는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="147.1">B: SELECT ... FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="147.1">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="225.1">B: UPDATE · DELETE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="225.1">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="303.1">B: 평범한 SELECT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="303.1">기다리지 않는다 (락 없이 스냅샷을 읽는다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="381.1">B: 다른 행에 FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" y="381.1">기다리지 않는다 (행 단위 락)</tspan></text></svg>