<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="560" viewBox="0 0 1460 560"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="400" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="520" y="120" width="300" height="90" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="960" y="120" width="460" height="90" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="260" width="680" height="120" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="760" y="260" width="660" height="120" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="410" width="1380" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 440.0 165.0 L 520.0 165.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 820.0 165.0 L 960.0 165.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">JPA @Version 충돌이 예외로 나오는 길</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">실측: Hibernate 6.4.10 · 6.6.58 · PostgreSQL 16 (2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="240.0" y="152.8">엔티티의 qty 를 바꾸고 flush</tspan><tspan x="240.0" y="170.3">update Stock set qty=?,version=?</tspan><tspan x="240.0" y="187.8">where id=? and version=?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="670.0" y="152.8">다른 트랜잭션이 먼저</tspan><tspan x="670.0" y="170.3">version 을 올려 두었다</tspan><tspan x="670.0" y="187.8">→ 0 행 갱신</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1190.0" y="152.8">jakarta.persistence.OptimisticLockException</tspan><tspan x="1190.0" y="170.3">cause = org.hibernate.StaleObjectStateException</tspan><tspan x="1190.0" y="187.8">&quot;Row was updated or deleted by another transaction …&quot;</tspan></text><rect x="828.4" y="153.9" width="123.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="890.0" y="169.9">예외로 감싸 던진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="288.1">네이티브 Session 도 마찬가지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="312.1">flush() · commit() 모두 StaleObjectStateException 이 직접 나오지 않고</tspan><tspan x="56.0" y="329.6">OptimisticLockException 으로 감싸져 나온다</tspan><tspan x="56.0" y="347.1">→ catch (StaleObjectStateException) 만 두면 못 잡는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="288.1">던져지면 트랜잭션은 롤백 표시 (스펙 3.4.5)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="312.1">그래서 재시도는 트랜잭션 밖</tspan><tspan x="776.0" y="329.6">= 트랜잭션 전체를 다시 실행하는 쪽에 둔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="437.1">참고: 7.4.13 은 cause 사슬이 한 단계 더 길다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="460.8">StaleObjectStateException → StaleStateException (&quot;Unexpected row count (expected row count 1 but was 0)&quot;)</tspan><tspan x="56.0" y="478.3">0 행이면 이 예외가 난다는 점은 User Guide(Locking · 6.4)도 쓴다</tspan></text></svg>