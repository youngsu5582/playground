ERE version = v</tspan></text><rect x="661.0" y="178.9" width="38.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="680.0" y="194.9">충분</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="510.0" y="340.7">false (정상적인 품절)</tspan></text><rect x="484.5" y="253.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="510.0" y="269.9">모자람</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" y="195.7">영향 행 1 → true (성공)</tspan></text><rect x="1063.8" y="178.9" width="32.4" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="1080.0" y="194.9">1행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="340.7">영향 행 0 → 충돌</tspan></text><rect x="863.8" y="253.9" width="32.4" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="269.9">0행</tspan></text><rect x="408.2" y="388.2" width="223.7" height="23.5" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="520.0" y="405.3">상한 이내면 처음부터 다시 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" y="340.3">상한 초과 → IllegalStateException</tspan></text><rect x="1043.5" y="323.9" width="73.1" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="1080.0" y="339.9">20 번 넘음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="468.1">&quot;재고 부족&quot; 과 &quot;경합이 너무 심해 포기&quot; 는 다르다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="492.1">재고가 모자라면 예외가 아니라 false 다. 상한을 넘겼을 때만 예외를 던진다.</tspan><tspan x="56.0" y="509.6">재고가 있는데 품절이라고 응답하면 호출자가 거짓말을 하게 된다.</tspan></text></svg>