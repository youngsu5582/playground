ly="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">선착순 이벤트: 한 상품에 수많은 사람이 동시에 주문한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="150.0" y="150.7">요청 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="150.0" y="212.7">요청 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="150.0" y="274.7">요청 3</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="150.0" y="336.7">요청 4</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="110.0" y="387.1">... 수만 명</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="190.1">재고 행 하나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="536.0" y="214.6">세 전략 모두 같은 행에 쓰려면</tspan><tspan x="536.0" y="232.1">행 락을 순서대로 얻어야 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="140.1">그 결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="976.0" y="165.6">줄을 선 요청이 커넥션 · CPU 를 점유한다</tspan><tspan x="976.0" y="184.3">&#160;</tspan><tspan x="976.0" y="203.1">서버를 늘려도 한 행은 직렬이다</tspan><tspan x="976.0" y="221.8">&#160;</tspan><tspan x="976.0" y="240.6">전략 이름을 아는 것과</tspan><tspan x="976.0" y="259.3">병목을 설명하는 것은 다르다</tspan></text></svg>