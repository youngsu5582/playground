<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="420" viewBox="0 0 1460 420"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="220" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="340" y="130" width="300" height="80" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="720" y="130" width="260" height="80" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="1060" y="130" width="360" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="250" width="680" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="740" y="250" width="680" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 260.0 170.0 L 340.0 170.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 640.0 170.0 L 720.0 170.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 980.0 170.0 L 1060.0 170.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">대안 2 — 큐로 직렬화 (해석 / 일반 설계)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">같은 SKU 의 요청을 한 소비자가 순서대로 처리하게 모은다. 이 레슨에서 확인하지 않았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="150.0" y="166.3">요청들</tspan><tspan x="150.0" y="185.1">(SKU 를 키로)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="490.0" y="166.3">큐</tspan><tspan x="490.0" y="185.1">(같은 SKU = 한 줄)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="850.0" y="166.3">소비자 1 개</tspan><tspan x="850.0" y="185.1">순서대로 처리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1240.0" y="166.3">DB 원자 UPDATE</tspan><tspan x="1240.0" y="185.1">(마지막 방어선)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="278.1">얻는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="302.1">DB 행 락 경합이 없고 대기가 큐에서 일어난다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="278.1">대가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="302.1">응답이 비동기(접수 → 결과 통지)가 된다</tspan><tspan x="756.0" y="319.6">큐 순서 보장 범위는 큐 제품의 문서로 확인해야 한다</tspan></text></svg>