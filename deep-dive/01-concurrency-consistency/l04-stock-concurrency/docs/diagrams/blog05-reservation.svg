<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="440" viewBox="0 0 1460 440"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="130" width="340" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="480" y="130" width="340" height="90" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="920" y="130" width="500" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="920" y="190" width="500" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="270" width="680" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="740" y="270" width="680" height="110" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 380.0 175.0 L 480.0 175.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 820.0 175.0 L 920.0 150.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 820.0 175.0 L 920.0 210.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">대안 3 — 예약(reservation) + 만료 (해석 / 일반 설계)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">&quot;재고를 잡는다&quot; 와 &quot;결제로 확정한다&quot; 를 나눈다. 이 레슨에서 구현하지 않았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="210.0" y="162.8">재고 잡기</tspan><tspan x="210.0" y="180.3">reserved 수량을 올리고</tspan><tspan x="210.0" y="197.8">만료 시각을 둔다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="650.0" y="171.6">결제 대기</tspan><tspan x="650.0" y="189.1">(이 동안 락을 쥐지 않는다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1170.0" y="155.3">결제 성공 → 확정</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1170.0" y="215.3">결제 안 됨 → 만료 처리로 돌려 놓는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="298.1">얻는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="322.1">결제 대기 시간 동안 락을 쥐지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="298.1">대가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="756.0" y="322.1">만료 작업 · 이중 처리 방지 · 보상 로직이 생긴다</tspan><tspan x="756.0" y="339.6">재고 = 가용 + 예약 의 두 숫자를 일관되게 관리해야 한다</tspan></text></svg>