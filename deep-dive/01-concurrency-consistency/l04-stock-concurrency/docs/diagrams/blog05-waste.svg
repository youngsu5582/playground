<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="400" viewBox="0 0 1460 400"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="440" height="230" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="510" y="110" width="440" height="230" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="980" y="110" width="440" height="230" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">줄 선 동안 무엇이 낭비되나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">세 전략 모두 같은 행 하나에서는 줄을 선다. 차이는 낭비되는 것이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="140.1">원자 조건부 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="166.6">낭비: 거의 없음</tspan><tspan x="56.0" y="186.6">&#160;</tspan><tspan x="56.0" y="206.6">락 보유가 문장 하나라서</tspan><tspan x="56.0" y="226.6">기다린 쪽도 다시 할 일이 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="140.1">비관 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="166.6">낭비: 락 보유 시간</tspan><tspan x="526.0" y="186.6">&#160;</tspan><tspan x="526.0" y="206.6">읽기부터 COMMIT 까지</tspan><tspan x="526.0" y="226.6">뒤의 줄이 그만큼 길어진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="140.1">낙관 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="166.6">낭비: 진 쪽의 읽기와 계산 전부</tspan><tspan x="996.0" y="186.6">&#160;</tspan><tspan x="996.0" y="206.6">0 행이면 버리고 처음부터</tspan><tspan x="996.0" y="226.6">재시도 폭풍이 날 수 있다</tspan></text></svg>