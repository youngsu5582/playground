<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="350" viewBox="0 0 1460 350"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="440" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="510" y="110" width="440" height="200" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="980" y="110" width="440" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">InnoDB 에서 세 전략 (모두 해석 — 문서 문장에서 이은 것)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">MySQL 을 직접 돌려 보지 않았다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="140.1">원자 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="165.6">최신 커밋 행에 적용되고</tspan><tspan x="56.0" y="184.3">행 락으로 줄을 선다</tspan><tspan x="56.0" y="203.1">격리수준(RR · RC)과 무관하게</tspan><tspan x="56.0" y="221.8">안전해 보인다</tspan><tspan x="56.0" y="240.6">영향 행 수로 판정하는 것도 같다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="140.1">비관 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="526.0" y="165.6">SELECT ... FOR UPDATE 가</tspan><tspan x="526.0" y="184.3">최신 값을 읽고 잠근다</tspan><tspan x="526.0" y="203.1">&#160;</tspan><tspan x="526.0" y="221.8">일반 SELECT 로 읽고 UPDATE</tspan><tspan x="526.0" y="240.6">하면 안 된다 — RR 에서</tspan><tspan x="526.0" y="259.3">일반 SELECT 는 옛 스냅샷</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="140.1">낙관 락</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="996.0" y="165.6">WHERE version = ? 는</tspan><tspan x="996.0" y="184.3">최신 커밋 행에 평가되어</tspan><tspan x="996.0" y="203.1">충돌 시 0 행이 된다</tspan><tspan x="996.0" y="221.8">&#160;</tspan><tspan x="996.0" y="240.6">PostgreSQL RR 처럼 40001 로</tspan><tspan x="996.0" y="259.3">먼저 막는 경로가 없다</tspan><tspan x="996.0" y="278.1">(직접 확인하지 않았다)</tspan></text></svg>