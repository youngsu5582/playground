<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="130" width="220" height="108" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="290" y="140" width="190" height="78" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="520" y="140" width="190" height="78" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="750" y="140" width="190" height="78" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="980" y="140" width="190" height="78" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="30" y="360" width="220" height="108" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="290" y="370" width="190" height="78" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="520" y="370" width="190" height="78" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="750" y="370" width="190" height="78" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="980" y="370" width="190" height="78" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="1210" y="370" width="190" height="78" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="30" y="590" width="220" height="108" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="290" y="600" width="190" height="78" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="520" y="600" width="190" height="78" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="750" y="600" width="190" height="78" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="980" y="600" width="190" height="78" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1210" y="600" width="190" height="78" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><path d="M 480.0 179.0 L 520.0 179.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 710.0 179.0 L 750.0 179.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 940.0 179.0 L 980.0 179.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 480.0 409.0 L 520.0 409.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 710.0 409.0 L 750.0 409.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 940.0 409.0 L 980.0 409.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1170.0 409.0 L 1210.0 409.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 480.0 639.0 L 520.0 639.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 710.0 639.0 L 750.0 639.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 940.0 639.0 L 980.0 639.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1170.0 639.0 L 1210.0 639.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 1290.0 688.0 L 1290.0 718.0 L 385.0 718.0 L 385.0 678.0" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">구매자 B 의 길 — 세 전략 (A 가 같은 행을 먼저 잡고 있다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">재고 행에 A 가 먼저 UPDATE 중일 때, 늦게 온 B 가 거치는 단계. 빨간 칸 = 기다림, 노란 칸 = 버려지고 다시 하는 일</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="157.1">원자 조건부 UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="179.8">문장 1개 · 왕복 1회</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="385.0" y="175.8">UPDATE … qty = qty - 1</tspan><tspan x="385.0" y="192.1">WHERE qty &gt;= 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="175.8">A 가 끝나기를</tspan><tspan x="615.0" y="192.1">기다림 (행 락)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="845.0" y="175.8">A 커밋 → 최신 행에</tspan><tspan x="845.0" y="192.1">WHERE 재평가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1075.0" y="175.8">영향 행 1 = 성공</tspan><tspan x="1075.0" y="192.1">0 = 품절</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="290.0" y="252.1">행 락을 쥐는 시간 = UPDATE 문장 하나 + 커밋까지. 다시 하는 일 없음</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="387.1">비관 락 (FOR UPDATE)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="409.8">트랜잭션 · 왕복 3회</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="385.0" y="405.8">BEGIN</tspan><tspan x="385.0" y="422.1">SELECT … FOR UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="405.8">A 가 끝나기를</tspan><tspan x="615.0" y="422.1">기다림 (행 락)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="845.0" y="405.8">A 커밋 → 최신 qty</tspan><tspan x="845.0" y="422.1">를 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1075.0" y="405.8">앱이 계산 →</tspan><tspan x="1075.0" y="422.1">UPDATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1305.0" y="405.8">COMMIT</tspan><tspan x="1305.0" y="422.1">= 락 해제</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="290.0" y="482.1">행 락을 쥐는 시간 = 읽기부터 COMMIT 까지. 그 사이 앱 로직·외부 호출이 끼면 그만큼 줄이 길어진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="617.1">낙관 락 (version)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="639.8">읽을 땐 락 없음 · 충돌 시 재시도</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="385.0" y="635.8">SELECT qty, version</tspan><tspan x="385.0" y="652.1">(락 없음)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="615.0" y="635.8">앱 계산</tspan><tspan x="615.0" y="652.1">(틈)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="845.0" y="635.8">UPDATE … WHERE</tspan><tspan x="845.0" y="652.1">version = v</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1075.0" y="635.8">A 가 끝나기를</tspan><tspan x="1075.0" y="652.1">기다림 (UPDATE 순간)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1305.0" y="635.8">A 커밋 → version</tspan><tspan x="1305.0" y="652.1">바뀜 → 0행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="290.0" y="744.1">0행이면 처음부터 다시 읽는다 (상한 MAX_ATTEMPTS). 진 횟수만큼 읽기 · 계산이 버려진다</tspan></text><rect x="746.2" y="706.9" width="182.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="837.5" y="722.9">재시도 — 읽기부터 전부 다시</tspan></text></svg>