<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="ah1971c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="820" height="740" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="70" y="180" width="250" height="110" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="70" y="330" width="250" height="250" rx="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><rect x="360" y="160" width="470" height="480" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-dasharray="7 5"/><rect x="385" y="215" width="420" height="150" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><rect x="385" y="425" width="420" height="190" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><rect x="360" y="670" width="150" height="46" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="535" y="670" width="130" height="46" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="690" y="670" width="140" height="46" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="70" y="740" width="760" height="92" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="900" y="110" width="500" height="740" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7 5"/><rect x="925" y="180" width="450" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="925" y="440" width="450" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="925" y="700" width="450" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 320.0 235.0 L 340.0 235.0 L 340.0 290.0 L 385.0 290.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 595.0 365.0 L 595.0 425.0" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#ah1971c2)"/><path d="M 439.9 640.0 L 435.0 670.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 595.0 640.0 L 600.0 670.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 759.5 640.0 L 760.0 670.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 1150.0 380.0 L 1150.0 440.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">이벤트 중복 · 순서 — DB 에 도착한 순간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">at-least-once 라서 같은 메시지가 또 오고, 늦은 과거가 온다. messageId 로 중복을, version 으로 역전을 거른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="60.0" y="141.1">이벤트가 지나는 길 — 전부 한 트랜잭션 (Q05 · Q06)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="209.1">이벤트 도착</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="232.3">messageId = m-7</tspan><tspan x="86.0" y="248.6">shipment s1 · version 3</tspan><tspan x="86.0" y="264.8">status = DELIVERED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="357.1">왜 축이 둘인가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="379.8">messageId</tspan><tspan x="86.0" y="396.1">같은 메시지의 재전달을 거른다</tspan><tspan x="86.0" y="412.3">→ 부수 효과(알림 · 적립)가</tspan><tspan x="86.0" y="428.6">    두 번 나가지 않는다 (Q01)</tspan><tspan x="86.0" y="444.8">&#160;</tspan><tspan x="86.0" y="461.1">version</tspan><tspan x="86.0" y="477.3">다른 메시지의 역전을 거른다</tspan><tspan x="86.0" y="493.6">→ 최신 상태가 과거로</tspan><tspan x="86.0" y="509.8">    되돌아가지 않는다 (Q02)</tspan><tspan x="86.0" y="526.1">&#160;</tspan><tspan x="86.0" y="542.3">하나만 두면 다른 쪽이 샌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="376.0" y="184.1">BEGIN … COMMIT  (실패하면 둘 다 ROLLBACK)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="401.0" y="243.1">1  inbox 선점</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="401.0" y="266.1">INSERT INTO inbox (message_id) VALUES (?)</tspan><tspan x="401.0" y="282.3">ON CONFLICT DO NOTHING</tspan><tspan x="401.0" y="298.6">&#160;</tspan><tspan x="401.0" y="314.8">영향 0행 = 이미 처리한 메시지 → DUPLICATE (끝)  Q04</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="401.0" y="453.1">2  version 조건부 반영</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="401.0" y="476.1">INSERT INTO shipment … ON CONFLICT (id)</tspan><tspan x="401.0" y="492.3">DO UPDATE SET …</tspan><tspan x="401.0" y="508.6">WHERE shipment.version &lt; 이벤트 version</tspan><tspan x="401.0" y="524.8">&#160;</tspan><tspan x="401.0" y="541.1">영향 1행 = 반영 → APPLIED</tspan><tspan x="401.0" y="557.3">영향 0행 = 늦게 온 과거 → STALE  Q03</tspan></text><rect x="545.0" y="383.9" width="100.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="595.0" y="399.9">새 메시지 (1행)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="435.0" y="698.3">DUPLICATE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="600.0" y="698.3">STALE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="760.0" y="698.3">APPLIED</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="766.1">동시에 같은 키 (Q07 · Q08 · Q09)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="86.0" y="787.6">WHERE version &lt; v 는 행 락을 기다린 뒤 최신 값으로 다시 평가된다 → v2 · v3 어느 순서로 와도 최종 version 3</tspan><tspan x="86.0" y="802.6">같은 messageId 의 두 번째 INSERT 도 첫째의 커밋/롤백을 기다린다 → 커밋이면 0행, 롤백이면 1행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="920.0" y="141.1">inbox 기록과 반영이 갈라지면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="206.1">따로 커밋 (Q05) — 처리됨인데 상태는 그대로</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="229.6">1  INSERT inbox → COMMIT</tspan><tspan x="941.0" y="247.1">2  UPDATE shipment → 실패 (장애)</tspan><tspan x="941.0" y="264.6">3  재전달: INSERT inbox → 0행</tspan><tspan x="941.0" y="282.1">    → DUPLICATE 로 건너뜀</tspan><tspan x="941.0" y="299.6">&#160;</tspan><tspan x="941.0" y="317.1">결과  status = READY</tspan><tspan x="941.0" y="334.6">이 이벤트는 영영 반영되지 않는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="466.1">한 트랜잭션 (Q06) — 실패하면 기록도 사라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="489.6">1  INSERT inbox</tspan><tspan x="941.0" y="507.1">2  UPDATE shipment → 실패 → ROLLBACK</tspan><tspan x="941.0" y="524.6">3  재전달: INSERT inbox → 1행</tspan><tspan x="941.0" y="542.1">    → 정상 반영</tspan><tspan x="941.0" y="559.6">&#160;</tspan><tspan x="941.0" y="577.1">결과  status = DELIVERED</tspan><tspan x="941.0" y="594.6">재전달이 곧 재시도가 된다</tspan></text><rect x="1084.5" y="398.9" width="131.1" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="414.9">같은 장애, 다른 결말</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="726.1">다음 레슨</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="941.0" y="748.6">Kafka 의 offset 커밋과 이 inbox 를 잇는 이야기는 02.03</tspan></text></svg>