<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="460" viewBox="0 0 1360 460"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="400" height="240" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="480" y="120" width="400" height="240" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="920" y="120" width="400" height="240" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">acks — 프로듀서가 기다리는 확인</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">기본값은 all (Kafka 4.0 producer configs)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">acks=0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="171.1">브로커 확인을 전혀 기다리지 않는다</tspan><tspan x="56.0" y="187.3">(retries 효과 없음, 오프셋은 늘 -1)</tspan><tspan x="56.0" y="203.6">&#160;</tspan><tspan x="56.0" y="219.8">잃는 경우: 보냈는지조차 모른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="496.0" y="148.1">acks=1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="496.0" y="171.1">리더가 자기 로컬 로그에 쓰면 응답</tspan><tspan x="496.0" y="187.3">팔로워는 기다리지 않는다</tspan><tspan x="496.0" y="203.6">&#160;</tspan><tspan x="496.0" y="219.8">잃는 경우: 응답 뒤 복제 전에 리더가</tspan><tspan x="496.0" y="236.1">죽으면 &quot;the record will be lost&quot;</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="936.0" y="148.1">acks=all  (기본)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="936.0" y="171.1">리더가 ISR 전체의 확인을 기다린다</tspan><tspan x="936.0" y="187.3">ISR 에 복제본이 하나라도 살아 있는 한</tspan><tspan x="936.0" y="203.6">레코드는 사라지지 않는다 (가장 강한 보장)</tspan><tspan x="936.0" y="219.8">&#160;</tspan><tspan x="936.0" y="236.1">구멍: 다음 그림</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="404.1">enable.idempotence(기본 true)가 acks=all 을 요구하므로 충돌하는 acks 를 명시하면 idempotence 가 꺼지거나 ConfigException 이다</tspan></text></svg>