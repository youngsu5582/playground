<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="480" viewBox="0 0 1360 480"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="270" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="370" y="120" width="270" height="150" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="700" y="120" width="270" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="1030" y="120" width="270" height="150" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="310" width="1280" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><path d="M 310.0 195.0 L 370.0 195.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 640.0 195.0 L 700.0 195.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 970.0 195.0 L 1030.0 195.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">처리가 길어지면 정상 동작인데 중복이 난다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">max.poll.interval.ms 기본 300000 (5분) · max.poll.records 기본 500 (Consumer configs)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">1  poll() 로 받는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="171.1">한 번에 최대 500 건</tspan><tspan x="56.0" y="187.3">(max.poll.records)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="148.1">2  처리가 느리다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="171.1">레코드당 처리가 길어</tspan><tspan x="386.0" y="187.3">다음 poll() 이 늦어진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="148.1">3  기본 5분을 넘긴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="171.1">poll() 간격이 max.poll.interval.ms</tspan><tspan x="716.0" y="187.3">를 넘으면 실패한 것으로 간주</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="148.1">4  리밸런스</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="171.1">파티션이 다른 멤버에게 간다</tspan><tspan x="1046.0" y="187.3">마지막 커밋 위치부터 읽는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="338.1">(해석) 처리 중이던 레코드가 다른 컨슈머에게 다시 간다 = 재처리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="361.1">에러도 장애도 아닌 정상 동작이다. 확인은 리밸런스 로그와 처리 시간 · 배치 크기(max.poll.records)</tspan><tspan x="56.0" y="377.3">대응: 배치를 줄이거나 처리를 가볍게 한다 (상한을 늘리면 실패 감지가 늦어지는 대가 — 해석). 어차피 재전달은 오므로 inbox 로 멱등하게 둔다</tspan></text></svg>