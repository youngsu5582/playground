<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="134" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="370" y="134" width="290" height="140" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="700" y="134" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="1030" y="134" width="290" height="140" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="352" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="370" y="352" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="700" y="352" width="290" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1030" y="352" width="290" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="530" width="1280" height="80" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><path d="M 330.0 204.0 L 370.0 204.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 660.0 204.0 L 700.0 204.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 990.0 204.0 L 1030.0 204.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 330.0 422.0 L 370.0 422.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 660.0 422.0 L 700.0 422.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 990.0 422.0 L 1030.0 422.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">발행 쪽 중복 — 프로듀서 재시도와 idempotent producer</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">브로커 ack 를 못 받은 프로듀서가 같은 레코드를 다시 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="120.1">0.11.0.0 이전, 또는 idempotence 가 꺼진 경우</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="162.1">프로듀서가 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="185.1">레코드 R 을 전송</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="162.1">브로커는 썼다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="185.1">그런데 ack 가 프로듀서에</tspan><tspan x="386.0" y="201.3">닿지 못한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="162.1">프로듀서가 재시도한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="185.1">ack 를 못 받았으니</tspan><tspan x="716.0" y="201.3">같은 R 을 다시 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="162.1">로그에 R 이 두 번</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="185.1">재시도가 중복을 만든다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="338.1">idempotent producer (0.11.0.0 부터, enable.idempotence 기본 true)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="380.1">프로듀서가 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="403.1">브로커가 프로듀서에 ID 를 주고</tspan><tspan x="56.0" y="419.3">레코드마다 시퀀스 번호가 붙는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="380.1">ack 를 못 받아 재시도</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="403.1">같은 ID · 같은 시퀀스 번호로</tspan><tspan x="386.0" y="419.3">R 을 다시 보낸다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="380.1">브로커가 버린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="403.1">이미 본 시퀀스 번호라</tspan><tspan x="716.0" y="419.3">중복을 버린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="380.1">로그에 R 이 한 번</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="403.1">프로듀서 세션이 로그에 쓰는</tspan><tspan x="1046.0" y="419.3">중복만 막는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="558.1">막지 못하는 것</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="581.1">앱이 같은 이벤트를 새로 두 번 send() 하면 시퀀스가 서로 다른 별개 레코드다 (해석) — 컨슈머의 재읽기도 막지 못한다</tspan></text></svg>