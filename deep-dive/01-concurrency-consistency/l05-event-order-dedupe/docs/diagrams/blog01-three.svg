<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="400" viewBox="0 0 1360 400"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="400" height="200" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="480" y="120" width="400" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="920" y="120" width="400" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">세 가지 전달 보장과 각각의 대가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">Kafka 문서 Message Delivery Semantics 가 나누는 세 가지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">at-most-once</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="171.1">메시지를 잃을 수 있지만</tspan><tspan x="56.0" y="187.3">다시 전달되지는 않는다</tspan><tspan x="56.0" y="203.6">&#160;</tspan><tspan x="56.0" y="219.8">대가: 유실</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="496.0" y="148.1">at-least-once</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="496.0" y="171.1">잃지 않지만</tspan><tspan x="496.0" y="187.3">다시 전달될 수 있다</tspan><tspan x="496.0" y="203.6">&#160;</tspan><tspan x="496.0" y="219.8">대가: 중복  (Kafka 의 기본 형태)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="936.0" y="148.1">exactly-once</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="936.0" y="171.1">한 번만 처리된다</tspan><tspan x="936.0" y="187.3">&#160;</tspan><tspan x="936.0" y="203.6">대가: 협조가 필요하다</tspan><tspan x="936.0" y="219.8">(Kafka 안은 트랜잭션, 밖은 앱)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="354.1">문서는 문제를 발행(publish)의 보장과 소비(consume)의 보장으로 나눈다 — 중복은 양쪽 모두에서 생길 수 있다</tspan></text></svg>