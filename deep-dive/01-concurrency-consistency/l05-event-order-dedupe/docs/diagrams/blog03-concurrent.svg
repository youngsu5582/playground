<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 1360 560"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="560" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="760" y="110" width="560" height="110" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="290" width="560" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="760" y="290" width="560" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M 600.0 165.0 L 760.0 165.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 320.0 220.0 L 320.0 290.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 1040.0 220.0 L 1040.0 290.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">같은 messageId 가 동시에 — 둘째는 첫째의 결말에 따라 정해진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">inbox 의 PK 유니크 인덱스가 줄을 세운다 (실측: psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">세션 A: BEGIN; INSERT &#x27;m-5&#x27; ON CONFLICT DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="161.1">아직 커밋 전 — A 의 트랜잭션 ID 가 열려 있다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="138.1">세션 B: 같은 INSERT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="161.1">멈춘다 — Lock / transactionid</tspan><tspan x="776.0" y="177.3">상대 트랜잭션 ID 가 끝나기를 기다린다</tspan></text><rect x="650.0" y="147.0" width="60.0" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="680.0" y="162.1">B 가</tspan><tspan x="680.0" y="177.1">기다린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="318.1">A 가 COMMIT 하면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="341.1">B 는 충돌로 보고 건너뛴다 (DUPLICATE)</tspan><tspan x="56.0" y="357.3">&#160;</tspan><tspan x="56.0" y="373.6">에러가 아니다 — 결과는 0행</tspan><tspan x="56.0" y="389.8">inbox 에는 m-5 한 건</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="318.1">A 가 ROLLBACK 하면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="776.0" y="341.1">A 의 기록은 사라졌다</tspan><tspan x="776.0" y="357.3">B 가 넣고 진행한다 (처음 보는 메시지)</tspan><tspan x="776.0" y="373.6">&#160;</tspan><tspan x="776.0" y="389.8">inbox 에는 m-5 한 건</tspan></text><rect x="302.0" y="244.5" width="36.0" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="320.0" y="259.6">커밋</tspan></text><rect x="1022.0" y="244.5" width="36.0" height="21.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="1040.0" y="259.6">롤백</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="519.1">이 대기는 행이 아니라 트랜잭션의 끝을 기다린다 — 그래서 inbox INSERT 는 반영과 같은 트랜잭션 안에 있어야 의미가 맞다</tspan></text></svg>