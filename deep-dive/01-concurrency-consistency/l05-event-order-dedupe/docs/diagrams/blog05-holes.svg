<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="540" viewBox="0 0 1360 540"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="410" height="380" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="475" y="110" width="410" height="380" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="910" y="110" width="410" height="380" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">messageId 와 version — 서로 다른 구멍을 막는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">가진 것에 따라 막는 것과 새는 것이 다르다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">messageId 만 (inbox)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="161.1">막는 것</tspan><tspan x="56.0" y="177.3">같은 메시지의 재전달</tspan><tspan x="56.0" y="193.6">&#160;</tspan><tspan x="56.0" y="209.8">새는 것</tspan><tspan x="56.0" y="226.1">처음 보는 다른 과거 메시지가</tspan><tspan x="56.0" y="242.3">상태를 되돌린다</tspan><tspan x="56.0" y="258.6">(Q02 와 같은 현상)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="491.0" y="138.1">version 만</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="491.0" y="161.1">막는 것</tspan><tspan x="491.0" y="177.3">늦은 과거</tspan><tspan x="491.0" y="193.6">&#160;</tspan><tspan x="491.0" y="209.8">새는 것 — 조건에 따라 다르다</tspan><tspan x="491.0" y="226.1">&lt; 비교이고 부수 효과를 APPLIED 일</tspan><tspan x="491.0" y="242.3">때만 일으키면 재전달도 STALE 이라</tspan><tspan x="491.0" y="258.6">한 번이다</tspan><tspan x="491.0" y="274.8">새는 경우: &lt;=, 부수 효과가 version 판정</tspan><tspan x="491.0" y="291.1">과 무관, delta 인데 version 이 건너뜀</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="926.0" y="138.1">둘 다 + 한 트랜잭션</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="926.0" y="161.1">막는 것</tspan><tspan x="926.0" y="177.3">위 둘</tspan><tspan x="926.0" y="193.6">&#160;</tspan><tspan x="926.0" y="209.8">새는 것</tspan><tspan x="926.0" y="226.1">외부 호출</tspan><tspan x="926.0" y="242.3">inbox 보존 기간 밖의 재전달</tspan></text></svg>