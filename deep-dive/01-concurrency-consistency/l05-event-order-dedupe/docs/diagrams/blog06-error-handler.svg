<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="290" height="140" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="370" y="120" width="290" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="700" y="120" width="290" height="140" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="1030" y="120" width="290" height="140" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="300" width="620" height="140" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="700" y="300" width="620" height="140" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="470" width="1280" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><path d="M 330.0 190.0 L 370.0 190.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 660.0 190.0 L 700.0 190.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 990.0 190.0 L 1030.0 190.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">리스너가 예외를 던지면 — DefaultErrorHandler</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">기본 백오프 FixedBackOff(0L, 9) — 간격 0, 재시도 9회 (Spring Kafka · Handling Exceptions)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="148.1">리스너가 예외를 던진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="171.1">컨테이너가 에러 핸들러를 부른다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="148.1">보류 중인 오프셋 커밋</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="386.0" y="171.1">문서: 에러 핸들러를 부르기 전에</tspan><tspan x="386.0" y="187.3">먼저 한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="148.1">seek 로 되감아 재호출</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="171.1">같은 레코드를 같은 리스너가</tspan><tspan x="716.0" y="187.3">다시 받는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="148.1">최초 1회 + 재시도 9회</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1046.0" y="171.1">= 열 번 (문서의 (0L, 9) 에서</tspan><tspan x="1046.0" y="187.3">센 계산이다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">열 번을 넘기면 recoverer</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="351.1">기본 복구: 레코드를 ERROR 로그로 남기고 건너뛴다</tspan><tspan x="56.0" y="367.3">DeadLetterPublishingRecoverer 로 바꾸면 DLT 로 간다</tspan><tspan x="56.0" y="383.6">(기본 대상 &lt;원본토픽&gt;-dlt, 같은 파티션 — DLT 파티션 수가 원본 이상)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="328.1">fatal 예외는 재시도 없이 첫 실패에서 복구</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="716.0" y="351.1">DeserializationException ·</tspan><tspan x="716.0" y="367.3">MessageConversionException 등</tspan><tspan x="716.0" y="383.6">Error(예: OutOfMemoryError)는 이 핸들러를 거치지 않고</tspan><tspan x="716.0" y="399.8">컨슈머가 종료된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="498.1">배치 리스너 · 시도 횟수</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="521.1">배치 리스너는 배치 전체가 재처리된다 — 재전달될 때 레코드 수 · 순서가 같다는 보장이 없다고 문서가 쓴다</tspan><tspan x="56.0" y="537.3">KafkaHeaders.DELIVERY_ATTEMPT 로 시도 횟수를 알 수 있지만 컨테이너 속성 deliveryAttemptHeader=true 로 켜야 한다 (기본 꺼짐)</tspan></text></svg>