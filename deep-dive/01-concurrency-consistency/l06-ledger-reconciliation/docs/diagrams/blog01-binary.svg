<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="520" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="600" y="110" width="520" height="190" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="350" width="520" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="600" y="350" width="520" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 300.0 300.0 L 300.0 340.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 860.0 300.0 L 860.0 340.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">왜 float8 은 0.1 을 정확히 못 담나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">float8 은 값을 2 진수로 담는다 — 2 로 나누어 떨어지는 값만 정확하다 (일반 개념)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">0.5 · 0.25 · 0.125  (2 의 거듭제곱 분수)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">0.5   = 2 진수 0.1</tspan><tspan x="56.0" y="180.8">0.25  = 2 진수 0.01</tspan><tspan x="56.0" y="198.3">0.125 = 2 진수 0.001</tspan><tspan x="56.0" y="215.8">&#160;</tspan><tspan x="56.0" y="233.3">끝이 있는 2 진 소수 → float8 에 정확히 담긴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="139.1">0.1 · 0.2 · 1.1  (10 으로만 나누어 떨어지는 값)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="163.3">0.1 = 2 진수 0.0001100110011…</tspan><tspan x="616.0" y="180.8">&#160;</tspan><tspan x="616.0" y="198.3">1 0 0 1 1 이 끝없이 반복되는 2 진 소수</tspan><tspan x="616.0" y="215.8">→ 8 바이트에 잘라 담는다 = 근사값</tspan></text><rect x="268.0" y="308.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="324.9">정확하다</tspan></text><rect x="834.5" y="308.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="860.0" y="324.9">잘린다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="377.1">실측 (psql 2026-10-13)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="400.8">0.125::float8 + 0.125::float8 = 0.25::float8  →  true</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="377.1">실측 (psql 2026-10-13)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="400.8">1.1::float8 + 2.2::float8 = 3.3::float8 → false</tspan><tspan x="616.0" y="418.3">(차이 약 4.44e-16)</tspan></text></svg>