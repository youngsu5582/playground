<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="520" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="600" y="110" width="520" height="130" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="300" width="1080" height="150" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 300.0 240.0 L 300.0 290.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 860.0 240.0 L 860.0 290.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">큰 금액은 소수 자리가 아니라 정수 자리에서도 새기 시작한다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">float8 은 정밀도가 최소 15 자리 (문서 8.1) — 17 자리 금액은 센트를 못 담는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">정수 17 자리</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">12345678901234567 :: bigint</tspan><tspan x="56.0" y="180.8">→ :: float8 → :: bigint</tspan><tspan x="56.0" y="198.3">→ 12345678901234568   (끝자리가 바뀐다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="139.1">금액 12345678901234567.89</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="616.0" y="163.3">float8   1.2345678901234568e+16   (센트 소실)</tspan><tspan x="616.0" y="180.8">numeric  12345678901234567.89   (그대로)</tspan></text><rect x="235.6" y="253.9" width="128.7" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="300.0" y="269.9">정밀도 최소 15 자리</tspan></text><rect x="804.9" y="253.9" width="110.3" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="860.0" y="269.9">자리 수가 넘는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">정리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="352.1">문서(8.1): double precision 은 범위 약 1E-307 ~ 1E+308, 정밀도 최소 15 자리 — 17 자리 금액은 이 보장을 넘는다.</tspan><tspan x="56.0" y="369.6">실측(psql 2026-10-13): 위 두 줄. 값이 &quot;조금 틀린다&quot; 가 아니라 끝자리가 바뀌어 센트가 사라진다.</tspan><tspan x="56.0" y="387.1">이 레슨 구현 테스트의 방법 검사도 같은 금액(12345678901234567.89)을 쓴다.</tspan></text></svg>