-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="539.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="613.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="687.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="761.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="40" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="806.0" y="178.2">.</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="875.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="949.0" y="157.6">0~9</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1971c2" text-anchor="middle" xml:space="preserve"><tspan x="430.0" y="216.1">정수부 최대 10 자리  (precision - scale)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="914.0" y="216.1">소수부 2 자리 (scale)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="279.1">저장할 수 있는 범위</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="303.3">정수부 10 자리 + 소수부 2 자리</tspan><tspan x="56.0" y="320.8">문서 8.1 의 예: NUMERIC(3, 1) 은 1 자리로 반올림하고</tspan><tspan x="56.0" y="338.3">-99.9 ~ 99.9 를 저장할 수 있다 — 같은 규칙이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="696.0" y="279.1">numeric 자체의 한계 (문서 8.1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="696.0" y="303.3">선언할 수 있는 precision 최대 1000</tspan><tspan x="696.0" y="320.8">선언 없는 numeric: 소수점 앞 131072 자리 · 뒤 16383 자리까지</tspan></text></svg>