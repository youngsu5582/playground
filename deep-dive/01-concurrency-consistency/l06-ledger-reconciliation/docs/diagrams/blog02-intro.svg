<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="330" height="120" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="440" y="110" width="280" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="740" y="110" width="280" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="440" y="190" width="280" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="740" y="190" width="380" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="300" width="1080" height="140" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 370.0 170.0 L 440.0 138.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 370.0 170.0 L 440.0 218.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">도입: 잔고가 70 인데, 왜 70 인가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">잔고를 숫자 하나로만 들고 있으면 &quot;지금 값&quot; 만 남고 &quot;어떻게 이 값이 됐나&quot; 가 사라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">account</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="165.3">id = 11</tspan><tspan x="56.0" y="185.3">balance = 70.00</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="580.0" y="143.7">언제 줄었나?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="143.7">누가 얼마 뺐나?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="580.0" y="223.7">처음은 얼마였나?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="930.0" y="223.7">100 이었다면 30 은 어디로?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">숫자 하나로는 답할 수 없다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="352.1">잔고가 틀렸다는 사실조차 알아채기 어렵다 — 비교할 근거가 없기 때문이다.</tspan><tspan x="56.0" y="369.6">그래서 잔고를 &quot;결과&quot; 로 두고, 그 근거가 되는 거래 내역을 따로 쌓는다.  이 글이 그 구조(원장)를 설명한다.</tspan></text></svg>