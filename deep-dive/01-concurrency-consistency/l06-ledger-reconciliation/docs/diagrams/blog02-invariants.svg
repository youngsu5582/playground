<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="380" height="240" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="450" y="120" width="380" height="240" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="860" y="120" width="380" height="240" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="390" width="1200" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">지켜야 하는 세 가지 (불변식)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">이 레슨의 스키마와 테스트가 지키는 것 — 앞 둘이 지켜지면 셋째는 따라온다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="150.1">1  거래별</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="176.6">한 거래의 다리 합 = 0</tspan><tspan x="56.0" y="196.6">&#160;</tspan><tspan x="56.0" y="216.6">DB 가 커밋 때 검사한다</tspan><tspan x="56.0" y="236.6">(지연 제약 트리거 — 03)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="466.0" y="150.1">2  계좌별</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="466.0" y="176.6">잔고 = 그 계좌의 원장 합</tspan><tspan x="466.0" y="196.6">&#160;</tspan><tspan x="466.0" y="216.6">원자적 갱신으로 막고</tspan><tspan x="466.0" y="236.6">대사로 확인한다 (04 · 05)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="150.1">3  전체</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="176.6">모든 잔고의 합 = 0</tspan><tspan x="876.0" y="196.6">&#160;</tspan><tspan x="876.0" y="216.6">1 · 2 가 지켜지면 따라온다</tspan><tspan x="876.0" y="236.6">값싼 점검으로도 쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="417.1">왜 전체 합이 0 인가</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="440.8">돈이 바깥에서 들어오고 나가는 상대편으로 시스템 계정(id 0)을 두기 때문이다 (스키마 주석).  시스템 계정은 마이너스 잔고가 허용된다.</tspan><tspan x="56.0" y="458.3">그래서 이체는 돈을 만들지도 없애지도 않는다 — 전체 합이 0 이 아니면 어딘가 새거나 어긋난 것이다.</tspan></text></svg>