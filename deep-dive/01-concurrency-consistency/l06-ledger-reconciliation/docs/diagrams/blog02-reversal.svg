<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="560" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="680" y="110" width="560" height="150" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="680" y="300" width="180" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="870" y="300" width="180" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="1060" y="300" width="180" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="680" y="348" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="870" y="348" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="1060" y="348" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="680" y="394" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="870" y="394" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="1060" y="394" width="180" height="40" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="680" y="440" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="870" y="440" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1060" y="440" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="680" y="486" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="870" y="486" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="1060" y="486" width="180" height="40" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="300" width="560" height="240" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">잘못 올린 거래는 고치지 않고 반대 거래를 쌓는다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">T-40 (계좌 11 → 12, 50.00) 이 잘못 올라갔다고 하자 (일반 개념 · 해석)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">고쳐 쓰기  (UPDATE / DELETE)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">원장의 T-40 줄을 수정하거나 지운다</tspan><tspan x="56.0" y="180.8">→ 이 레슨의 스키마는 BEFORE UPDATE OR DELETE 행 트리거로 막는다</tspan><tspan x="56.0" y="198.3">→ 막지 않으면 &quot;왜 이 잔고인가&quot; 의 근거가 사라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="696.0" y="139.1">반대 거래 쌓기</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="696.0" y="163.3">새 거래 R-40 : 계좌 12 → 11, 50.00</tspan><tspan x="696.0" y="180.8">원장에 줄이 둘 더 생긴다 (+ 잔고 두 곳 갱신)</tspan><tspan x="696.0" y="198.3">→ 이력이 모두 남고 합은 다시 맞는다</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="324.9">txn_id</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="324.9">account</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="324.9">amount</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="372.9">T-40</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="372.9">11</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="372.9">-50.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="418.9">T-40</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="418.9">12</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="418.9">+50.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="464.9">R-40</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="464.9">12</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="464.9">-50.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="510.9">R-40</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="960.0" y="510.9">11</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1150.0" y="510.9">+50.00</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">순서</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="353.1">1. 어긋남(또는 오류)을 찾는다 — 대사 (05)</tspan><tspan x="56.0" y="371.8">2. 원인을 본다 — 고치기 전에</tspan><tspan x="56.0" y="390.6">3. 반대 거래를 같은 방식으로 올린다</tspan><tspan x="56.0" y="409.3">    (멱등 선점 · 두 다리 · 잔고 갱신 — 04)</tspan><tspan x="56.0" y="428.1">4. 다시 대사해서 맞는지 확인한다</tspan></text></svg>