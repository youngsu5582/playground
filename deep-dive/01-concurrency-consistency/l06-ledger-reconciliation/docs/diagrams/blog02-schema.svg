 0</tspan><tspan x="56.0" y="211.1">          OR id = 0)</tspan><tspan x="56.0" y="227.3">&#160;</tspan><tspan x="56.0" y="243.6">잔고 (읽기용 요약)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="376.0" y="139.1">ledger</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="376.0" y="162.3">entry_id  bigserial  PK</tspan><tspan x="376.0" y="178.6">txn_id  text</tspan><tspan x="376.0" y="194.8">account_id  int</tspan><tspan x="376.0" y="211.1">amount  numeric(20,2)</tspan><tspan x="376.0" y="227.3">UNIQUE (txn_id, account_id)</tspan><tspan x="376.0" y="243.6">&#160;</tspan><tspan x="376.0" y="259.8">원장 (쌓기만 한다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="139.1">posted_txn</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="736.0" y="162.3">txn_id  text  PK</tspan><tspan x="736.0" y="178.6">&#160;</tspan><tspan x="736.0" y="194.8">&#160;</tspan><tspan x="736.0" y="211.1">이미 반영한 거래 id</tspan><tspan x="736.0" y="227.3">(멱등 선점)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="1026.0" y="139.1">external_statement</tspan></text><text font-family="&#x27;SF Mono&#x27;, Me