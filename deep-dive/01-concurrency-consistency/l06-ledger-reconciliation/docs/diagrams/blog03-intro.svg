<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="120" width="360" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="440" y="120" width="360" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="840" y="120" width="360" height="130" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="40" y="300" width="1160" height="170" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 400.0 185.0 L 440.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 800.0 185.0 L 840.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">도입: 두 줄을 넣는 사이에는 합이 0 이 아니다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">이체 T-50 (계좌 11 → 12, 30.00). 규칙: 한 거래의 다리 합은 0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.1">문장 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="174.3">INSERT (T-50, 11, -30.00)</tspan><tspan x="56.0" y="193.1">다리 합 = -30.00</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="149.1">문장 2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="174.3">INSERT (T-50, 12, +30.00)</tspan><tspan x="456.0" y="193.1">다리 합 = 0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="856.0" y="149.1">COMMIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="856.0" y="174.3">트랜잭션 끝</tspan><tspan x="856.0" y="193.1">최종 상태가 규칙을 지키면 된다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="328.1">문장마다 검사하면 첫 문장에서 막힌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="352.1">정상적인 이체조차 첫 줄을 넣는 순간 합이 -30 이라 규칙 위반이다.</tspan><tspan x="56.0" y="369.6">그래서 이런 규칙은 &quot;문장이 끝날 때마다&quot; 가 아니라 &quot;트랜잭션이 끝날 때&quot; 검사해야 한다 — 지연(deferred) 검사.</tspan><tspan x="56.0" y="387.1">반대로 한 행만 보고 판단할 수 있는 규칙(잔고 &gt;= 0)은 그 자리에서 바로 검사하는 편이 낫다.  이 글은 둘을 가르는 이야기다.</tspan></text></svg>