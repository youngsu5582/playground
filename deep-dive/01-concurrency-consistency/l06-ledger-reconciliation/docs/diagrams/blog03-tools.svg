<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="270" height="46" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="100" width="250" height="46" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="100" width="330" height="46" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="920" y="100" width="340" height="46" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="160" width="270" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="160" width="250" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="160" width="330" height="56" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="920" y="160" width="340" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="228" width="270" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="228" width="250" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="228" width="330" height="56" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="920" y="228" width="340" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="296" width="270" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="296" width="250" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="296" width="330" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="920" y="296" width="340" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="364" width="270" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="364" width="250" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="364" width="330" height="56" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="920" y="364" width="340" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="432" width="270" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="320" y="432" width="250" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="580" y="432" width="330" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="920" y="432" width="340" height="56" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">규칙을 지키는 도구와 검사 시점</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">PostgreSQL 16 — 지연 가능 여부는 도구마다 정해져 있다 (CREATE TABLE · SET CONSTRAINTS · CREATE TRIGGER 문서)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="128.3">도구</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="128.3">보는 범위</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="128.3">지연 가능?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="128.3">이 레슨에서</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="192.9">CHECK · NOT NULL</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="192.9">한 행</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="192.9">불가 — 항상 즉시</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="192.9">잔고 &gt;= 0 (CHECK)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="260.9">UNIQUE · PRIMARY KEY</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="260.9">인덱스 (행 사이)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="260.9">가능 (기본은 NOT DEFERRABLE)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="260.9">txn_id PK · UNIQUE (txn_id, account_id)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="328.9">FOREIGN KEY · EXCLUDE</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="328.9">다른 테이블 · 행 사이</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="328.9">가능 (기본은 NOT DEFERRABLE)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="328.9">(이 레슨에서는 쓰지 않는다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="396.9">constraint trigger</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="396.9">원하는 쿼리 (여러 행)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="396.9">가능 — AFTER · FOR EACH ROW</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="396.9">거래의 다리 합 0</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="175.0" y="464.9">일반 트리거</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="445.0" y="464.9">원하는 쿼리</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="745.0" y="464.9">SET CONSTRAINTS 대상 아님</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1090.0" y="464.9">BEFORE UPDATE OR DELETE 금지</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="523.1">근거: CREATE TABLE · SET CONSTRAINTS (UNIQUE · PK · REFERENCES · EXCLUDE 만 지연 가능, NOT NULL · CHECK 는 항상 즉시) · CREATE TRIGGER (constraint trigger 는 AFTER ROW)</tspan></text></svg>