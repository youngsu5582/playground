<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="480" viewBox="0 0 1260 480"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="150" width="300" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="440" y="160" width="260" height="56" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="840" y="110" width="380" height="60" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="840" y="230" width="380" height="60" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="40" y="340" width="1180" height="110" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 340.0 185.0 L 440.0 185.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 700.0 175.0 L 840.0 140.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><path d="M 700.0 200.0 L 840.0 260.0" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ahe8590c)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">INSERT … ON CONFLICT DO NOTHING 이 하는 일</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">문서(INSERT): 충돌한 행은 넣지 않고 건너뛴다 · 결과의 count 는 실제로 삽입된(갱신된) 행 수 · 지연 가능한 제약은 arbiter 가 될 수 없다</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="190.0" y="181.6">INSERT posted_txn (txn_id)</tspan><tspan x="190.0" y="199.1">ON CONFLICT DO NOTHING</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="570.0" y="193.7">같은 txn_id 가 있나?</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1030.0" y="145.3">없다 → 삽입 → count = 삽입된 행 수</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1030.0" y="265.3">있다 → 건너뜀 → 에러 없이 끝</tspan></text><rect x="744.5" y="128.9" width="51.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="144.9">아니오</tspan></text><rect x="757.5" y="238.9" width="25.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e8590c" text-anchor="middle" xml:space="preserve"><tspan x="770.0" y="254.9">예</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="368.1">ON CONFLICT 없이 INSERT 하면</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="392.1">충돌은 제약 위반 에러가 된다. ON CONFLICT 는 &quot;충돌 = 에러&quot; 를 &quot;충돌 = 이미 처리됨&quot; 으로 바꿔 준다 (01.03 과 연결).</tspan><tspan x="56.0" y="409.6">이 레슨은 거래 id 선점(posted_txn)을 이 문장으로 하고, ledger 의 UNIQUE(txn_id, account_id)는 뒤의 안전망이다.</tspan></text></svg>