<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="636" viewBox="0 0 1160 636"><defs><marker id="ah868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="96" width="440" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="96" width="440" height="38" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="150" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="234" width="440" height="68" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><rect x="60" y="318" width="440" height="68" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="402" width="440" height="68" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/><rect x="60" y="492" width="1040" height="112" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><path d="M 30.0 150.0 L 30.0 476.0" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ah868e96)"/><path d="M 500.0 352.0 L 580.0 352.0 L 580.0 436.0 L 660.0 436.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">읽고 → 앱에서 계산 → 덮어쓰면 한쪽 출금이 사라진다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">계좌 11 잔고 1000. A 가 100, B 가 200 을 보낸다 (앱이 잔고를 읽어 빼고 다시 쓴다)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="280.0" y="120.7">세션 A  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="880.0" y="120.7">세션 B  (READ COMMITTED)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="middle" xml:space="preserve"><tspan x="30.0" y="132.1">시간</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="177.1">1  SELECT balance</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="200.8">본 값: 1000</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="261.1">2  SELECT balance</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="284.8">본 값: 1000</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="345.1">3  UPDATE balance = 900  → COMMIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="368.8">1000 - 100</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="429.1">4  UPDATE balance = 800  → COMMIT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="676.0" y="452.8">1000 - 200  (A 의 100 이 사라진다)</tspan></text><rect x="536.7" y="376.0" width="86.6" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="580.0" y="391.1">A 의 쓰기를</tspan><tspan x="580.0" y="406.1">B 가 덮어쓴다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="520.1">잔고 800 ≠ 원장 합 700</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="76.0" y="544.1">직렬로 돌렸다면 1000 - 100 - 200 = 700.  원장에는 두 이체가 모두 쌓였는데 잔고만 800 이다 — 대사가 찾는 어긋남이 이렇게 생긴다.</tspan></text></svg>