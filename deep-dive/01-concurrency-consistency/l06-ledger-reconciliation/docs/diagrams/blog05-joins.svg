<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="380" height="120" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="46" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e03131" stroke-width="2"/><rect x="106" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e03131" stroke-width="2"/><rect x="166" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e03131" stroke-width="2"/><rect x="450" y="110" width="380" height="120" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><rect x="456" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="516" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="576" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="636" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="696" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="860" y="110" width="380" height="120" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="866" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="926" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="986" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="1046" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="1106" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="1166" y="260" width="52" height="44" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="400" width="1180" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">어떤 JOIN 이 어느 줄을 보나</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">계좌 {0, 1, 2, 6, 7} 과 원장이 있는 계좌 {0, 1, 2, 8} 을 account_id 로 맞춘다 (문서 7.2.1.1)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="138.1">INNER JOIN</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="162.1">양쪽에 다 있는 줄만</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="72.0" y="287.7">0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="132.0" y="287.7">1</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="192.0" y="287.7">2</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e03131" text-anchor="start" xml:space="preserve"><tspan x="46.0" y="344.1">6 · 7 · 8 을 못 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="466.0" y="138.1">LEFT JOIN (account 기준)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="466.0" y="162.1">계좌는 모두 + 원장 없으면 NULL</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="482.0" y="287.7">0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="542.0" y="287.7">1</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="602.0" y="287.7">2</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="662.0" y="287.7">6</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="722.0" y="287.7">7</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e8590c" text-anchor="start" xml:space="preserve"><tspan x="456.0" y="344.1">8 (계좌 없는 원장) 을 못 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="138.1">FULL OUTER JOIN</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="876.0" y="162.1">양쪽 모두 + 없는 쪽은 NULL</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="892.0" y="287.7">0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="952.0" y="287.7">1</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1012.0" y="287.7">2</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1072.0" y="287.7">6</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1132.0" y="287.7">7</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1192.0" y="287.7">8</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2f9e44" text-anchor="start" xml:space="preserve"><tspan x="866.0" y="344.1">찾는 줄을 전부 본다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="428.1">대사에서는 &quot;한쪽에만 있는 줄&quot; 이 바로 찾는 대상이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="452.1">INNER JOIN 은 그 줄을 아예 못 본다.  문서(7.2.1.1): FULL OUTER JOIN 은 먼저 inner join 을 하고, T1 의 짝 없는 줄에 T2 열을 NULL 로 채워 추가하고,</tspan><tspan x="56.0" y="469.6">T2 의 짝 없는 줄에는 T1 열을 NULL 로 채워 추가한다.  그래서 어긋남의 모든 종류가 한 번에 나온다.</tspan></text></svg>