<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="570" height="210" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="650" y="110" width="570" height="210" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="40" y="390" width="570" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="650" y="390" width="570" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><path d="M 325.0 320.0 L 325.0 380.0" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ahe03131)"/><path d="M 935.0 320.0 L 935.0 380.0" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah2f9e44)"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">NULL 은 &lt;&gt; 로 비교되지 않는다 — COALESCE 가 필요하다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">sum 은 원장이 없으면 NULL (문서 9.21). NULL 과의 비교 결과는 참이 아니라 UNKNOWN 이다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="139.1">COALESCE 없이</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="163.3">WHERE a.id IS NULL OR a.balance &lt;&gt; l.s</tspan><tspan x="56.0" y="180.8">&#160;</tspan><tspan x="56.0" y="198.3">계좌 6:  7.00 &lt;&gt; NULL  →  UNKNOWN  →  행이 걸러진다</tspan><tspan x="56.0" y="215.8">계좌 7:  0.00 &lt;&gt; NULL  →  UNKNOWN  →  걸러진다 (우연히 정상)</tspan><tspan x="56.0" y="233.3">&#160;</tspan><tspan x="56.0" y="250.8">결과: 1 · 2 · 8   ← 계좌 6 이 사라졌다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="666.0" y="139.1">COALESCE(l.s, 0) 와 비교</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="666.0" y="163.3">WHERE a.id IS NULL OR a.balance &lt;&gt; COALESCE(l.s, 0)</tspan><tspan x="666.0" y="180.8">&#160;</tspan><tspan x="666.0" y="198.3">계좌 6:  7.00 &lt;&gt; 0  →  참  →  어긋남</tspan><tspan x="666.0" y="215.8">계좌 7:  0.00 &lt;&gt; 0  →  거짓  →  정상 (빈 계좌)</tspan><tspan x="666.0" y="233.3">&#160;</tspan><tspan x="666.0" y="250.8">결과: 1 · 2 · 6 · 8</tspan></text><rect x="278.2" y="338.9" width="93.6" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#e03131" text-anchor="middle" xml:space="preserve"><tspan x="325.0" y="354.9">조용히 놓친다</tspan></text><rect x="903.0" y="338.9" width="64.0" height="22.2" rx="4" fill="#ffffff" fill-opacity="0.95"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2f9e44" text-anchor="middle" xml:space="preserve"><tspan x="935.0" y="354.9">정확하다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="417.1">대사가 가장 위험한 때는 못 찾았을 때다</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="440.8">빈 결과는 &quot;이상 없음&quot; 처럼 보인다.  못 찾는 대사기는 오히려 안심을 준다.</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="666.0" y="417.1">실측 (psql 2026-10-13)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="666.0" y="440.8">COALESCE 를 빼면 계좌 6 이 결과에서 빠졌다.</tspan><tspan x="666.0" y="458.3">문서: sum 은 선택된 행이 없으면 null (coalesce 로 대체).</tspan></text></svg>