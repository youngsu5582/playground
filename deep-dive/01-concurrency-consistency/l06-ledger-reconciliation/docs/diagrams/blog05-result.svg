<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="1160" height="130" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="260" width="100" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="148" y="260" width="300" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="456" y="260" width="260" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="724" y="260" width="400" height="40" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="308" width="100" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="148" y="308" width="300" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="456" y="308" width="260" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="724" y="308" width="400" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="356" width="100" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="148" y="356" width="300" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="456" y="356" width="260" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="724" y="356" width="400" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="404" width="100" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="148" y="404" width="300" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="456" y="404" width="260" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="724" y="404" width="400" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="40" y="452" width="100" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="148" y="452" width="300" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="456" y="452" width="260" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><rect x="724" y="452" width="400" height="40" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="52.1">FULL OUTER JOIN 대사 쿼리와 결과</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="81.1">WHERE a.id IS NULL OR a.balance &lt;&gt; COALESCE(l.s, 0)  (실측: psql 2026-10-13, 임시 테이블)</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="127.1">쿼리</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="56.0" y="149.8">SELECT COALESCE(a.id, l.account_id) AS id, a.balance, l.s</tspan><tspan x="56.0" y="166.1">FROM account a FULL OUTER JOIN (SELECT account_id, sum(amount) s FROM ledger GROUP BY account_id) l</tspan><tspan x="56.0" y="182.3">  ON l.account_id = a.id</tspan><tspan x="56.0" y="198.6">WHERE a.id IS NULL OR a.balance &lt;&gt; COALESCE(l.s, 0) ORDER BY 1</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="90.0" y="284.9">id</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.0" y="284.9">balance</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="586.0" y="284.9">ledger 합</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="924.0" y="284.9">Mismatch.Kind</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="90.0" y="332.9">1</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.0" y="332.9">65.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="586.0" y="332.9">60.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="924.0" y="332.9">BALANCE_NOT_MATCH</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="90.0" y="380.9">2</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.0" y="380.9">31.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="586.0" y="380.9">30.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="924.0" y="380.9">BALANCE_NOT_MATCH</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="90.0" y="428.9">6</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.0" y="428.9">7.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="586.0" y="428.9">NULL → 0</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="924.0" y="428.9">BALANCE_NOT_MATCH</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="90.0" y="476.9">8</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="298.0" y="476.9">NULL (계좌 없음)</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="586.0" y="476.9">4.00</tspan></text><text font-family="&#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;D2Coding&#x27;, monospace" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="924.0" y="476.9">LEDGER_WITHOUT_ACCOUNT</tspan></text><text font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#868e96" text-anchor="start" xml:space="preserve"><tspan x="40.0" y="534.1">계좌 7 (잔고 0 · 원장 없음) 은 COALESCE(NULL, 0) = 0 이라 결과에 없다 — 빈 계좌는 정상이다</tspan></text></svg>