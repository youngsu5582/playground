# 모든 레슨 테스트에 공통으로 걸리는 JUnit 설정 — testkit 이 클래스패스에 있으면 Gradle · IntelliJ 어디서 돌려도 적용된다.

# 틀린 구현(무한 재시도 · 풀리지 않는 락 대기)이 테스트를 영원히 멈추게 하지 않도록: 60초 넘으면 실패.
# 별도 스레드에서 재야 DB 소켓에 묶인 테스트도 끊긴다.
junit.jupiter.execution.timeout.default=60 s
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD

# TimelineExtension(META-INF/services 에 등록)을 켠다 — 타임라인을 테스트 끝에 찍고, 예측 전이면 숨긴다.
junit.jupiter.extensions.autodetection.enabled=true
